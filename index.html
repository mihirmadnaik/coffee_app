<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── Utils ─────────────────────────────────────────────────────────────────────
function genId() { return Math.random().toString(36).slice(2,10); }

function formatDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function formatTime(iso) {
  return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();
}
function groupByDate(entries) {
  const map = {};
  entries.forEach(e => {
    const day = e.date.slice(0,10);
    if (!map[day]) map[day] = [];
    map[day].push(e);
  });
  return Object.entries(map)
    .sort(([a],[b]) => b.localeCompare(a))
    .map(([day, items]) => ({
      label: formatDate(day + 'T12:00:00'),
      entries: items.sort((a,b) => b.date.localeCompare(a.date))
    }));
}
function getMonthName() {
  return new Date().toLocaleDateString('en-US', { month: 'long' });
}
function getMonthCount(entries) {
  const n = new Date();
  return entries.filter(e => {
    const d = new Date(e.date);
    return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
  }).length;
}

function roastLabel(n) {
  if (!n || n < 1) return null;
  return n <= 3 ? 'Light' : n <= 7 ? 'Medium' : 'Dark';
}
function roastColor(n) {
  if (!n || n < 1) return null;
  return n <= 3 ? '#C8A66A' : n <= 7 ? '#8B5530' : '#3D1A06';
}

// Dialed-in recipes are stored per bean+method in bean.dialedByMethod.
// Older data may have a single bean.dialed snapshot — normalize both shapes.
function dialedMap(bean) {
  if (!bean) return null;
  if (bean.dialedByMethod) return bean.dialedByMethod;
  if (bean.dialed) return { [bean.dialed.method || 'Brew']: bean.dialed };
  return null;
}

// ── Brew timer utilities ──────────────────────────────────────────────────────
function fmtSec(s) {
  const m = Math.floor(s/60), ss = Math.floor(s%60);
  return `${m}:${String(ss).padStart(2,'0')}`;
}
function parseTimeStr(t) {
  if (!t) return 0;
  const m = String(t).match(/(\d+)\s*[:.]\s*(\d{1,2})/);
  if (m) return (+m[1])*60 + (+m[2]);
  const n = parseFloat(t);
  if (isNaN(n)) return 0;
  return n < 10 ? Math.round(n*60) : Math.round(n);
}
function buildSteps(r) {
  const dose  = parseFloat(r.dose)  || 0;
  const water = parseFloat(r.water) || 0;
  const total = parseTimeStr(r.brewTime) || 180;
  const method = (r.method||'').toLowerCase();
  if (method.includes('espresso')) {
    return [{ at:0, label: water ? `Pull shot — target ${water}g out` : 'Pull shot' }];
  }
  if (method.includes('press')) {
    return [
      { at:0, label: water ? `Pour ${water}g, stir gently` : 'Pour water, stir gently' },
      { at:Math.max(total-30,60), label:'Break the crust, skim' },
      { at:total, label:'Plunge & serve' },
    ];
  }
  if (!water) return [{ at:0, label:'Start brewing' }];
  const bloom = dose ? Math.round(dose*2) : Math.round(water*0.15);
  const mid = Math.round(water*0.6);
  return [
    { at:0, label:`Bloom — pour ${bloom}g` },
    { at:45, label:`First pour — up to ${mid}g` },
    { at:Math.round(total*0.55), label:`Final pour — up to ${water}g` },
    { at:total, label:'Draw down' },
  ];
}

// ── Audio cue ─────────────────────────────────────────────────────────────────
// Short two-tone chime via Web Audio; created lazily on first use (a user gesture,
// e.g. starting the timer, so the AudioContext is allowed to play).
let _audioCtx = null;
function beep() {
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    [[0, 880], [0.18, 1175]].forEach(([t, freq]) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + t);
      gain.gain.exponentialRampToValueAtTime(0.25, now + t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.16);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + t); osc.stop(now + t + 0.17);
    });
  } catch (e) {}
}

// ── Brew method schemas ───────────────────────────────────────────────────────
// Each method maps to { fields, workflow }. `fields` is [label, key, placeholder,
// type?] where type ∈ 'text'(default) | 'time'(mm:ss) | 'grind'(numeric-clamp
// input, placeholder overridden by the active grinder). `workflow(f)` derives the
// timer stages from the entered params: { id, label, cue, kind, seconds } where
// kind is 'timed' (counts down `seconds`) or 'manual' (a gate that waits for a tap).
// Espresso keeps yield in `water` and shot time in `brewTime` for back-compat.
const METHOD_SCHEMAS = {
  'V60': {
    fields: [
      ['Dose (g)','dose','15g'], ['Water (ml)','water','250ml'],
      ['Water Temp','temp','94°C'], ['Grind Size','grindSize','Medium','grind'],
      ['Ratio','ratio','1:16'], ['Bloom (g)','bloomWater','40g'],
      ['Bloom Time','bloomTime','0:45','time'], ['Brew Time','brewTime','3:00','time'],
      ['Pours','pours','3'],
    ],
    workflow: f => {
      const total = parseTimeStr(f.brewTime) || 180;
      const bloomS = parseTimeStr(f.bloomTime) || 45;
      const dose = parseFloat(f.dose) || 0;
      const bloomG = parseFloat(f.bloomWater) || (dose ? Math.round(dose*2) : 40);
      return [
        { id:'bloom', kind:'timed', seconds:bloomS, label:'Bloom', cue:`Pour ${bloomG}g, saturate & wait` },
        { id:'pour',  kind:'timed', seconds:Math.max(total-bloomS,30), label:'Pour', cue:f.water?`Pour in stages up to ${f.water}`:'Pour in stages' },
        { id:'draw',  kind:'manual', label:'Draw down', cue:'Let it draw down, then serve' },
      ];
    },
  },
  'French Press': {
    fields: [
      ['Dose (g)','dose','30g'], ['Water (ml)','water','500ml'],
      ['Water Temp','temp','95°C'], ['Grind Size','grindSize','Coarse','grind'],
      ['Ratio','ratio','1:16'], ['Steep Time','steepTime','4:00','time'],
      ['2nd Steep','secondSteep','1:30','time'],
    ],
    workflow: f => {
      const s1 = parseTimeStr(f.steepTime) || 240;
      const s2 = parseTimeStr(f.secondSteep);
      const stages = [
        { id:'steep', kind:'timed', seconds:s1, label:'Steep', cue:f.water?`Add ${f.water}, saturate grounds`:'Add water, saturate grounds' },
        { id:'skim',  kind:'manual', label:'Stir & skim', cue:'Break the crust, skim the foam' },
      ];
      if (s2) stages.push({ id:'steep2', kind:'timed', seconds:s2, label:'Finish steep', cue:'Let it steep' });
      stages.push({ id:'plunge', kind:'manual', label:'Plunge & serve', cue:'Press slowly & pour' });
      return stages;
    },
  },
  'Espresso': {
    fields: [
      ['Dose In (g)','dose','18g'], ['Yield Out (g)','water','36g'],
      ['Water Temp','temp','93°C'], ['Shot Time','brewTime','28s','time'],
      ['Grind Size','grindSize','Fine','grind'], ['Ratio','ratio','1:2'],
      ['Pre-infusion','preInfusion','5s','time'], ['Pressure (bar)','pressure','9'],
      ['Basket','basket','double'],
    ],
    workflow: f => {
      const pi = parseTimeStr(f.preInfusion);
      const shot = parseTimeStr(f.brewTime) || 28;
      const stages = [];
      if (pi) stages.push({ id:'preinf', kind:'timed', seconds:pi, label:'Pre-infusion', cue:'Low-pressure saturation' });
      stages.push({ id:'shot', kind:'timed', seconds:shot, label:'Pull shot', cue:f.water?`Target ${f.water} out`:'Pull the shot' });
      return stages;
    },
  },
};
const GENERIC_SCHEMA = {
  fields: [
    ['Dose (g)','dose','15g'], ['Water (ml)','water','250ml'],
    ['Water Temp','temp','92°C'], ['Brew Time','brewTime','3:30','time'],
    ['Grind Size','grindSize','Medium-fine','grind'], ['Ratio','ratio','1:16'],
  ],
  workflow: r => {
    const steps = buildSteps(r);
    const total = parseTimeStr(r.brewTime) || (steps.length ? steps[steps.length-1].at : 0);
    return steps.map((s,i) => ({ id:'s'+i, kind:'timed', label:s.label, cue:s.label,
      seconds: Math.max((i < steps.length-1 ? steps[i+1].at : total) - s.at, 5) }));
  },
};
function getMethodSchema(method) { return METHOD_SCHEMAS[method] || GENERIC_SCHEMA; }

// ── Geo / map utilities ───────────────────────────────────────────────────────
function haversineM(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const f1 = lat1*Math.PI/180, f2 = lat2*Math.PI/180;
  const df = (lat2-lat1)*Math.PI/180, dl = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(df/2)**2 + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// Downscale a photo to maxDim px (long edge) and return a JPEG data URL.
// Keeps vision-API token cost low: a 12MP bag photo becomes ~1MP.
function downscaleImage(file, maxDim = 1024) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('could not read image')); };
    img.src = url;
  });
}

async function fetchNearbyCafes(lat, lon) {
  const q = `[out:json][timeout:15];(
    node["amenity"="cafe"](around:1200,${lat},${lon});
    node["amenity"="coffee_shop"](around:1200,${lat},${lon});
    node["shop"="coffee"](around:1200,${lat},${lon});
    node["amenity"="restaurant"]["cuisine"="coffee_shop"](around:1200,${lat},${lon});
    node["amenity"="bakery"]["coffee"="yes"](around:1200,${lat},${lon});
  );out body 60;`;
  try {
    const r = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST', body: 'data=' + encodeURIComponent(q),
      signal: AbortSignal.timeout(15000)
    });
    if (!r.ok) return [];
    return (await r.json()).elements || [];
  } catch { return []; }
}

// ── localStorage hook ─────────────────────────────────────────────────────────
function useLS(key, init) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; }
    catch { return init; }
  });
  const set = useCallback(v => {
    setVal(prev => {
      const next = typeof v === 'function' ? v(prev) : v;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      return next;
    });
  }, [key]);
  return [val, set];
}

// Supabase client (auth + future personal-data sync). The publishable key is

function queueShare(type, payload) {

  let q = [];
  try { q = JSON.parse(localStorage.getItem('share_queue')||'[]'); } catch {}
  if (!q.length) return;

const EMPTY_COMMUNITY = { beans:[], gear:[], recipes:[], vocab:{ tastingNotes:[], processes:[] } };
function useCommunity() {
  const [lib, setLib] = useState(() => {
    try { return { ...EMPTY_COMMUNITY, ...(JSON.parse(localStorage.getItem('community_cache')) || {}) }; }
    catch { return EMPTY_COMMUNITY; }
  });
  useEffect(() => {
    let live = true;
    Promise.all(['beans','gear','recipes','vocab'].map(k =>
      fetch('community/'+k+'.json', { cache:'no-cache' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
    )).then(([b,g,r,v]) => {
      if (!live) return;
      setLib(prev => {
        const next = {
          beans:   Array.isArray(b?.items) ? b.items : prev.beans,
          gear:    Array.isArray(g?.items) ? g.items : prev.gear,
          recipes: Array.isArray(r?.items) ? r.items : prev.recipes,
          vocab: {
            tastingNotes: Array.isArray(v?.tastingNotes) ? v.tastingNotes : prev.vocab.tastingNotes,
            processes:    Array.isArray(v?.processes)    ? v.processes    : prev.vocab.processes,
          },
        };
        try { localStorage.setItem('community_cache', JSON.stringify(next)); } catch {}
        return next;
      });
    });
    return () => { live = false; };
  }, []);
  return lib;
}

// ── Cloud sync engine ─────────────────────────────────────────────────────────
// Local-first: localStorage stays the working store; the cloud is a replica.
// Each sync diffs current state against a per-user "shadow" of the last synced
// state, pushes changed rows to user_data, and pulls remote changes. Records
// merge as a union across devices; for the same record edited in two places,
// last write wins — and this device's unsynced edits win over remote ones.
function syncSplitKey(k) { const i = k.indexOf(':'); return [k.slice(0,i), k.slice(i+1)]; }

function syncSnapshot(cols) {
  const m = {};
  cols.entries.forEach(e => { if (e && e.id) m['entry:'+e.id] = JSON.stringify(e); });
  cols.beans.forEach(b =>   { if (b && b.id) m['bean:'+b.id]  = JSON.stringify(b); });
  cols.gear.forEach(g =>    { if (g && g.id) m['gear:'+g.id]  = JSON.stringify(g); });
  m['setting:custom_notes']     = JSON.stringify(cols.customNotes);
  m['setting:custom_drinks']    = JSON.stringify(cols.customDrinks);
  m['setting:custom_processes'] = JSON.stringify(cols.customProcesses);
  return m;
}

// Emits UPSERTS only. Deletions are NEVER inferred from a snapshot difference
// (that caused whole-account wipes when the shadow and local data belonged to
// different accounts). Real deletions are tracked explicitly — see sync_deletes.
function syncDiff(shadow, snap) {
  const rows = [], now = new Date().toISOString();
  for (const k in snap) if (shadow[k] !== snap[k]) {
    const [kind, id] = syncSplitKey(k);
    rows.push({ id, kind, payload: JSON.parse(snap[k]), updated_at: now, deleted: false });
  }
  return rows;
}

function syncApplyRemote(rows, pendingKeys, cols) {
  let changed = false;
  const maps = {
    entry: new Map(cols.entries.map(e => [e.id, e])),
    bean:  new Map(cols.beans.map(b => [b.id, b])),
    gear:  new Map(cols.gear.map(g => [g.id, g])),
  };
  let notes = cols.customNotes, drinks = cols.customDrinks, procs = cols.customProcesses;
  rows.forEach(r => {
    if (pendingKeys.has(r.kind+':'+r.id)) return;   // this device's unsynced edit wins
    if (r.kind === 'setting') {
      const arr = Array.isArray(r.payload) ? r.payload : [];
      if (r.id === 'custom_notes') {
        const u = [...new Set([...notes, ...arr])];
        if (u.length !== notes.length) { notes = u; changed = true; }
      } else if (r.id === 'custom_drinks') {
        const u = [...new Set([...drinks, ...arr])];
        if (u.length !== drinks.length) { drinks = u; changed = true; }
      } else if (r.id === 'custom_processes') {
        const u = [...new Set([...procs, ...arr])];
        if (u.length !== procs.length) { procs = u; changed = true; }
      }
      return;
    }
    const map = maps[r.kind];
    if (!map) return;
    if (r.deleted) { if (map.delete(r.id)) changed = true; return; }
    const cur = map.get(r.id);
    if (!cur || JSON.stringify(cur) !== JSON.stringify(r.payload)) { map.set(r.id, r.payload); changed = true; }
  });
  const entries = [...maps.entry.values()].sort((a,b) => (b.date||'').localeCompare(a.date||''));
  return { changed, cols: { entries, beans:[...maps.bean.values()], gear:[...maps.gear.values()],
    customNotes: notes, customDrinks: drinks, customProcesses: procs } };
}

// Pulls the FULL user_data set every sync (RLS scopes it to this account).
// Offset-paginated by a stable key — immune to the clock-skew that made the old
// updated_at cursor silently skip another device's writes. Trivial bandwidth at
// a personal diary's scale; syncApplyRemote is idempotent so re-applying is free.
async function syncPullAll() {
  const out = [];
  const PAGE = 1000;
  for (let page = 0; page < 50; page++) {
    const from = page * PAGE;
    const { data, error } = await SB.from('user_data')
      .select('id,kind,payload,updated_at,deleted')
      .order('id', { ascending: true })
      .range(from, from + PAGE - 1);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < PAGE) break;
  }
  return out;
}

function ChipAdder({ label, presets, custom=[], onCustomChange, selected=[], onToggle }) {
  const [adding, setAdding] = useState(false);
  const [inp, setInp] = useState('');
  // include selected items even if not in presets/custom (e.g. scan-created,
  // not yet committed to the shared pool) so a selected value is never invisible
  const seen = new Set(), all = [];
  [...presets, ...custom, ...selected].forEach(n => {
    const k = String(n).toLowerCase();
    if (!seen.has(k)) { seen.add(k); all.push(n); }
  });
  const commit = () => {
    const v = inp.trim();
    if (v && !all.some(n=>n.toLowerCase()===v.toLowerCase())) onCustomChange([...custom, v]);
    setInp(''); setAdding(false);
  };
  return (
    <div style={{ marginBottom:14 }}>
      <div style={{ fontSize:9, color:G.label, fontFamily:'IBM Plex Mono, monospace', marginBottom:8, letterSpacing:'0.1em', textTransform:'uppercase' }}>{label}</div>
      <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
        {all.map(n=><GhostChip key={n} label={n} active={selected.includes(n)} onPress={()=>onToggle(n)} />)}
        {adding
          ? <div style={{ display:'flex', alignItems:'center', gap:4 }}>
              <input autoFocus value={inp} onChange={e=>setInp(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter') commit(); if(e.key==='Escape'){setInp('');setAdding(false);} }}
                style={{ fontSize:10, color:G.text, background:G.surface, border:'1px solid '+P.cafe,
                  borderRadius:20, padding:'4px 10px', width:90, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }} />
              <span onClick={commit} style={{ fontSize:11, color:P.cafe, cursor:'pointer', fontFamily:'IBM Plex Mono, monospace' }}>✓</span>
              <span onClick={()=>{setInp('');setAdding(false);}} style={{ fontSize:11, color:G.label, cursor:'pointer', fontFamily:'IBM Plex Mono, monospace' }}>✕</span>
            </div>
          : <GhostChip label="+ add" onPress={()=>setAdding(true)} />

      </div>
    </div>
  );
}

function numOf(v) {
  const n = parseFloat(String(v==null?'':v).replace(',','.'));
  return isNaN(n) ? null : n;
}
function ratioStr(dose, water) {
  const d = numOf(dose), w = numOf(water);
  if (!d || !w || d <= 0) return null;
  return '1:' + (w/d).toFixed(1).replace(/\.0$/,'');
}

function MiniCalendar({ entries, onClose, onDaySelect, selectedDay }) {
  const now = new Date();
  const yr = now.getFullYear(), mo = now.getMonth();
  const pad = n => String(n).padStart(2,'0');
  const loggedDays = new Set(
    entries.filter(e => { const d=new Date(e.date); return d.getMonth()===mo && d.getFullYear()===yr; })
           .map(e => new Date(e.date).getDate())
  );
  const firstDay = new Date(yr,mo,1).getDay();
  const daysInMonth = new Date(yr,mo+1,0).getDate();
  const today = now.getDate();
  const offset = (firstDay+6)%7;
  const cells = [...Array(offset).fill(null), ...Array.from({length:daysInMonth},(_,i)=>i+1)];
  while (cells.length%7) cells.push(null);
  const weeks = Array.from({length:cells.length/7},(_,i)=>cells.slice(i*7,i*7+7));
  const monthLabel = now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const selDate = selectedDay ? new Date(selectedDay+'T12:00:00').getDate() : null;
  return (
    <div style={{ background:P.cardBg2, border:'0.5px solid '+P.cardStroke,
      borderRadius:14, padding:'10px 12px', marginBottom:8 }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
        <span style={{ fontSize:11, fontWeight:600, color:P.cardDark, fontFamily:'Hanken Grotesk, sans-serif' }}>{monthLabel}</span>
        <span onClick={onClose} style={{ fontSize:9, color:P.cafe, cursor:'pointer', fontWeight:600 }}>Done</span>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:1, marginBottom:3 }}>
        {['M','T','W','T','F','S','S'].map((d,i)=>(
          <div key={i} style={{ textAlign:'center', fontSize:7, color:P.cardMuted, paddingBottom:2 }}>{d}</div>
        ))}
      </div>
      {weeks.map((week,wi)=>(
        <div key={wi} style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:1, marginBottom:1 }}>
          {week.map((d,di)=>{
            const dayKey = d ? `${yr}-${pad(mo+1)}-${pad(d)}` : null;
            const isSelected = d && selDate===d;
            const isToday = d===today;
            const hasEntry = d && loggedDays.has(d);
            return (
              <div key={di} onClick={()=> d && onDaySelect && onDaySelect(dayKey)}
                style={{ height:26, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', cursor: d?'pointer':'default' }}>
                {d && (
                  <>
                    <div style={{ width:20, height:20, borderRadius:'50%',
                      background: isSelected ? P.cafe : isToday ? P.cafe+'55' : 'transparent',
                      display:'flex', alignItems:'center', justifyContent:'center' }}>
                      <span style={{ fontSize:8, color: isSelected?'#fff':P.cardDark,
                        fontWeight: hasEntry?600:400 }}>{d}</span>
                    </div>
                    <div style={{ width:4, height:4, borderRadius:'50%', marginTop:1,
                      background: hasEntry ? P.brew : 'transparent' }} />
                  </>
                )}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function MapView({ entries, onLogCafe }) {
  const containerRef  = useRef(null);
  const mapRef        = useRef(null);
  const nearbyLgRef   = useRef(null);
  const visitedLgRef  = useRef(null);
  const userPosRef    = useRef(null);
  const timerRef      = useRef(null);

  const [layer,   setLayer]   = useState('nearby');
  const [loading, setLoading] = useState(true);
  const [sel,     setSel]     = useState(null);
  const [geoErr,  setGeoErr]  = useState(false);

  const cafesWithCoords = entries.filter(e => e.type==='cafe' && e.lat && e.lon);

  const makeNearbyMarker = useCallback(node => {
    if (!node.tags?.name) return null;
    const t = node.tags;
    const streetPart = t['addr:housenumber'] && t['addr:street']
      ? `${t['addr:housenumber']} ${t['addr:street']}` : t['addr:street'];
    const localityPart = t['addr:suburb'] || t['addr:neighbourhood'] || t['addr:city'] || t['addr:town'];
    const sub = [streetPart, localityPart].filter(Boolean).join(', ');
    const m = L.circleMarker([node.lat, node.lon], {
      radius:7, fillColor:P.cafe, fillOpacity:0.85, color:P.bg, weight:2
    });
    m.on('click', () => setSel({
      kind:'nearby', name:t.name, sub,
      lat:node.lat, lon:node.lon
    }));
    return m;
  }, []);

  const makeVisitedMarker = useCallback(entry => {
    const m = L.circleMarker([entry.lat, entry.lon], {
      radius:8, fillColor:P.cafe, fillOpacity:1, color:'#fff', weight:2.5
    });
    m.on('click', () => setSel({
      kind:'visited', name:entry.cafeName||'Unknown Café',
      sub:entry.location||'', lat:entry.lat, lon:entry.lon, entry
    }));
    return m;
  }, []);

  const refreshNearby = useCallback(async (lat, lon) => {
    setLoading(true);
    const nodes = await fetchNearbyCafes(lat, lon);
    if (!nearbyLgRef.current) return;
    nearbyLgRef.current.clearLayers();
    nodes.forEach(n => { const m = makeNearbyMarker(n); if (m) m.addTo(nearbyLgRef.current); });
    setLoading(false);
  }, [makeNearbyMarker]);

  const refreshVisited = useCallback(() => {
    if (!visitedLgRef.current) return;
    visitedLgRef.current.clearLayers();
    cafesWithCoords.forEach(e => makeVisitedMarker(e).addTo(visitedLgRef.current));
  }, [cafesWithCoords, makeVisitedMarker]);

  // Init Leaflet map once on mount
  useEffect(() => {
    let live = true;
    loadLeaflet().then(() => {
      if (!live || !containerRef.current || mapRef.current) return;
      const map = L.map(containerRef.current, { zoomControl:false });
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution:'© <a href="https://openstreetmap.org">OSM</a> © <a href="https://carto.com">CARTO</a>',
        maxZoom:19
      }).addTo(map);
      mapRef.current     = map;
      nearbyLgRef.current  = L.layerGroup().addTo(map);
      visitedLgRef.current = L.layerGroup();

      navigator.geolocation.getCurrentPosition(
        ({ coords:{ latitude:lat, longitude:lon } }) => {
          if (!live) return;
          userPosRef.current = [lat, lon];
          map.setView([lat, lon], 16);
          L.circleMarker([lat, lon], {
            radius:8, fillColor:P.brew, fillOpacity:1, color:'#fff', weight:2.5
          }).addTo(map);
          refreshNearby(lat, lon);
        },
        () => { if (live) { setGeoErr(true); setLoading(false); } },
        { timeout:8000 }
      );

      map.on('moveend', () => {
        clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => {
          const c = map.getCenter();
          refreshNearby(c.lat, c.lng);
        }, 700);
      });
    });
    return () => {
      live = false;
      clearTimeout(timerRef.current);
      if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
    };
  }, []);

  // Swap layers when toggle changes
  useEffect(() => {
    if (!mapRef.current) return;
    setSel(null);
    if (layer === 'nearby') {
      if (visitedLgRef.current) mapRef.current.removeLayer(visitedLgRef.current);
      if (nearbyLgRef.current)  nearbyLgRef.current.addTo(mapRef.current);
      const c = mapRef.current.getCenter();
      refreshNearby(c.lat, c.lng);
    } else {
      if (nearbyLgRef.current) mapRef.current.removeLayer(nearbyLgRef.current);
      refreshVisited();
      if (visitedLgRef.current) visitedLgRef.current.addTo(mapRef.current);
      setLoading(false);
    }
  }, [layer]);

  const dist = sel && userPosRef.current
    ? haversineM(userPosRef.current[0], userPosRef.current[1], sel.lat, sel.lon) : null;
  const distStr = dist == null ? null : dist < 1000 ? `${dist}m away` : `${(dist/1000).toFixed(1)}km away`;

  return (
    <div style={{ flex:1, position:'relative', overflow:'hidden' }}>
      {/* Nearby / Visited toggle */}
      <div style={{ position:'absolute', top:10, left:'50%', transform:'translateX(-50%)',
        zIndex:1000, display:'flex', background:'rgba(251,250,248,0.92)',
        border:'0.5px solid '+P.cardStroke, borderRadius:20, padding:3, gap:2 }}>
        {[['nearby','Nearby'],['visited','Visited']].map(([v,l])=>(
          <div key={v} onClick={()=>setLayer(v)}
            style={{ padding:'4px 16px', borderRadius:16, fontSize:9, cursor:'pointer',
              fontFamily:'IBM Plex Mono, monospace', transition:'all 0.15s',
              background: layer===v ? P.cafe : 'transparent',
              color: layer===v ? '#fff' : P.headerMuted }}>{l}</div>
        ))}
      </div>

      {/* Loading pill */}
      {loading && (
        <div style={{ position:'absolute', top:46, left:'50%', transform:'translateX(-50%)',
          zIndex:1000, background:'rgba(251,250,248,0.88)', padding:'3px 10px',
          borderRadius:10, fontSize:8, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace' }}>
          loading…
        </div>
      )}

      {/* Geo permission error */}
      {geoErr && (
        <div style={{ position:'absolute', inset:0, zIndex:400, display:'flex',
          alignItems:'center', justifyContent:'center', background:P.bg }}>
          <div style={{ textAlign:'center', padding:'0 40px' }}>
            <div style={{ fontSize:32, marginBottom:12 }}>📍</div>
            <div style={{ fontSize:11, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', lineHeight:1.6 }}>
              Location access needed<br/>to find nearby cafés.
            </div>
          </div>
        </div>
      )}

      {/* Map tile container */}
      <div ref={containerRef} style={{ width:'100%', height:'100%' }} />

      {/* Visited empty state */}
      {layer==='visited' && cafesWithCoords.length===0 && !geoErr && (
        <div style={{ position:'absolute', bottom:16, left:16, right:16, zIndex:500,
          background:'rgba(251,250,248,0.92)', border:'0.5px solid '+P.cardStroke,
          borderRadius:14, padding:'14px 16px', textAlign:'center' }}>
          <div style={{ fontSize:10, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace',
            fontWeight:300, lineHeight:1.7 }}>
            Cafés logged via location search<br/>will appear here.
          </div>
        </div>
      )}

      {/* Selected marker card */}
      {sel && (
        <div style={{ position:'absolute', bottom:0, left:0, right:0, zIndex:1000,
          background:'rgba(251,250,248,0.98)', borderTop:'0.5px solid '+P.cardStroke,
          borderRadius:'16px 16px 0 0', padding:'16px 16px 28px' }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:12 }}>
            <div style={{ flex:1, paddingRight:10 }}>
              <div style={{ fontSize:18, fontWeight:500, color:P.headerText,
                fontFamily:'Hanken Grotesk, sans-serif', lineHeight:1.2 }}>{sel.name}</div>

  );

// ── Brew Timer ────────────────────────────────────────────────────────────────
function TimerScreen({ recipe, onCancel, onLog, mode='staged' }) {
  const [elapsed,  setElapsed]  = useState(0);   // total seconds across all stages
  const [running,  setRunning]  = useState(false);
  const [finished, setFinished] = useState(false);
  const [rating,   setRating]   = useState(0);
  const [stageIdx,   setStageIdx]   = useState(0);
  const [stageStart, setStageStart] = useState(0); // value of `elapsed` when the current stage began
  const [flashOn,  setFlashOn]  = useState(false);
  const startRef = useRef(0);

  const stages = getMethodSchema(recipe.method).workflow(recipe) || [];
  const staged = mode === 'staged' && stages.length > 0;

  // checklist mode: cumulative start time of each stage + total timed duration
  let _acc = 0;
  const checklist = stages.map(s => { const at = _acc; if (s.kind === 'timed') _acc += (s.seconds || 0); return { ...s, at }; });
  const totalTimed = _acc;

  const curStage    = stages[stageIdx];
  const stageElapsed = elapsed - stageStart;
  const flash = () => { setFlashOn(true); setTimeout(() => setFlashOn(false), 700); };

  useEffect(() => {
    if (!running) return;
    startRef.current = Date.now() - elapsed*1000;
    const id = setInterval(() => setElapsed(Math.floor((Date.now()-startRef.current)/1000)), 250);
    return () => clearInterval(id);
  }, [running]);

  useEffect(() => {
    let lock = null;
    if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => lock = l).catch(()=>{});
    return () => { if (lock) lock.release().catch(()=>{}); };
  }, []);

  const advance = () => {
    if (stageIdx >= stages.length-1) { setRunning(false); setFinished(true); return; }
    setStageIdx(i => i+1); setStageStart(elapsed);
  };

  // staged mode: auto-advance a timed stage when its countdown hits zero (chime + flash)
  useEffect(() => {
    if (!staged || !running || finished || !curStage) return;
    if (curStage.kind === 'timed' && stageElapsed >= curStage.seconds) { beep(); flash(); advance(); }
  }, [elapsed]);

  const curIdx = checklist.reduce((acc,s,i) => elapsed >= s.at ? i : acc, 0);
  const target = staged ? 0 : (parseTimeStr(recipe.brewTime) || totalTimed);
  const over   = !staged && target > 0 && elapsed > target;
  const stageRemain = curStage && curStage.kind === 'timed' ? Math.max(curStage.seconds - stageElapsed, 0) : 0;

  const handleLog = () => onLog({
    id:genId(), date:new Date().toISOString(), type:'brew',
    beanName:recipe.beanName||'', roaster:recipe.roaster||'',
    method:recipe.method||'', grinder:recipe.grinder||'', machine:recipe.machine||'', dose:recipe.dose||'', water:recipe.water||'',
    temp:recipe.temp||'', brewTime:fmtSec(elapsed), grindSize:recipe.grindSize||'',
    ratio:recipe.ratio||'',
    bloomWater:recipe.bloomWater||'', bloomTime:recipe.bloomTime||'', pours:recipe.pours||'',
    steepTime:recipe.steepTime||'', secondSteep:recipe.secondSteep||'',
    preInfusion:recipe.preInfusion||'', pressure:recipe.pressure||'', basket:recipe.basket||'',
    tastingNotes:[], rating, whatIdChange:'', recipe:recipe.recipe||''
  });

  const params = [['dose',recipe.dose],['water',recipe.water],['temp',recipe.temp],['grind',recipe.grindSize],['grinder',recipe.grinder],['machine',recipe.machine],['ratio',recipe.ratio]].filter(([,v])=>v);

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, overflow:'hidden', background:P.bg }}>
      <div style={{ padding:'10px 20px 12px', paddingTop:'calc(10px + env(safe-area-inset-top))',
        display:'flex', justifyContent:'space-between', alignItems:'center',
        borderBottom:'1px solid '+P.line, flexShrink:0 }}>
        <div onClick={onCancel} style={{ fontSize:13, color:P.headerMuted, cursor:'pointer', padding:'4px 0' }}>✕ Cancel</div>
        <div style={{ fontSize:15, fontWeight:600, color:P.headerText }}>Brew Timer</div>
        <div style={{ width:44 }} />
      </div>

      <div className="scroll-y" style={{ flex:1, padding:'20px 16px', display:'flex', flexDirection:'column' }}>
        <div style={{ textAlign:'center', marginBottom:6 }}>
          <div style={{ fontSize:22, fontWeight:500, color:P.headerText, fontFamily:'Hanken Grotesk, sans-serif' }}>{recipe.beanName||'Brew'}</div>
          {recipe.method && <div style={{ fontSize:9, color:P.brew, fontFamily:'IBM Plex Mono, monospace', marginTop:3 }}>{recipe.method}</div>}
        </div>
        {params.length>0 && (
          <div style={{ display:'flex', justifyContent:'center', flexWrap:'wrap', gap:'2px 12px', marginBottom:18 }}>
            {params.map(([l,v])=>(
              <span key={l} style={{ fontSize:8.5, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace' }}>{l} <span style={{ color:G.text }}>{v}</span></span>
            ))}
          </div>
        )}

        {staged && !finished ? (
          <>
            {curStage && (
              <div className={flashOn ? 'stage-flash' : ''} style={{ textAlign:'center', marginBottom:16, borderRadius:14, padding:'10px 0' }}>
                <div style={{ fontSize:9, color:P.acc, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.14em', fontWeight:500, marginBottom:8 }}>
                  STAGE {stageIdx+1}/{stages.length} · {curStage.label.toUpperCase()}
                </div>
                <div style={{ fontSize:60, fontWeight:300, color:P.headerText, fontFamily:'IBM Plex Mono, monospace', lineHeight:1 }}>
                  {curStage.kind==='timed' ? fmtSec(stageRemain) : fmtSec(stageElapsed)}
                </div>
                <div style={{ display:'inline-block', background:P.tint, border:'1px solid '+P.tintStroke,
                  borderRadius:12, padding:'8px 16px', marginTop:12, maxWidth:'85%' }}>
                  <div style={{ fontSize:12, color:P.acc, fontWeight:500 }}>{curStage.cue}</div>
                  {curStage.kind==='manual' && <div style={{ fontSize:8.5, color:P.headerMuted,
                    fontFamily:'IBM Plex Mono, monospace', marginTop:4, letterSpacing:'0.1em' }}>▸ tap “done” when finished</div>}
                </div>
                <div style={{ fontSize:8.5, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', marginTop:10 }}>total {fmtSec(elapsed)}</div>
              </div>
            )}
            <div style={{ marginBottom:20 }}>
              {stages.map((s,i)=>(
                <div key={s.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 10px',
                  borderRadius:10, marginBottom:3,
                  border:'1px solid '+(i===stageIdx ? P.tintStroke : 'transparent'),
                  background: i===stageIdx ? P.tint : 'transparent' }}>
                  <span style={{ fontSize:9, color: i<=stageIdx ? P.acc : P.headerMuted, fontFamily:'IBM Plex Mono, monospace', width:44, flexShrink:0 }}>
                    {s.kind==='timed' ? fmtSec(s.seconds) : '·····'}
                  </span>
                  <span style={{ fontSize:11.5, fontWeight: i===stageIdx ? 500 : 400,
                    color: i===stageIdx ? P.headerText : P.headerMuted, opacity: i>stageIdx ? 0.6 : 1 }}>
                    {i<stageIdx?'✓ ':''}{s.label}
                  </span>
                </div>
              ))}
            </div>
          </>
        ) : !finished ? (
          <>
            <div style={{ textAlign:'center', marginBottom:18 }}>
              <div style={{ fontSize:60, fontWeight:300, color: over ? P.cafe : P.headerText, fontFamily:'IBM Plex Mono, monospace', lineHeight:1 }}>{fmtSec(elapsed)}</div>
              {target>0 && <div style={{ fontSize:9, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', marginTop:6 }}>target {fmtSec(target)}</div>}
            </div>
            <div style={{ marginBottom:20 }}>
              {checklist.map((s,i)=>(
                <div key={s.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 10px',
                  borderRadius:10, marginBottom:3,
                  border:'1px solid '+(i===curIdx && elapsed>0 ? P.tintStroke : 'transparent'),
                  background: i===curIdx && elapsed>0 ? P.tint : 'transparent' }}>
                  <span style={{ fontSize:9, color: i<=curIdx && elapsed>0 ? P.acc : P.headerMuted,
                    fontFamily:'IBM Plex Mono, monospace', width:34, flexShrink:0 }}>{fmtSec(s.at)}</span>
                  <span style={{ fontSize:11.5, fontWeight: i===curIdx && elapsed>0 ? 500 : 400,
                    color: i===curIdx && elapsed>0 ? P.headerText : P.headerMuted,
                    opacity: i>curIdx ? 0.6 : 1 }}>{i<curIdx?'✓ ':''}{s.cue||s.label}</span>
                </div>
              ))}
            </div>
          </>
        ) : null}

        <div style={{ marginTop:'auto', paddingBottom:16 }}>
          {!finished ? (
            <div style={{ display:'flex', gap:10 }}>
              <div onClick={()=>setRunning(r=>!r)}
                style={{ flex:1, background: running ? 'transparent' : P.acc,
                  border:'1px solid '+P.acc, borderRadius:15, padding:'14px', textAlign:'center',
                  cursor:'pointer', boxShadow: running ? 'none' : P.shadowBtn }}>
                <span style={{ fontSize:14, fontWeight:600, color: running ? P.acc : '#fff' }}>
                  {running ? 'Pause' : elapsed>0 ? 'Resume' : '▶ Start'}
                </span>
              </div>
              {staged && elapsed>0 && curStage && curStage.kind==='manual' ? (
                <div onClick={()=>{ beep(); flash(); advance(); }}
                  style={{ flex:1, background:P.acc, borderRadius:15, padding:'14px', textAlign:'center',
                    cursor:'pointer', boxShadow:P.shadowBtn }}>
                  <span style={{ fontSize:14, fontWeight:600, color:'#fff' }}>
                    {stageIdx>=stages.length-1 ? 'Done ✓' : 'Done →'}
                  </span>
                </div>
              ) : elapsed>0 && (
                <div onClick={()=>{ setRunning(false); setFinished(true); }}
                  style={{ flex:1, background:P.acc, borderRadius:15, padding:'14px', textAlign:'center',
                    cursor:'pointer', boxShadow:P.shadowBtn }}>
                  <span style={{ fontSize:14, fontWeight:600, color:'#fff' }}>Finish ✓</span>
                </div>
              )}
            </div>
          ) : (
            <div>
              <div style={{ textAlign:'center', marginBottom:12 }}>
                <div style={{ fontSize:10, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', marginBottom:8 }}>brewed in {fmtSec(elapsed)} — how was it?</div>
                <div style={{ display:'flex', justifyContent:'center' }}><RatingSquares n={rating} size={22} onChange={setRating} /></div>
              </div>
              <PrimaryButton label="Log this brew" onPress={handleLog} />
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Dial-in panel (shown in BrewForm when the bean has brew history) ──────────
function DialInPanel({ last, attempt, grinder }) {
  const [taste, setTaste] = useState(null);
  const unit = grinder && (grinder.adj==='clicks' ? '2–3 clicks' : grinder.adj==='dial' ? 'half a number' : 'a touch');
  const finer   = grinder ? ` (${unit} finer on the ${grinder.n})`   : '';
  const coarser = grinder ? ` (${unit} coarser on the ${grinder.n})` : '';
  const tips = {
    sour:   `Sour or weak usually means under-extraction — try a finer grind${finer}, hotter water, or a longer brew.`,
    right:  'Sounds dialed in — after saving, open the entry and pin it as your go-to recipe for this bean.',
    bitter: `Bitter or harsh usually means over-extraction — try a coarser grind${coarser}, cooler water, or a shorter brew.`,
  };
  const lastLine = [last.grindSize && `grind ${last.grindSize}`, last.grinder,
    last.brewTime && `time ${last.brewTime}`,
    last.ratio && `ratio ${last.ratio}`, last.temp].filter(Boolean).join(' · ');
  return (
    <div style={{ background:'rgba(92,61,40,0.07)', border:'0.5px solid rgba(92,61,40,0.30)',
      borderRadius:12, padding:'11px 13px', marginBottom:14 }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
        <span style={{ fontSize:8, color:P.brew, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.1em' }}>DIAL-IN · ATTEMPT #{attempt}</span>
        {last.rating>0 && <RatingDots n={last.rating} />}
      </div>
      <div style={{ fontSize:10, color:G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, marginBottom:8 }}>
        last time: {lastLine || 'no parameters logged'}
      </div>
      <div style={{ fontSize:8.5, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', marginBottom:6 }}>How did the last one taste?</div>
      <div style={{ display:'flex', gap:5 }}>
        {[['sour','Sour / weak'],['right','Just right'],['bitter','Bitter / harsh']].map(([k,l])=>(
          <GhostChip key={k} label={l} active={taste===k} onPress={()=>setTaste(taste===k?null:k)} />
        ))}
      </div>
      {taste && (
        <div style={{ fontSize:9.5, color:P.brew, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, lineHeight:1.6, marginTop:8 }}>
          {tips[taste]}
        </div>
      )}
    </div>
  );
}

// ── Gear catalog ──────────────────────────────────────────────────────────────
// c: category · n: name · adj: grind adjustment type · filter/esp: suggested
// starting settings (editable) · m: brew methods the gear maps to
const GEAR_CATS = [['grinder','Grinder'],['brewer','Brewer'],['machine','Espresso Machine'],['kettle','Kettle'],['scale','Scale']];
const GEAR_CATALOG = [

function QuickCaptureSheet({ onClose, onSave, onExpand, beans=[], gear=[] }) {
  const [type, setType]         = useState('cafe');
  const [cafeName, setCafeName] = useState('');
  const [drinkType, setDrink]   = useState('');
  const [beanName, setBean]     = useState('');
  const [method, setMethod]     = useState('');
  const [rating, setRating]     = useState(0);
  const ownedMethods = [...new Set(gear.flatMap(g => g.m||[]))];
  const [showAllMethods, setShowAllMethods] = useState(ownedMethods.length===0);
  const methodChips = [...new Set([
    ...ownedMethods,
    ...(showAllMethods ? BREW_METHODS : []),
    ...(method ? [method] : []) ])];

  const handleSave = () => {
    const base = { id:genId(), date:new Date().toISOString(), type, rating, tastingNotes:[], notes:'' };
    const entry = type==='cafe'
      ? { ...base, cafeName, drinkType, location:'', bean:'', price:'',
          ratings:{overall:rating,aroma:0,taste:0,texture:0}, vibeTags:[], wouldVisitAgain:false }
      : { ...base, beanName, method, roaster:'', grinder:'', machine:'', dose:'', water:'', temp:'',
          brewTime:'', grindSize:'', ratio:'', whatIdChange:'', recipe:'',
          bloomWater:'', bloomTime:'', pours:'', steepTime:'', secondSteep:'', preInfusion:'', pressure:'', basket:'' };
    onSave(entry);
  };

  const fieldStyle = { height:42, background:G.surface, border:'1px solid '+G.border,
    borderRadius:10, display:'flex', alignItems:'center', padding:'0 14px' };

    marginBottom:5, letterSpacing:'0.1em', textTransform:'uppercase' };

    <div style={{ position:'fixed', inset:0, zIndex:100, display:'flex', flexDirection:'column', justifyContent:'flex-end' }}>

      <div className="slide-up" style={{ position:'relative', zIndex:1,

              fontSize:11.5, cursor:'pointer', fontWeight:600,

              color: type===val ? '#fff' : P.cardMuted,

              transition:'all 0.15s' }}>

        {type==='cafe' ? (
          <>
            <div style={{ marginBottom:10 }}>
              <div style={labelStyle}>Café Name</div>

function BrewForm({ initial={}, onBack, onSave, onUpdate, beans=[], entries=[], gear=[], customNotes=[], onAddNote=()=>{} }) {
  const grinders     = gear.filter(g => g.c==='grinder');
  const machines     = gear.filter(g => g.c==='machine');
  const ownedMethods = [...new Set(gear.flatMap(g => g.m||[]))];
  const defaults = { beanName:'', roaster:'', method:'V60', grinder:'', machine:'', dose:'', water:'',
    temp:'', brewTime:'', grindSize:'', ratio:'', tastingNotes:[], rating:0, whatIdChange:'', recipe:'',
    // method-specific params (used by METHOD_SCHEMAS; empty for methods that don't need them)
    bloomWater:'', bloomTime:'', pours:'', steepTime:'', secondSteep:'', preInfusion:'', pressure:'', basket:'' };
  const initObj = { ...defaults,
    ...(grinders.length===1 && !initial.grinder ? { grinder: grinders[0].n }   : {}),
    ...(machines.length===1 && !initial.machine ? { machine: machines[0].n }   : {}),
    ...initial,
    // a method is always selected (matches the design); an empty incoming method
    // (e.g. from quick-capture expand) falls back to owned gear or V60
    method: initial.method || (ownedMethods.length ? ownedMethods[0] : 'V60') };
  const [f, setF] = useState(initObj);
  const [showAllMethods, setShowAllMethods] = useState(ownedMethods.length===0);
  const initStr = useRef(JSON.stringify(initObj));
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const toggleNote = n => setF(p=>({ ...p, tastingNotes: p.tastingNotes.includes(n) ? p.tastingNotes.filter(x=>x!==n) : [...p.tastingNotes,n] }));
  const hasChanges = JSON.stringify(f) !== initStr.current;

  // Ratio is derived (dose:water), not typed — recompute it at save time.
  const buildEntry = () => ({ id:initial.id||genId(), date:initial.date||new Date().toISOString(),
    type:'brew', ...f, ratio: ratioStr(f.dose, f.water) || f.ratio });
  const handleSave = () => { onUpdate ? onUpdate(buildEntry()) : onSave(buildEntry()); };
  const handleBack = () => {
    if (hasChanges) {
      if (window.confirm('Save changes before leaving?')) handleSave();
      else onBack();
    } else onBack();
  };

  const activeGrinder = grinders.find(g => g.n===f.grinder) || (grinders.length===1 ? grinders[0] : null);
  const isEsp = (f.method||'').toLowerCase().includes('espresso');
  const grindSuggestion = activeGrinder ? (isEsp ? activeGrinder.esp : activeGrinder.filter) : null;
  const grindMax = activeGrinder && (activeGrinder.adj==='clicks' || activeGrinder.adj==='dial') && activeGrinder.max > 0
    ? activeGrinder.max : null;
  const grindPh = grindMax ? `0–${grindMax}`
    : activeGrinder
      ? (activeGrinder.adj==='clicks' ? 'e.g. 24 clicks' : activeGrinder.adj==='dial' ? 'e.g. 6.5' : 'e.g. fine, medium')
      : ((getMethodSchema(f.method).fields.find(x=>x[1]==='grindSize')||[])[2] || 'Medium-fine');
  const clampGrind = v => {
    if (v === '') { set('grindSize', ''); return; }
    const n = parseFloat(v);
    if (isNaN(n)) return;
    set('grindSize', String(Math.min(grindMax, Math.max(0, n))));
  };
  const visibleMethods = [...new Set([
    ...(showAllMethods ? [...BREW_METHODS, ...ownedMethods] : ownedMethods),
    ...(f.method ? [f.method] : []) ])];

  const bean = beans.find(b => b.name===f.beanName);
  const dialed = !initial.id && bean ? (dialedMap(bean)||{})[f.method] : null;
  const applyDialed = () => setF(p => {
    const merged = { ...p };
    Object.keys(dialed).forEach(k => { if (dialed[k] !== undefined && dialed[k] !== '') merged[k] = dialed[k]; });
    return merged;
  });

  // Partition the method schema's fields into the Elevation layout:
  //  - dose / water / grind / time -> the 2×2 raised "dial" grid
  //  - ratio -> derived readout band;  temp -> a gear chip
  //  - everything else -> the Advanced drawer
  const allFields = getMethodSchema(f.method).fields;
  const fieldOf = k => allFields.find(x => x[1]===k);
  const nameOf  = fld => fld ? fld[0].replace(/\s*\([^)]*\)/,'') : '';
  const unitOf  = fld => { const m = fld && fld[0].match(/\(([^)]+)\)/); return m ? m[1] : ''; };
  const timeKey = fieldOf('brewTime') ? 'brewTime' : fieldOf('steepTime') ? 'steepTime' : null;
  const coreKeys = new Set(['dose','water','grindSize','temp','ratio', timeKey]);
  const extras = allFields.filter(([,k]) => !coreKeys.has(k));
  const doseF = fieldOf('dose'), waterF = fieldOf('water'), timeF = timeKey && fieldOf(timeKey);
  const autoRatio = ratioStr(f.dose, f.water);
  const ratioLabel = isEsp ? 'Brew ratio' : 'Ratio';
  const advLabel   = isEsp ? 'Advanced · pre-infusion · pressure · notes' : 'Advanced · notes · rating';
  // Grind coarseness hint shown inline in the dial label ("Grind · fine"), taken
  // from the schema's grind placeholder when it's fine/coarse (V60 stays plain).
  const grindHint = (() => { const ph = (fieldOf('grindSize')||[])[2] || ''; return /fine|coarse/i.test(ph) ? ph.toLowerCase() : ''; })();
  // Espresso shot time steps in whole seconds ("28 s"); pour-over/immersion in m:ss.
  const timeIsSec = isEsp && timeKey === 'brewTime';
  const bumpNum = (key, dir, step, ph) => {
    const cur = numOf(f[key]);
    const base = cur==null ? (numOf(ph) || 0) : cur;
    set(key, String(Math.max(0, Math.round((base + dir*step)*10)/10)));
  };
  const bumpTime = dir => {
    const cur = parseTimeStr(f[timeKey]) || parseTimeStr(timeF && timeF[2]) || 0;
    const next = Math.max(0, cur + dir*(timeIsSec ? 1 : 5));
    set(timeKey, timeIsSec ? String(next) : fmtSec(next));
  };
  const bumpGrind = dir => {
    const n = numOf(f.grindSize);
    const base = n==null ? (numOf(grindSuggestion) ?? Math.round(grindMax/2)) : n;
    clampGrind(String(Math.round((base + dir)*10)/10));
  };
  const [adv, setAdv] = useState(!!(initial.id || f.rating || (f.tastingNotes||[]).length
    || f.whatIdChange || f.recipe));
  const [gearPick, setGearPick] = useState(null); // which gear chip's picker is open

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, overflow:'hidden', background:P.bg }}>
      <NavBar title={initial.id ? 'Edit brew' : 'New brew'} onBack={handleBack} onSave={handleSave} />
      <div className="scroll-y" style={{ flex:1, padding:'6px 20px 14px' }}>

        {/* Method segments */}
        <div className="scroll-x" style={{ display:'flex', gap:7, margin:'14px 0' }}>
          {visibleMethods.map(m=>(
            <div key={m} onClick={()=>set('method',m)} style={{
              flex: visibleMethods.length<=4 ? 1 : '0 0 auto', textAlign:'center',
              padding:'9px 13px', borderRadius:11, fontSize:12.5, fontWeight:500,
              whiteSpace:'nowrap', cursor:'pointer',
              border:'1px solid '+(f.method===m?P.acc:P.line),
              color: f.method===m?P.acc:P.headerMuted,
              background: f.method===m?P.tint:'transparent' }}>{m}</div>
          ))}
          {!showAllMethods && ownedMethods.length>0 && (
            <div onClick={()=>setShowAllMethods(true)} style={{ flex:'0 0 auto', textAlign:'center',
              padding:'9px 13px', borderRadius:11, fontSize:12.5, fontWeight:500, cursor:'pointer',
              border:'1px dashed '+P.line, color:P.headerMuted, whiteSpace:'nowrap' }}>+ more</div>
          )}
        </div>

        <BeanCard beans={beans} value={f.beanName} onChange={v=>set('beanName',v)}
          onBeanSelect={b=>setF(p=>({ ...p, beanName:b.name, roaster:b.roaster||p.roaster }))} />
        {dialed && (
          <div style={{ background:'rgba(92,61,40,0.07)', border:'0.5px solid rgba(92,61,40,0.30)',
            borderRadius:12, padding:'11px 13px', marginBottom:14 }}>
            <div style={{ fontSize:8, color:P.brew, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.1em', marginBottom:6 }}>★ DIALED IN · {f.method.toUpperCase()}</div>
            <div style={{ fontSize:10, color:G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, marginBottom:10 }}>
              {[dialed.grindSize && `grind ${dialed.grindSize}`, dialed.dose && `dose ${dialed.dose}`,
                dialed.water && `water ${dialed.water}`, dialed.brewTime && `time ${dialed.brewTime}`,
                dialed.ratio].filter(Boolean).join(' · ') || 'recipe pinned'}
            </div>
            <div onClick={applyDialed} style={{ background:P.brew, borderRadius:9, padding:'9px', textAlign:'center', cursor:'pointer' }}>
              <span style={{ fontSize:10, color:'#fff', fontFamily:'IBM Plex Mono, monospace' }}>use this recipe</span>
            </div>
          </div>
        )}
        {(() => {
          if (initial.id || dialed) return null;
          const hist = entries.filter(e => e.type==='brew' && e.beanName && e.beanName===f.beanName && e.method===f.method);
          return hist.length>0 ? <DialInPanel last={hist[0]} attempt={hist.length+1} grinder={activeGrinder} /> : null;
        })()}
        {/* 2×2 dial grid — the four raised, tactile editables */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginTop:12 }}>
          <Dial label={nameOf(doseF)||'Dose'} value={f.dose} unit={unitOf(doseF)||'g'}
            placeholder={String(numOf(doseF&&doseF[2])||15)}
            onChange={v=>set('dose',v)} onStep={d=>bumpNum('dose', d, isEsp?0.5:1, doseF&&doseF[2])} />
          <Dial label={nameOf(waterF)||'Water'} value={f.water} unit={unitOf(waterF)||'g'}
            placeholder={String(numOf(waterF&&waterF[2])||250)}
            onChange={v=>set('water',v)} onStep={d=>bumpNum('water', d, isEsp?1:5, waterF&&waterF[2])} />
          <Dial label={grindHint ? `Grind · ${grindHint}` : 'Grind'} value={f.grindSize}
            placeholder={grindPh} inputMode={grindMax?'decimal':'text'}
            onChange={v=> grindMax ? clampGrind(v) : set('grindSize', v)}
            onStep={grindMax ? bumpGrind : null} />
          {timeF && (
            <Dial label={nameOf(timeF)} value={f[timeKey]} unit={timeIsSec ? 's' : ''}
              placeholder={timeIsSec ? String(parseTimeStr(timeF[2])||28) : (timeF[2]||'3:00')}
              inputMode={timeIsSec ? 'decimal' : 'text'}
              onChange={v=>set(timeKey,v)} onStep={bumpTime} />
          )}
        </div>

        {/* Derived — flat tinted readout */}
        <RatioBand label={ratioLabel} value={autoRatio || f.ratio} tag={autoRatio ? 'auto' : ''} />

        {/* Gear chips — Grinder, Machine (espresso), Temp */}
        <div style={{ marginTop:14 }}>
          <div className="scroll-x" style={{ display:'flex', gap:6 }}>
            {grinders.length>0 && (
              <GearChip k="Grinder" value={f.grinder} active={gearPick==='grinder'}
                onPress={()=>setGearPick(p=>p==='grinder'?null:'grinder')} />
            )}
            {isEsp && machines.length>0 && (
              <GearChip k="Machine" value={f.machine} active={gearPick==='machine'}
                onPress={()=>setGearPick(p=>p==='machine'?null:'machine')} />
            )}
            <GearChip k="Temp" value={f.temp} active={gearPick==='temp'}
              onPress={()=>setGearPick(p=>p==='temp'?null:'temp')} />
          </div>
          {gearPick==='grinder' && (
            <div style={{ display:'flex', flexWrap:'wrap', gap:5, marginTop:8 }}>
              {grinders.map(g=><GhostChip key={g.id} label={g.n} active={f.grinder===g.n}
                onPress={()=>{ set('grinder', f.grinder===g.n?'':g.n); setGearPick(null); }} />)}
            </div>
          )}
          {gearPick==='machine' && (
            <div style={{ display:'flex', flexWrap:'wrap', gap:5, marginTop:8 }}>
              {machines.map(g=><GhostChip key={g.id} label={g.n} active={f.machine===g.n}
                onPress={()=>{ set('machine', f.machine===g.n?'':g.n); setGearPick(null); }} />)}
            </div>
          )}
          {gearPick==='temp' && (
            <div style={{ display:'flex', flexWrap:'wrap', gap:5, marginTop:8, alignItems:'center' }}>
              {[88,90,92,93,94,95,96,98,100].map(t=>(
                <GhostChip key={t} label={`${t}°`} active={f.temp===`${t}°`}
                  onPress={()=>{ set('temp', `${t}°`); setGearPick(null); }} />
              ))}
              <div style={{ display:'flex', alignItems:'center', border:'1px solid '+G.chipBorder,
                borderRadius:20, padding:'3px 11px' }}>
                <input inputMode="decimal" placeholder="custom" value={f.temp}
                  onChange={e=>set('temp', e.target.value)}
                  style={{ fontSize:10, color:P.headerText, width:58, fontFamily:'IBM Plex Mono, monospace' }} />
              </div>
            </div>
          )}
        </div>
        {activeGrinder && grindSuggestion && (
          <div style={{ fontSize:9, color:P.acc, fontFamily:'IBM Plex Mono, monospace', marginTop:8 }}>
            {activeGrinder.n}: try {grindSuggestion}{activeGrinder.adj==='clicks'?' clicks':''} for {isEsp?'espresso':'filter'}
          </div>
        )}

        {/* Advanced drawer */}
        <div onClick={()=>setAdv(a=>!a)} style={{ display:'flex', justifyContent:'space-between',
          alignItems:'center', padding:'12px 2px', borderTop:'1px solid '+P.line,
          borderBottom:'1px solid '+P.line, marginTop:16, cursor:'pointer' }}>
          <span style={{ fontSize:12.5, fontWeight:500, color:P.acc }}>{advLabel}</span>
          <span style={{ fontSize:15, color:P.acc, transform:adv?'rotate(90deg)':'none',
            transition:'transform 0.15s', display:'inline-block' }}>›</span>
        </div>
        {adv && (
          <div style={{ paddingTop:14 }}>
            {extras.length>0 && (
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:14 }}>
                {extras.map(([lbl,key,ph])=>(
                  <div key={key}>
                    <FieldLabel>{lbl}</FieldLabel>
                    <div style={{ height:44, background:P.cardBg, border:'1px solid '+P.cardStroke,
                      borderRadius:12, boxShadow:P.shadow, display:'flex', alignItems:'center',
                      padding:'0 12px', marginTop:5 }}>
                      <input placeholder={ph} value={f[key]} onChange={e=>set(key,e.target.value)}
                        style={{ fontSize:13, color:P.headerText }} />
                    </div>
                  </div>
                ))}
              </div>
            )}
            <GhostField label="Roaster" placeholder="Counter Culture, Intelligentsia…" value={f.roaster} onChange={v=>set('roaster',v)} />
            <ChipAdder label="Tasting Notes" presets={TASTING_NOTES} custom={customNotes} onCustomChange={onAddNote}
              selected={f.tastingNotes} onToggle={toggleNote} />
            <div style={{ marginBottom:16 }}>
              <FieldLabel style={{ marginBottom:8 }}>Rating</FieldLabel>
              <RatingSquares n={f.rating} size={20} onChange={v=>set('rating',v)} />
            </div>
            <GhostField label="What I'd Change Next Time" placeholder="Try coarser grind…" value={f.whatIdChange} onChange={v=>set('whatIdChange',v)} multiline />
            <GhostField label="Recipe / Steps" placeholder="Step-by-step notes…" value={f.recipe} onChange={v=>set('recipe',v)} multiline />
          </div>
        )}
        <div style={{ height:24 }} />
      </div>

      {/* Pinned save */}
      <div style={{ padding:'10px 20px calc(12px + env(safe-area-inset-bottom))',
        background:P.bg, borderTop:'1px solid '+P.line, flexShrink:0 }}>
        <PrimaryButton label={initial.id ? 'Save changes' : 'Save brew'} onPress={handleSave} />
      </div>
    </div>
  );
}

// ── Bean Library ─────────────────────────────────────────────────────────────
const BEAN_COLORS = ['#6B8FA8','#A8836B','#7A8A6A','#9A7A8A','#8A9A7A'];

function BeanAvatar({ bean }) {
  // roast-gradient swatch, per the reference's bean card
  return (
    <div style={{ width:42, height:42, borderRadius:12, flexShrink:0,
      background:`linear-gradient(135deg,#D9B676,${(bean && roastColor(bean.roastLevel))||'#9A5A32'})` }} />
  );
}

function AddBeanForm({ initial={}, onBack, onSave, onUpdate, communityBeans=[], vocab={ tastingNotes:[], processes:[] },
    customNotes=[], onAddNote=()=>{}, customProcesses=[], onAddProcess=()=>{}, session }) {
  const defaults = { name:'', roaster:'', origin:'', process:'', roastLevel:0, tastingNotes:[], rating:0 };
  const [f, setF] = useState({ ...defaults, ...initial });
  const [share, setShare] = useState(false);
  const [suggestOff, setSuggestOff] = useState(false);
  const [scanning, setScanning] = useState(false);
  const [scanErr, setScanErr]   = useState('');
  const fileRef = useRef(null);

  // Presets = built-ins merged with reviewed community vocabulary (deduped, case-insensitive)
  const dedupe = arr => { const seen = new Set(), out = []; arr.forEach(n => { const k = String(n).toLowerCase(); if (n && !seen.has(k)) { seen.add(k); out.push(n); } }); return out; };
  const procPresets = dedupe([...PROCESS_TYPES, ...(vocab.processes||[])]);
  const notePresets = dedupe([...TASTING_NOTES, ...(vocab.tastingNotes||[])]);
  const canon = (term, pool) => pool.find(x => x.toLowerCase() === String(term).toLowerCase()) || String(term).trim();

  const handleScan = async file => {
    setScanning(true); setScanErr('');
    try {
      const dataUrl = await downscaleImage(file, 1024);
      const { data, error } = await SB.functions.invoke('scan-bean', { body: {
        image: dataUrl, knownProcesses: procPresets, knownNotes: notePresets } });
      if (error) throw new Error(error.message || 'request failed');
      if (data && data.error) throw new Error(data.error);
      const p = data || {};
      // Classify process into the known set (canonical casing); leave None if unmatched/empty
      const proc = p.process ? canon(p.process, procPresets) : '';
      // Normalize notes to canonical casing where a known term matches; keep new ones as-is
      const knownNotes = [...notePresets, ...customNotes];
      const notes = Array.isArray(p.tastingNotes)
        ? dedupe(p.tastingNotes.filter(Boolean).map(n => canon(n, knownNotes)))
        : [];
      setF(prev => ({ ...prev,
        name:    p.name    || prev.name,
        roaster: p.roaster || prev.roaster,
        origin:  p.origin  || prev.origin,
        process: proc || prev.process,
        tastingNotes: notes.length ? notes : prev.tastingNotes,
        roastLevel: (p.roastLevel >= 1 && p.roastLevel <= 10) ? Math.round(p.roastLevel) : prev.roastLevel }));
      setSuggestOff(true);
      if (!p.name && !p.roaster) setScanErr("couldn't read the label — try a straighter, brighter shot");
    } catch (e) {
      console.warn('[scan]', e);
      setScanErr('scan failed — ' + (e.message || 'try again'));
    } finally { setScanning(false); }
  };
  const initStr = useRef(JSON.stringify({ ...defaults, ...initial }));
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const toggleNote = n => setF(p => ({ ...p, tastingNotes: p.tastingNotes.includes(n) ? p.tastingNotes.filter(x=>x!==n) : [...p.tastingNotes, n] }));
  const hasChanges = JSON.stringify(f) !== initStr.current;
  const handleSave = () => {
    if (!f.name.trim()) return;
    // Commit scan-/selection-created new terms to the shared pools only now, on save,
    // so an abandoned form never pollutes the global vocabulary.
    const knownNotes = new Set([...notePresets, ...customNotes].map(s=>s.toLowerCase()));
    const newNotes = (f.tastingNotes||[]).filter(n => !knownNotes.has(String(n).toLowerCase()));
    if (newNotes.length) onAddNote([...customNotes, ...newNotes]);
    const knownProc = new Set([...procPresets, ...customProcesses].map(s=>s.toLowerCase()));
    if (f.process && !knownProc.has(f.process.toLowerCase())) onAddProcess([...customProcesses, f.process]);
    const bean = { id:initial.id||genId(), brews:initial.brews||0, color:initial.color||BEAN_COLORS[Math.floor(Math.random()*BEAN_COLORS.length)], ...f };
    if (share && !initial.id) queueShare('bean', { name:f.name.trim(), roaster:f.roaster||'', origin:f.origin||'',
      process:f.process||'', roastLevel:f.roastLevel||0, tastingNotes:f.tastingNotes||[] });
    onUpdate ? onUpdate(bean) : onSave(bean);
  };
  const handleBack = () => {
    if (hasChanges) { if (window.confirm('Save changes before leaving?')) handleSave(); else onBack(); }
    else onBack();
  };
  const nq = f.name.trim().toLowerCase();
  const suggestions = (!initial.id && !suggestOff && nq.length>=2)
    ? communityBeans.filter(b => b && b.name &&
        (b.name.toLowerCase().includes(nq) || (b.roaster||'').toLowerCase().includes(nq)) &&
        b.name.toLowerCase() !== nq).slice(0,4)
    : [];
  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, overflow:'hidden', background:P.bg }}>
      <NavBar title={initial.id ? 'Edit Bean' : 'Add Bean'} onBack={handleBack} onSave={handleSave} />
      <div className="scroll-y" style={{ flex:1, padding:'14px 16px' }}>
        {!initial.id && SB && (
          <div style={{ marginBottom:14 }}>
            <input ref={fileRef} type="file" accept="image/*" capture="environment"
              style={{ display:'none' }}
              onChange={e=>{ const file = e.target.files && e.target.files[0]; if (file) handleScan(file); e.target.value=''; }} />
            <div onClick={()=>{
                if (scanning) return;
                if (!session) { setScanErr('sign in on the Profile tab to use scanning'); return; }
                setScanErr(''); fileRef.current && fileRef.current.click();
              }}
              style={{ border:'1px dashed '+(scanning ? P.cafe : G.chipBorder), borderRadius:10,
                padding:'12px', textAlign:'center', cursor:'pointer' }}>
              <span style={{ fontSize:11, color: scanning ? P.cafe : G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>
                {scanning ? '☕ reading the label…' : '📷 scan the bag — auto-fill details'}
              </span>
            </div>
            {scanErr && <div style={{ fontSize:9, color:P.cafe, fontFamily:'IBM Plex Mono, monospace', marginTop:6, textAlign:'center' }}>{scanErr}</div>}
          </div>
        )}
        <div style={{ marginBottom:12 }}>
          <div style={{ fontSize:8.5, color:G.label, fontFamily:'IBM Plex Mono, monospace',
            marginBottom:5, letterSpacing:'0.1em', textTransform:'uppercase' }}>Bean Name</div>
          <div style={{ height:42, background:G.surface, border:'1px solid '+(suggestions.length?P.cafe:G.border),
            borderRadius: suggestions.length ? '10px 10px 0 0' : 10,
            display:'flex', alignItems:'center', padding:'0 14px' }}>
            <input placeholder="Ethiopia Yirgacheffe…" value={f.name}
              onChange={e=>{ set('name', e.target.value); setSuggestOff(false); }}
              style={{ fontSize:12, color:G.text }} />
          </div>
          {suggestions.length>0 && (
            <div style={{ background:G.surface, border:'1px solid '+P.cafe, borderTop:'none',
              borderRadius:'0 0 10px 10px', overflow:'hidden' }}>
              {suggestions.map(s=>(
                <div key={s.name+(s.roaster||'')}
                  onClick={()=>{ setF(p=>({ ...p, name:s.name, roaster:s.roaster||p.roaster,
                    origin:s.origin||p.origin, process:s.process||p.process, roastLevel:s.roastLevel||p.roastLevel,
                    tastingNotes:(Array.isArray(s.tastingNotes)&&s.tastingNotes.length)?s.tastingNotes:p.tastingNotes })); setSuggestOff(true); }}
                  style={{ padding:'9px 14px', borderBottom:'0.5px solid '+G.border, cursor:'pointer',
                    display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                  <div>
                    <div style={{ fontSize:11, color:G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>{s.name}</div>
                    {s.roaster && <div style={{ fontSize:8.5, color:G.label, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>{s.roaster}</div>}
                  </div>
                  <span style={{ fontSize:7.5, color:P.cafe, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.06em' }}>COMMUNITY</span>
                </div>
              ))}
            </div>
          )}
        </div>
        <GhostField label="Roaster" placeholder="Counter Culture…" value={f.roaster} onChange={v=>set('roaster',v)} />
        <GhostField label="Origin" placeholder="Ethiopia, Colombia…" value={f.origin} onChange={v=>set('origin',v)} />
        <ChipAdder label="Process" presets={procPresets} custom={customProcesses} onCustomChange={onAddProcess}
          selected={f.process?[f.process]:[]} onToggle={v=>set('process', f.process===v?'':v)} />
        <ChipAdder label="Roaster's Notes" presets={notePresets} custom={customNotes} onCustomChange={onAddNote}
          selected={f.tastingNotes} onToggle={toggleNote} />
        <div style={{ marginBottom:14 }}>
          <div style={{ display:'flex', alignItems:'baseline', gap:8, marginBottom:8 }}>
            <span style={{ fontSize:9, color:G.label, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.1em', textTransform:'uppercase' }}>Roast Level</span>
            {f.roastLevel > 0 && (
              <span style={{ fontSize:9, color:roastColor(f.roastLevel), fontFamily:'IBM Plex Mono, monospace' }}>
                {f.roastLevel} · {roastLabel(f.roastLevel)}
              </span>
            )}
          </div>
          <div style={{ display:'flex', gap:4 }}>
            {Array.from({length:10},(_,i)=>{
              const n = i+1;
              const c = n<=3?'#C8A66A':n<=7?'#8B5530':'#3D1A06';
              const filled = f.roastLevel >= n;
              return (
                <div key={n} onClick={()=>set('roastLevel', f.roastLevel===n ? 0 : n)}
                  style={{ flex:1, height:26, borderRadius:5, cursor:'pointer',
                    background: filled ? c : G.surface,
                    border:'0.5px solid '+(filled ? c : G.chipBorder),
                    transition:'all 0.1s' }} />
              );
            })}
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', marginTop:4 }}>
            <span style={{ fontSize:7.5, color:G.label, fontFamily:'IBM Plex Mono, monospace' }}>Light</span>
            <span style={{ fontSize:7.5, color:G.label, fontFamily:'IBM Plex Mono, monospace' }}>Dark</span>
          </div>
        </div>
        <div style={{ marginBottom:16 }}>
          <div style={{ fontSize:9, color:G.label, fontFamily:'IBM Plex Mono, monospace', marginBottom:8, letterSpacing:'0.1em', textTransform:'uppercase' }}>Rating</div>
          <RatingSquares n={f.rating} size={20} onChange={v=>set('rating',v)} />
        </div>
        {!initial.id && (
          <div onClick={()=>setShare(s=>!s)} style={{ display:'flex', alignItems:'center', gap:10, marginBottom:16, cursor:'pointer' }}>
            <div style={{ width:16, height:16, borderRadius:4, flexShrink:0,
              border:'0.5px solid '+(share?P.cafe:G.chipBorder),
              background: share?P.cafe:G.surface,
              display:'flex', alignItems:'center', justifyContent:'center' }}>
              {share && <span style={{ fontSize:10, color:'#fff', lineHeight:1 }}>✓</span>}
            </div>
            <div>
              <div style={{ fontSize:12, color:G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>Share with the community library</div>
              <div style={{ fontSize:8.5, color:G.label, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, marginTop:2 }}>name, roaster, origin, process, roast level & the roaster's printed notes — never your own ratings</div>
            </div>
          </div>
        )}
        <div style={{ height:8 }} />
      </div>
      <div style={{ padding:'10px 20px calc(12px + env(safe-area-inset-bottom))',
        background:P.bg, borderTop:'1px solid '+P.line, flexShrink:0 }}>
        <PrimaryButton label={initial.id ? 'Save changes' : 'Save bean'} onPress={handleSave} />

  );
}
