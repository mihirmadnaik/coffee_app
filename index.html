// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [entries,     setEntries]     = useLS('coffee_entries',  []);
  const [beans,       setBeans]       = useLS('coffee_beans',    []);
  const [customNotes, setCustomNotes] = useLS('custom_notes',    []);
  const [customDrinks,setCustomDrinks]= useLS('custom_drinks',   []);
  const [gear,        setGear]        = useLS('coffee_gear',     []);
  const community = useCommunity();
  useEffect(() => { flushShareQueue(); }, []);

  const [session, setSession] = useState(null);
  useEffect(() => {
    if (!SB) return;
    SB.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = SB.auth.onAuthStateChange((_evt, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  // ── Cloud sync orchestration ──
  const [syncState, setSyncState]   = useState('idle'); // idle | syncing | error
  const [lastSyncAt, setLastSyncAt] = useState(null);
  const syncBusyRef  = useRef(false);
  const syncAgainRef = useRef(false);
  const syncTimerRef = useRef(null);
  const stateRef = useRef({});
  stateRef.current = { entries, beans, gear, customNotes, customDrinks, session };

  const doSync = useCallback(async () => {
    const s = stateRef.current.session;
    if (!SB || !s) return;
    if (syncBusyRef.current) { syncAgainRef.current = true; return; }
    syncBusyRef.current = true;
    setSyncState('syncing');
    try {
      const uid = s.user.id;
      const shadowKey = 'sync_shadow_'+uid, cursorKey = 'sync_pull_'+uid;
      let shadow = null;
      try { shadow = JSON.parse(localStorage.getItem(shadowKey)); } catch {}
      let lastPull = localStorage.getItem(cursorKey) || '1970-01-01T00:00:00Z';
      let cols = { entries: stateRef.current.entries, beans: stateRef.current.beans,
        gear: stateRef.current.gear, customNotes: stateRef.current.customNotes,
        customDrinks: stateRef.current.customDrinks };

      if (!shadow) {
        // First sync for this account on this device
        const all = await syncPullAll('1970-01-01T00:00:00Z');
        const remoteCols = syncApplyRemote(all, new Set(),
          { entries:[], beans:[], gear:[], customNotes:[], customDrinks:[] }).cols;
        const remoteLive = all.filter(r => !r.deleted && r.kind !== 'setting');
        const localCount = cols.entries.length + cols.beans.length + cols.gear.length;
        let discard = false;
        if (localCount > 0 && remoteLive.length > 0) {
          discard = !window.confirm(
            'This device has '+localCount+' local item(s) and your account already has cloud data.\n\n'+
            'OK = merge local items into your account\n'+
            'Cancel = discard local items and load your account data');
        }
        // Shadow starts as the remote state, so local extras become pending pushes
        shadow = syncSnapshot(remoteCols);
        if (discard) {
          // Take the cloud state wholesale — nothing local survives, nothing is pushed
          cols = remoteCols;
        } else {
          const pending = new Set(syncDiff(shadow, syncSnapshot(cols)).map(r => r.kind+':'+r.id));
          cols = syncApplyRemote(all, pending, cols).cols;
        }
        if (all.length) lastPull = all[all.length-1].updated_at;
      } else {
        const rows = await syncPullAll(lastPull);
        if (rows.length) {
          const pending = new Set(syncDiff(shadow, syncSnapshot(cols)).map(r => r.kind+':'+r.id));
          cols = syncApplyRemote(rows, pending, cols).cols;
          lastPull = rows[rows.length-1].updated_at;
        }
      }

      // Push everything that changed locally since the shadow
      const snap = syncSnapshot(cols);
      const changes = syncDiff(shadow, snap);
      for (let i = 0; i < changes.length; i += 200) {
        const { error } = await SB.from('user_data')
          .upsert(changes.slice(i, i+200), { onConflict: 'user_id,id' });
        if (error) throw error;
      }
      if (changes.length) lastPull = changes.reduce((m,r) => r.updated_at > m ? r.updated_at : m, lastPull);

      // Commit: shadow, pull cursor, and any merged-in remote data
      localStorage.setItem(shadowKey, JSON.stringify(snap));
      localStorage.setItem(cursorKey, lastPull);
      const cur = stateRef.current;
      if (JSON.stringify(cols.entries)      !== JSON.stringify(cur.entries))      setEntries(cols.entries);
      if (JSON.stringify(cols.beans)        !== JSON.stringify(cur.beans))        setBeans(cols.beans);
      if (JSON.stringify(cols.gear)         !== JSON.stringify(cur.gear))         setGear(cols.gear);
      if (JSON.stringify(cols.customNotes)  !== JSON.stringify(cur.customNotes))  setCustomNotes(cols.customNotes);
      if (JSON.stringify(cols.customDrinks) !== JSON.stringify(cur.customDrinks)) setCustomDrinks(cols.customDrinks);
      setSyncState('idle');
      setLastSyncAt(new Date());
    } catch (e) {
      console.warn('[sync] failed', e);
      setSyncState('error');
    } finally {
      syncBusyRef.current = false;
      if (syncAgainRef.current) { syncAgainRef.current = false; doSync(); }
    }
  }, []);

  // Sync on sign-in (and when the signed-in user changes)
  useEffect(() => {
    if (!session) { setSyncState('idle'); return; }
    doSync();
  }, [session?.user?.id]);

  // Debounced sync after local changes
  useEffect(() => {
    if (!session) return;
    clearTimeout(syncTimerRef.current);
    syncTimerRef.current = setTimeout(doSync, 3500);
    return () => clearTimeout(syncTimerRef.current);
  }, [entries, beans, gear, customNotes, customDrinks]);
  const gearCatalog = [...GEAR_CATALOG, ...community.gear.filter(g =>
    g && g.n && !GEAR_CATALOG.some(c => c.n.toLowerCase()===g.n.toLowerCase()))];
  const [view,    setView]          = useState('home');
  const [showSheet, setSheet]       = useState(false);
  const [formInit,  setInit]        = useState({});
  const [selectedEntry, setSelEntry]= useState(null);
  const [selectedBean,  setSelBean] = useState(null);
  const [timerRecipe,   setTimerRecipe] = useState(null);

  const goTab = t => { setSheet(false); setView(['home','beans',null,'stats','profile'][t]); };

  const saveEntry = entry => { setEntries([entry,...entries]); setSheet(false); setView('home'); };

  const updateEntry = entry => {
    setEntries(prev => prev.map(e => e.id===entry.id ? entry : e));
    setSelEntry(entry);
    setView('entry-detail');
  };

  const updateBean = bean => {
    setBeans(prev => prev.map(b => b.id===bean.id ? bean : b));
    setSelBean(bean);
    setView('bean-detail');
  };

  const expand = (type, partial) => { setInit(partial); setSheet(false); setView(type==='cafe'?'cafe-form':'brew-form'); };

  const brewAgain  = src => saveEntry({ ...src, id:genId(), date:new Date().toISOString() });
  const startTimer = r => { setTimerRecipe(r); setView('brew-timer'); };
  const pinDialed  = entry => setBeans(prev => prev.map(b => {
    if (b.name !== entry.beanName) return b;
    const snap = { method:entry.method||'', grinder:entry.grinder||'', machine:entry.machine||'',
      dose:entry.dose||'', water:entry.water||'', temp:entry.temp||'', brewTime:entry.brewTime||'',
      grindSize:entry.grindSize||'', ratio:entry.ratio||'', recipe:entry.recipe||'' };
    return { ...b, dialed:undefined,
      dialedByMethod:{ ...(dialedMap(b)||{}), [entry.method||'Brew']: snap } };
  }));

  const sp = { onTab:goTab, onAdd:()=>setSheet(true) };

  return (
    <div style={{ width:'100%', height:'100%', display:'flex', flexDirection:'column', overflow:'hidden', background:P.bg }}>
      {view==='home'         && <HomeScreen    entries={entries} {...sp} onEntryPress={e=>{ setSelEntry(e); setView('entry-detail'); }} onLogCafe={p=>{ setInit(p); setView('cafe-form'); }} onBrewAgain={brewAgain} onStartTimer={startTimer} />}
      {view==='beans'        && <BeanLibrary   beans={beans} {...sp} onAddBean={()=>setView('add-bean')} onBeanPress={b=>{ setSelBean(b); setView('bean-detail'); }} />}
      {view==='stats'        && <StatsDash     entries={entries} {...sp} />}
      {view==='profile'      && <ProfileScreen entries={entries} beans={beans} {...sp} gear={gear} onGearChange={setGear} gearCatalog={gearCatalog} session={session} syncState={syncState} lastSyncAt={lastSyncAt} onSync={doSync} />}
      {view==='entry-detail' && selectedEntry && <EntryDetail entry={selectedEntry} onBack={()=>setView('home')} onEdit={()=>{ setInit(selectedEntry); setView(selectedEntry.type==='cafe'?'cafe-form-edit':'brew-form-edit'); }} beans={beans} onPinDialed={pinDialed} onBrewAgain={brewAgain} onStartTimer={startTimer} />}
      {view==='bean-detail'  && selectedBean  && <BeanDetail  bean={selectedBean}  onBack={()=>setView('beans')} onEdit={()=>{ setInit(selectedBean); setView('bean-form-edit'); }} entries={entries} onBrewNow={startTimer} communityRecipes={community.recipes} />}
      {view==='brew-timer'   && timerRecipe   && <TimerScreen recipe={timerRecipe} onCancel={()=>setView('home')} onLog={saveEntry} />}
      {view==='cafe-form'    && <CafeForm  initial={formInit} onBack={()=>setView('home')}         onSave={saveEntry}   customNotes={customNotes} onAddNote={setCustomNotes} customDrinks={customDrinks} onAddDrink={setCustomDrinks} />}
      {view==='brew-form'    && <BrewForm  initial={formInit} onBack={()=>setView('home')}         onSave={saveEntry}   beans={beans} entries={entries} gear={gear} customNotes={customNotes} onAddNote={setCustomNotes} />}
      {view==='cafe-form-edit'&& <CafeForm initial={formInit} onBack={()=>setView('entry-detail')} onUpdate={updateEntry} customNotes={customNotes} onAddNote={setCustomNotes} customDrinks={customDrinks} onAddDrink={setCustomDrinks} />}
      {view==='brew-form-edit'&& <BrewForm initial={formInit} onBack={()=>setView('entry-detail')} onUpdate={updateEntry} beans={beans} entries={entries} gear={gear} customNotes={customNotes} onAddNote={setCustomNotes} />}
      {view==='add-bean'     && <AddBeanForm onBack={()=>setView('beans')} onSave={b=>{ setBeans([b,...beans]); setView('beans'); }} communityBeans={community.beans} />}
      {view==='bean-form-edit'&& <AddBeanForm initial={formInit} onBack={()=>setView('bean-detail')} onUpdate={updateBean} />}
      {showSheet && <QuickCaptureSheet onClose={()=>setSheet(false)} onSave={saveEntry} onExpand={expand} beans={beans} gear={gear} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
