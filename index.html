// ── Stats ─────────────────────────────────────────────────────────────────────
function StatsDash({ entries, onTab, onAdd }) {
  const [period, setPeriod] = useState('month');
  const now = new Date();
  const subset = period==='month'
    ? entries.filter(e=>{ const d=new Date(e.date); return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear(); })
    : entries;
  const cafe  = subset.filter(e=>e.type==='cafe');
  const brews = subset.filter(e=>e.type==='brew');
  const rats  = subset.filter(e=>e.rating>0).map(e=>e.rating);
  const avg   = rats.length ? (rats.reduce((a,b)=>a+b,0)/rats.length).toFixed(1) : '—';

  const barData = Array.from({length:16},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(15-i));
    return entries.filter(e=>e.date.startsWith(d.toISOString().slice(0,10))).length;
  });
  const maxBar = Math.max(...barData,1);

  const methodMap = {};
  brews.forEach(e=>{ const m=e.method||'Other'; methodMap[m]=(methodMap[m]||0)+1; });
  const topMethods = Object.entries(methodMap).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([m,c])=>({ m, p:Math.round((c/(brews.length||1))*100) }));

  const noteMap = {};
  entries.forEach(e=>{
    const r = e.rating||(e.ratings?.overall)||0;
    if (!r || !e.tastingNotes?.length) return;
    e.tastingNotes.forEach(n=>{ if(!noteMap[n]) noteMap[n]={sum:0,cnt:0}; noteMap[n].sum+=r; noteMap[n].cnt++; });
  });
  const noteAvgs = Object.entries(noteMap).filter(([,s])=>s.cnt>=2)
    .map(([n,s])=>({ n, avg:s.sum/s.cnt })).sort((a,b)=>b.avg-a.avg);
  const enjoyNotes  = noteAvgs.filter(x=>x.avg>=4).map(x=>x.n);
  const dislikeNotes= noteAvgs.filter(x=>x.avg<=2).map(x=>x.n);

  const stats = [
    { l:'Total Coffees', v:String(subset.length), s:period==='month'?'this month':'all time' },
    { l:'Avg Rating',    v:avg,                    s:'out of 5' },
    { l:'Cafés Visited', v:String(cafe.length),    s:'café visits' },
    { l:'Home Brews',    v:String(brews.length),   s:period==='month'?'this month':'all time' },
  ];

  const d1=new Date(); d1.setDate(d1.getDate()-15);
  const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, overflow:'hidden' }}>
      <div style={{ padding:'18px 16px 12px', paddingTop:'calc(18px + env(safe-area-inset-top))' }}>
        <div style={{ fontSize:26, fontWeight:700, letterSpacing:'-0.02em', color:P.headerText, lineHeight:1 }}>Insights</div>
        <div style={{ display:'inline-flex', marginTop:12, background:P.cardBg,
          border:'1px solid '+P.line, borderRadius:20, padding:3, gap:2 }}>
          {[['month','This Month'],['all','All Time']].map(([val,lbl])=>(
            <div key={val} onClick={()=>setPeriod(val)} style={{ fontSize:10.5, fontWeight:600,
              padding:'4px 12px', borderRadius:16, cursor:'pointer', transition:'all 0.15s',
              background: period===val?P.acc:'transparent',
              color: period===val?'#fff':P.headerMuted }}>{lbl}</div>
          ))}
        </div>
      </div>
      <div className="scroll-y" style={{ flex:1, padding:'0 16px 8px' }}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:8 }}>
          {stats.map((s,i)=>(
            <div key={i} style={{ background:P.cardBg2, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 13px' }}>
              <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:5 }}>{s.l}</div>
              <div style={{ fontSize:30, fontWeight:400, color:P.headerText, fontFamily:'Hanken Grotesk, sans-serif', lineHeight:1 }}>{s.v}</div>
              <div style={{ fontSize:9, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, marginTop:3 }}>{s.s}</div>
            </div>
          ))}
        </div>
        <div style={{ background:P.cardBg, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 13px', marginBottom:8 }}>
          <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:10 }}>Coffees per day</div>
          <div style={{ display:'flex', alignItems:'flex-end', gap:3, height:56 }}>
            {barData.map((v,i)=>(
              <div key={i} style={{ flex:1, height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'flex-end' }}>
                <div style={{ width:'100%', borderRadius:'2px 2px 0 0',
                  height: v===0?3:`${(v/maxBar)*100}%`, opacity:v===0?0.3:1,
                  background: i===barData.length-1?P.cafe:P.cardBg2,
                  border:'0.5px solid '+(i===barData.length-1?P.cafe:P.cardStroke) }} />
              </div>
            ))}
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', marginTop:6 }}>
            <span style={{ fontSize:8, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace' }}>{fmt(d1)}</span>
            <span style={{ fontSize:8, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace' }}>{fmt(now)}</span>
          </div>
        </div>
        {topMethods.length>0 && (
          <div style={{ background:P.cardBg, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 13px', marginBottom:8 }}>
            <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:10 }}>Top Brew Methods</div>
            {topMethods.map((r,i)=>(
              <div key={i} style={{ marginBottom: i<topMethods.length-1?10:0 }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:4 }}>
                  <span style={{ fontSize:10, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace' }}>{r.m}</span>
                  <span style={{ fontSize:9, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace' }}>{r.p}%</span>
                </div>
                <div style={{ height:4, borderRadius:3, background:P.cardBg2 }}>
                  <div style={{ width:r.p+'%', height:'100%', borderRadius:3, background:i===0?P.cafe:P.brew, transition:'width 0.3s' }} />
                </div>
              </div>
            ))}
          </div>
        )}
        {(enjoyNotes.length>0||dislikeNotes.length>0) && (
          <div style={{ background:P.cardBg, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 13px', marginBottom:8 }}>
            <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:10 }}>Taste Profile</div>
            {enjoyNotes.length>0 && (
              <div style={{ marginBottom:dislikeNotes.length>0?10:0 }}>
                <div style={{ fontSize:9, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', marginBottom:6 }}>You tend to enjoy</div>
                <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
                  {enjoyNotes.map(n=><GhostChip key={n} label={n} active />)}
                </div>
              </div>
            )}
            {dislikeNotes.length>0 && (
              <div>
                <div style={{ fontSize:9, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', marginBottom:6 }}>You tend to dislike</div>
                <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
                  {dislikeNotes.map(n=><GhostChip key={n} label={n} />)}
                </div>
              </div>
            )}
          </div>
        )}
        <div style={{ height:16 }} />
      </div>
      <TabBar active={3} onTab={onTab} onAdd={onAdd} />
    </div>
  );
}

// ── Gear Locker ───────────────────────────────────────────────────────────────
function GearLocker({ gear, onChange, onRemove, catalog=GEAR_CATALOG }) {
  const [q, setQ]               = useState('');
  const [customMode, setCustom] = useState(false);
  const [cName, setCName]       = useState('');
  const [cCat, setCCat]         = useState('grinder');
  const [cAdj, setCAdj]         = useState('clicks');
  const [cShare, setCShare]     = useState(false);
  const [editId, setEditId]     = useState(null);

  const owned = new Set(gear.map(g => g.n.toLowerCase()));
  const ql = q.trim().toLowerCase();
  const results = ql
    ? catalog.filter(it => !owned.has(it.n.toLowerCase()) && it.n.toLowerCase().includes(ql)).slice(0,6)
    : [];

  const add = it => { onChange([...gear, { id:genId(), ...it }]); setQ(''); };
  const addCustom = () => {
    const n = cName.trim(); if (!n) return;
    const item = { id:genId(), c:cCat, n };
    if (cCat==='grinder') item.adj = cAdj;
    if (cCat==='brewer' || cCat==='machine') item.m = [cCat==='machine' ? 'Espresso' : n];
    onChange([...gear, item]);
    if (cShare) { const { id, ...pub } = item; queueShare('gear', pub); }
    setCName(''); setCustom(false); setCShare(false); setQ('');
  };
  const remove = id => { onRemove ? onRemove(id) : onChange(gear.filter(g => g.id!==id)); if (editId===id) setEditId(null); };
  const update = (id, k, v) => onChange(gear.map(g => g.id===id ? { ...g, [k]:v } : g));
  const catLabel = c => (GEAR_CATS.find(([k])=>k===c)||[c,c])[1];

  const smallInput = { fontSize:10, color:G.text, background:G.surface, border:'1px solid '+G.border,
    borderRadius:8, padding:'6px 10px', fontFamily:'IBM Plex Mono, monospace', fontWeight:300 };

  return (
    <div style={{ background:P.cardBg, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 14px', marginBottom:8 }}>
      <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:10 }}>My Gear</div>

      {gear.length===0 && !ql && !customMode && (
        <div style={{ fontSize:10, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, lineHeight:1.6, marginBottom:10 }}>
          Add your grinder and brewers — the brew form will adapt to what you own.
        </div>
      )}

      {gear.map(g => (
        <div key={g.id} style={{ marginBottom:6 }}>
          <div onClick={()=>setEditId(editId===g.id?null:g.id)}
            style={{ display:'flex', alignItems:'center', gap:10, background:P.cardBg2,
              border:'0.5px solid '+(editId===g.id?P.cafe:P.cardStroke), borderRadius:10,
              padding:'9px 12px', cursor:'pointer' }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:12, color:P.headerText, fontFamily:'IBM Plex Mono, monospace', fontWeight:400 }}>{g.n}</div>
              <div style={{ fontSize:8.5, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, marginTop:2 }}>
                {[catLabel(g.c), g.adj, g.filter && `filter ${g.filter}`, g.esp && `esp ${g.esp}`].filter(Boolean).join(' · ')}
              </div>
            </div>
            <span onClick={e=>{ e.stopPropagation(); remove(g.id); }}
              style={{ fontSize:14, color:P.headerMuted, cursor:'pointer', padding:'0 2px' }}>×</span>
          </div>
          {editId===g.id && g.c==='grinder' && (
            <div style={{ background:'rgba(220,205,180,0.05)', border:'0.5px solid '+P.cardStroke, borderTop:'none',
              borderRadius:'0 0 10px 10px', padding:'10px 12px', margin:'0 4px' }}>
              <div style={{ fontSize:8, color:G.label, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:6 }}>Adjustment</div>
              <div style={{ display:'flex', gap:5, marginBottom:10 }}>
                {['clicks','dial','stepless'].map(a=>(
                  <GhostChip key={a} label={a} active={g.adj===a} onPress={()=>update(g.id,'adj',a)} />
                ))}
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8 }}>
                <div>
                  <div style={{ fontSize:8, color:G.label, fontFamily:'IBM Plex Mono, monospace', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.08em' }}>Filter setting</div>
                  <input value={g.filter||''} placeholder="e.g. 22–28" onChange={e=>update(g.id,'filter',e.target.value)} style={smallInput} />
                </div>
                <div>
                  <div style={{ fontSize:8, color:G.label, fontFamily:'IBM Plex Mono, monospace', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.08em' }}>Espresso setting</div>
                  <input value={g.esp||''} placeholder="e.g. 8–12" onChange={e=>update(g.id,'esp',e.target.value)} style={smallInput} />
                </div>
                <div>
                  <div style={{ fontSize:8, color:G.label, fontFamily:'IBM Plex Mono, monospace', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.08em' }}>Range max</div>
                  <input type="number" value={g.max||''} placeholder="e.g. 40"
                    onChange={e=>update(g.id,'max', e.target.value==='' ? '' : parseFloat(e.target.value))} style={smallInput} />
                </div>
              </div>
            </div>
          )}
        </div>
      ))}

      {!customMode && (
        <div style={{ marginTop:8 }}>
          <div style={{ background:G.surface, border:'1px solid '+(ql?P.cafe:G.border), borderRadius:ql&&(results.length||true)?'10px 10px 0 0':'10px',
            display:'flex', alignItems:'center', padding:'8px 12px' }}>
            <input placeholder="Search grinders, brewers, machines…" value={q} onChange={e=>setQ(e.target.value)}
              style={{ fontSize:11, color:G.text }} />
          </div>
          {ql && (
            <div style={{ background:G.surface, border:'1px solid '+P.cafe, borderTop:'none',
              borderRadius:'0 0 10px 10px', overflow:'hidden' }}>
              {results.map(it=>(
                <div key={it.n} onClick={()=>add(it)}
                  style={{ padding:'9px 12px', borderBottom:'0.5px solid '+G.border, cursor:'pointer',
                    display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                  <span style={{ fontSize:11, color:G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>{it.n}</span>
                  <span style={{ fontSize:8, color:G.label, fontFamily:'IBM Plex Mono, monospace' }}>{catLabel(it.c)}</span>
                </div>
              ))}
              <div onClick={()=>{ setCustom(true); setCName(q); }} style={{ padding:'9px 12px', cursor:'pointer' }}>
                <span style={{ fontSize:10, color:P.cafe, fontFamily:'IBM Plex Mono, monospace' }}>+ add "{q}" as custom gear</span>
              </div>
            </div>
          )}
        </div>
      )}

      {customMode && (
        <div style={{ marginTop:8, background:'rgba(220,205,180,0.05)', border:'0.5px solid '+P.cardStroke, borderRadius:10, padding:'10px 12px' }}>
          <div style={{ fontSize:8, color:G.label, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:6 }}>Category</div>
          <div style={{ display:'flex', flexWrap:'wrap', gap:5, marginBottom:10 }}>
            {GEAR_CATS.map(([k,l])=><GhostChip key={k} label={l} active={cCat===k} onPress={()=>setCCat(k)} />)}
          </div>
          <div style={{ marginBottom:10 }}>
            <input autoFocus placeholder="Name…" value={cName} onChange={e=>setCName(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter') addCustom(); }} style={smallInput} />
          </div>
          {cCat==='grinder' && (
            <>
              <div style={{ fontSize:8, color:G.label, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:6 }}>How do you set grind size?</div>
              <div style={{ display:'flex', gap:5, marginBottom:10 }}>
                {['clicks','dial','stepless'].map(a=><GhostChip key={a} label={a} active={cAdj===a} onPress={()=>setCAdj(a)} />)}
              </div>
            </>
          )}
          <div onClick={()=>setCShare(s=>!s)} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10, cursor:'pointer' }}>
            <div style={{ width:14, height:14, borderRadius:4, flexShrink:0,
              border:'0.5px solid '+(cShare?P.cafe:G.chipBorder),
              background: cShare?P.cafe:G.surface,
              display:'flex', alignItems:'center', justifyContent:'center' }}>
              {cShare && <span style={{ fontSize:9, color:'#fff', lineHeight:1 }}>✓</span>}
            </div>
            <span style={{ fontSize:9, color:G.label, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>share with the community library</span>
          </div>
          <div style={{ display:'flex', gap:8 }}>
            <div onClick={addCustom} style={{ flex:1, background:P.cafe, borderRadius:8, padding:'8px', textAlign:'center', cursor:'pointer' }}>
              <span style={{ fontSize:10, color:'#fff', fontFamily:'IBM Plex Mono, monospace' }}>add</span>
            </div>
            <div onClick={()=>{ setCustom(false); setCName(''); setCShare(false); }} style={{ flex:1, border:'1px solid '+G.chipBorder, borderRadius:8, padding:'8px', textAlign:'center', cursor:'pointer' }}>
              <span style={{ fontSize:10, color:G.label, fontFamily:'IBM Plex Mono, monospace' }}>cancel</span>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Account (Supabase auth, email + password) ────────────────────────────────
function AccountCard({ session, syncState, lastSyncAt, onSync }) {
  const [mode, setMode]   = useState('signin'); // signin | signup
  const [email, setEmail] = useState('');
  const [pw, setPw]       = useState('');
  const [busy, setBusy]   = useState(false);
  const [err, setErr]     = useState('');
  if (!SB) return null;

  const inputStyle = { fontSize:11, color:G.text, background:G.surface, border:'1px solid '+G.border,
    borderRadius:10, padding:'10px 12px', fontFamily:'IBM Plex Mono, monospace', fontWeight:300 };

  const submit = async () => {
    const em = email.trim().toLowerCase();
    if (!em.includes('@')) { setErr('enter a valid email'); return; }
    if (pw.length < 6) { setErr('password must be at least 6 characters'); return; }
    setBusy(true); setErr('');
    const fn = mode==='signup' ? 'signUp' : 'signInWithPassword';
    const { error } = await SB.auth[fn]({ email: em, password: pw });
    setBusy(false);
    if (error) setErr(error.message.toLowerCase());
    // on success onAuthStateChange updates session and this card re-renders signed-in
  };

  return (
    <div style={{ background:P.cardBg, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 14px', marginBottom:8 }}>
      <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:10 }}>Account</div>
      {session ? (
        <>
          <div style={{ fontSize:11, color:G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>
            signed in as <span style={{ color:P.cafe }}>{session.user.email}</span>
          </div>
          <div style={{ fontSize:9, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, marginTop:4, lineHeight:1.6,
            color: syncState==='error' ? P.cafe : P.headerMuted }}>
            {syncState==='syncing' ? '↻ syncing…'
              : syncState==='error' ? 'sync failed — check connection & retry'
              : lastSyncAt ? '✓ synced '+formatTime(lastSyncAt.toISOString())
              : 'waiting for first sync…'}
          </div>
          <div style={{ display:'flex', gap:8, marginTop:10 }}>
            <div onClick={onSync}
              style={{ flex:1, border:'1px solid '+P.brew, borderRadius:9, padding:'8px', textAlign:'center',
                cursor:'pointer', opacity: syncState==='syncing'?0.5:1 }}>
              <span style={{ fontSize:10, color:P.brew, fontFamily:'IBM Plex Mono, monospace' }}>sync now</span>
            </div>
            <div onClick={()=>SB.auth.signOut()}
              style={{ flex:1, border:'1px solid '+G.chipBorder, borderRadius:9, padding:'8px', textAlign:'center', cursor:'pointer' }}>
              <span style={{ fontSize:10, color:G.label, fontFamily:'IBM Plex Mono, monospace' }}>sign out</span>
            </div>
          </div>
        </>
      ) : (
        <>
          <div style={{ fontSize:9, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, marginBottom:8, lineHeight:1.6 }}>
            {mode==='signup' ? 'create an account to back up your diary & sync across devices' : 'sign in to your account'}
          </div>
          <input type="email" inputMode="email" autoComplete="email" placeholder="you@example.com" value={email}
            onChange={e=>setEmail(e.target.value)}
            style={{ ...inputStyle, marginBottom:8, width:'100%' }} />
          <input type="password" autoComplete={mode==='signup'?'new-password':'current-password'}
            placeholder="password" value={pw}
            onChange={e=>setPw(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') submit(); }}
            style={{ ...inputStyle, marginBottom:8, width:'100%' }} />
          <div onClick={busy?undefined:submit} style={{ background:P.cafe, borderRadius:9, padding:'10px', textAlign:'center',
            cursor:'pointer', opacity: busy?0.6:1 }}>
            <span style={{ fontSize:10, color:'#fff', fontFamily:'IBM Plex Mono, monospace' }}>
              {busy ? 'please wait…' : mode==='signup' ? 'create account' : 'sign in'}
            </span>
          </div>
          <div onClick={()=>{ setMode(mode==='signup'?'signin':'signup'); setErr(''); }}
            style={{ marginTop:8, textAlign:'center', cursor:'pointer' }}>
            <span style={{ fontSize:9, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace' }}>
              {mode==='signup' ? 'already have an account? sign in' : 'new here? create an account'}
            </span>
          </div>
          {err && <div style={{ fontSize:9, color:P.cafe, fontFamily:'IBM Plex Mono, monospace', marginTop:8, textAlign:'center' }}>{err}</div>}
        </>
      )}
    </div>
  );
}

// ── Profile ───────────────────────────────────────────────────────────────────

  const brew  = entries.filter(e=>e.type==='brew').length;
  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, overflow:'hidden' }}>

          border:'0.5px solid '+P.cardStroke, display:'flex', alignItems:'center',
          justifyContent:'center', marginBottom:12, fontSize:32 }}>☕</div>
        <div style={{ fontSize:20, fontWeight:500, color:P.headerText, fontFamily:'Hanken Grotesk, sans-serif' }}>Coffee Diary</div>
        <div style={{ fontSize:10, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, marginTop:4 }}>Your personal coffee journal</div>

        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, marginBottom:16 }}>
          {[['Total',total],['Café',cafe],['Brews',brew]].map(([l,v])=>(
            <div key={l} style={{ background:P.cardBg2, border:'0.5px solid '+P.cardStroke,
              borderRadius:14, padding:'12px 10px', textAlign:'center' }}>
              <div style={{ fontSize:26, fontWeight:400, color:P.headerText, fontFamily:'Hanken Grotesk, sans-serif', lineHeight:1 }}>{v}</div>

            </div>
          ))}
        </div>
        <GearLocker gear={gear} onChange={onGearChange} onRemove={onGearRemove} catalog={gearCatalog} />
        {(() => {

          <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:8 }}>Brew Timer</div>
          <div style={{ fontSize:9, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, lineHeight:1.6, marginBottom:10 }}>
            {timerMode==='staged'
              ? 'Guided: each stage is its own countdown that chimes when done; manual steps wait for a tap.'
              : 'Checklist: one running clock with the method’s steps highlighted as time passes.'}
          </div>
          <div style={{ display:'flex', gap:8 }}>
            {[['staged','Guided'],['checklist','Checklist']].map(([val,lbl])=>(
              <div key={val} onClick={()=>onTimerModeChange(val)}
                style={{ flex:1, borderRadius:9, padding:'9px', textAlign:'center', cursor:'pointer',

                  border:'1px solid '+(timerMode===val ? P.brew : G.chipBorder) }}>
                <span style={{ fontSize:10, fontFamily:'IBM Plex Mono, monospace', color: timerMode===val ? '#fff' : G.text }}>{lbl}</span>

          </div>

        <div style={{ background:P.cardBg, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 14px', marginBottom:8 }}>
          <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:8 }}>Backup</div>
          <div style={{ fontSize:9, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, lineHeight:1.6, marginBottom:10 }}>
            Download a copy of your diary, or restore one. Kept on your device — a safety net independent of cloud sync.
          </div>
          <input ref={importRef} type="file" accept="application/json,.json" style={{ display:'none' }}
            onChange={e=>{ const file = e.target.files && e.target.files[0]; if (file && onImport) onImport(file); e.target.value=''; }} />
          <div style={{ display:'flex', gap:8 }}>
            <div onClick={onExport} style={{ flex:1, border:'1px solid '+G.chipBorder, borderRadius:9, padding:'9px', textAlign:'center', cursor:'pointer' }}>
              <span style={{ fontSize:10, color:G.text, fontFamily:'IBM Plex Mono, monospace' }}>export</span>
            </div>
            <div onClick={()=>importRef.current && importRef.current.click()} style={{ flex:1, border:'1px solid '+G.chipBorder, borderRadius:9, padding:'9px', textAlign:'center', cursor:'pointer' }}>
              <span style={{ fontSize:10, color:G.text, fontFamily:'IBM Plex Mono, monospace' }}>import</span>
            </div>
          </div>
        </div>
        <div style={{ background:P.cardBg, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 14px', marginBottom:8 }}>
          <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:8 }}>About</div>
          <div style={{ fontSize:12, color:G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, lineHeight:1.6 }}>
            Track coffee experiences, at home or outside. Log cafés, home brews, tasting notes, and brew parameters — all in one place.
          </div>
        </div>
        <div style={{ height:16 }} />
      </div>
      <TabBar active={4} onTab={onTab} onAdd={onAdd} />
    </div>
  );
}

// ── Detail helpers ────────────────────────────────────────────────────────────
function DetailRow({ label, value }) {
  if (!value) return null;
  return (
    <div style={{ marginBottom:10 }}>
      <div style={{ fontSize:8.5, color:G.label, fontFamily:'IBM Plex Mono, monospace',
        marginBottom:3, letterSpacing:'0.1em', textTransform:'uppercase' }}>{label}</div>
      <div style={{ fontSize:13, color:G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, lineHeight:1.5 }}>{value}</div>
    </div>
  );
}

function BeanPicker({ beans=[], value='', onChange, onBeanSelect }) {
  const [open, setOpen] = useState(false);
  const [customMode, setCustomMode] = useState(beans.length===0 || (!!value && !beans.some(b=>b.name===value)));
  if (customMode || beans.length===0) return (
    <div style={{ marginBottom:12 }}>
      <div style={{ fontSize:8.5, color:G.label, fontFamily:'IBM Plex Mono, monospace',
        marginBottom:5, letterSpacing:'0.1em', textTransform:'uppercase' }}>Bean Name</div>
      <div style={{ height:42, background:G.surface, border:'1px solid '+G.border,
        borderRadius:10, display:'flex', alignItems:'center', padding:'0 14px' }}>
        <input placeholder="Enter bean name…" value={value}
          onChange={e=>onChange(e.target.value)} style={{ fontSize:12, color:G.text }} />
      </div>
      {beans.length>0 && (
        <div onClick={()=>{ setCustomMode(false); onChange(''); }}
          style={{ fontSize:9, color:P.cafe, marginTop:5, fontFamily:'IBM Plex Mono, monospace', cursor:'pointer' }}>
          ← choose from saved beans
        </div>
      )}
    </div>
  );
  return (
    <div style={{ marginBottom:12 }}>
      <div style={{ fontSize:8.5, color:G.label, fontFamily:'IBM Plex Mono, monospace',
        marginBottom:5, letterSpacing:'0.1em', textTransform:'uppercase' }}>Bean Name</div>
      <div onClick={()=>setOpen(o=>!o)} style={{ height:42, background:G.surface,
        border:'1px solid '+(open?P.cafe:G.border),
        borderRadius: open ? '10px 10px 0 0' : 10,
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'0 14px', cursor:'pointer' }}>
        <span style={{ fontSize:12, color:value?G.text:G.placeholder,
          fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>{value||'Select a bean…'}</span>
        <span style={{ fontSize:9, color:G.label }}>{open?'▲':'▼'}</span>
      </div>
      {open && (
        <div style={{ background:G.surface, border:'1px solid '+P.cafe,
          borderTop:'none', borderRadius:'0 0 10px 10px', overflow:'hidden' }}>
          {beans.map(b=>(
            <div key={b.id} onClick={()=>{ onChange(b.name); onBeanSelect&&onBeanSelect(b); setOpen(false); }}
              style={{ padding:'10px 14px', borderBottom:'0.5px solid '+G.border,
                cursor:'pointer', background:b.name===value?'rgba(92,61,40,0.07)':'transparent',
                display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div>
                <div style={{ fontSize:12, color:G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>{b.name}</div>
                {(b.roaster || roastLabel(b.roastLevel)) && (
                  <div style={{ fontSize:9, color:G.label, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>
                    {[b.roaster, roastLabel(b.roastLevel)].filter(Boolean).join(' · ')}
                  </div>
                )}
              </div>
              {b.name===value && <span style={{ fontSize:9, color:P.cafe }}>✓</span>}
            </div>
          ))}
          <div onClick={()=>{ setCustomMode(true); setOpen(false); onChange(''); }}
            style={{ padding:'10px 14px', cursor:'pointer' }}>
            <span style={{ fontSize:11, color:P.cafe, fontFamily:'IBM Plex Mono, monospace' }}>+ enter new bean name</span>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Entry Detail ──────────────────────────────────────────────────────────────
function EntryDetail({ entry, onBack, onEdit, beans=[], onPinDialed, onBrewAgain, onStartTimer }) {
  const [pinned, setPinned] = useState(false);
  const [shared, setShared] = useState(false);
  const isBrew = entry.type === 'brew';
  const canPin = isBrew && onPinDialed && beans.some(b => b.name===entry.beanName);
  const shareRecipe = () => {
    if (shared) return;
    const payload = { beanName:entry.beanName||'', roaster:entry.roaster||'',
      method:entry.method||'', grinder:entry.grinder||'', machine:entry.machine||'' };
    getMethodSchema(entry.method).fields.forEach(([,key]) => { payload[key] = entry[key]||''; });
    queueShare('recipe', payload);
    setShared(true);
  };
  const title = isBrew ? (entry.beanName||'Unnamed Brew') : (entry.cafeName||'Unnamed Café');
  const dateStr = new Date(entry.date).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, overflow:'hidden', background:P.bg }}>
      <div style={{ padding:'10px 20px 12px', paddingTop:'calc(10px + env(safe-area-inset-top))',
        display:'flex', justifyContent:'space-between', alignItems:'center',
        borderBottom:'1px solid '+P.line, background:P.bg, flexShrink:0 }}>
        <div onClick={onBack} style={{ fontSize:13, color:P.headerMuted, cursor:'pointer', padding:'4px 0' }}>← Back</div>
        <div style={{ fontSize:15, fontWeight:600, color:P.headerText }}>
          {isBrew ? 'Home Brew' : 'Café Visit'}
        </div>
        <div onClick={onEdit} style={{ fontSize:13, color:P.acc, fontWeight:600, cursor:'pointer', padding:'4px 0' }}>Edit</div>
      </div>
      <div className="scroll-y" style={{ flex:1, padding:'16px' }}>
        <div style={{ marginBottom:16 }}>
          <div style={{ fontSize:24, fontWeight:500, color:P.headerText,
            fontFamily:'Hanken Grotesk, sans-serif', lineHeight:1.2 }}>{title}</div>
          {!isBrew && entry.location && <div style={{ fontSize:10, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, marginTop:4 }}>{entry.location}</div>}
          {isBrew && entry.roaster && <div style={{ fontSize:10, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, marginTop:4 }}>{entry.roaster}</div>}
          <div style={{ fontSize:9, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, marginTop:6 }}>
            {dateStr} · {formatTime(entry.date)}
          </div>
        </div>
        {!isBrew && (
          <>
            {(entry.drinkType||entry.bean||entry.price) && (<><FormDivider /><SectionHead label="The Coffee" /><div style={{height:6}}/><DetailRow label="Drink" value={entry.drinkType} /><DetailRow label="Bean / Roaster" value={entry.bean} /><DetailRow label="Price" value={entry.price} /></>)}
            {entry.tastingNotes?.length>0 && (<><FormDivider /><SectionHead label="Tasting" /><div style={{height:6}}/><div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:10}}>{entry.tastingNotes.map(n=><GhostChip key={n} label={n} active />)}</div></>)}
            {entry.ratings && Object.values(entry.ratings).some(v=>v>0) && (
              <div style={{marginBottom:10}}>
                {['Overall','Aroma','Taste','Texture'].filter(r=>entry.ratings[r.toLowerCase()]>0).map(r=>(
                  <div key={r} style={{display:'flex',alignItems:'center',gap:12,marginBottom:6}}>
                    <span style={{fontSize:10,color:G.label,fontFamily:'IBM Plex Mono, monospace',width:54,flexShrink:0}}>{r}</span>
                    <RatingSquares n={entry.ratings[r.toLowerCase()]} size={14} />
                  </div>
                ))}
              </div>
            )}
            {(entry.vibeTags?.length>0||entry.wouldVisitAgain) && (<><FormDivider /><SectionHead label="Vibe" /><div style={{height:6}}/>
              {entry.vibeTags?.length>0 && <div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:10}}>{entry.vibeTags.map(t=><GhostChip key={t} label={t} active />)}</div>}
              {entry.wouldVisitAgain && <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}><div style={{width:16,height:16,borderRadius:4,background:P.cafe,display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{fontSize:10,color:'#fff'}}>✓</span></div><span style={{fontSize:12,color:G.text,fontFamily:'IBM Plex Mono, monospace',fontWeight:300}}>Would visit again</span></div>}
            </>)}
          </>
        )}
        {isBrew && (
          <>
            <FormDivider />
            <div style={{marginBottom:10}}>
              <div style={{fontSize:9,color:G.label,fontFamily:'IBM Plex Mono, monospace',marginBottom:6,letterSpacing:'0.1em',textTransform:'uppercase'}}>Method</div>
              {entry.method && <div style={{display:'inline-block'}}><GhostChip label={entry.method} active /></div>}
            </div>
            {(() => {
              // Parameters shown are driven by the entry's method schema (falls
              // back to the generic set), so method-specific fields appear here.
              const rows = getMethodSchema(entry.method).fields
                .map(([lbl,key]) => [lbl, entry[key]]).filter(([,v]) => v);
              if (entry.grinder) rows.push(['Grinder', entry.grinder]);
              if (!rows.length) return null;
              return (
                <><FormDivider /><SectionHead label="Parameters" /><div style={{height:6}}/>
                  <div style={{ background:P.cardBg, border:'1px solid '+P.cardStroke, borderRadius:14,
                    padding:'4px 14px', marginBottom:10, display:'grid', gridTemplateColumns:'1fr 1fr',
                    columnGap:14 }}>
                    {rows.map(([l,v])=>(
                      <div key={l} style={{ padding:'9px 0', borderBottom:'0.5px solid '+P.line }}>
                        <FieldLabel style={{ marginBottom:3 }}>{l}</FieldLabel>
                        <div style={{ fontSize:14, color:P.headerText, fontWeight:500 }}>{v}</div>
                      </div>
                    ))}
                  </div>
                </>
              );
            })()}
            {entry.tastingNotes?.length>0 && (<><FormDivider /><SectionHead label="Tasting" /><div style={{height:6}}/><div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:10}}>{entry.tastingNotes.map(n=><GhostChip key={n} label={n} active />)}</div></>)}
            {entry.rating>0 && <div style={{marginBottom:10}}><div style={{fontSize:9,color:G.label,fontFamily:'IBM Plex Mono, monospace',marginBottom:6,letterSpacing:'0.1em',textTransform:'uppercase'}}>Rating</div><RatingSquares n={entry.rating} size={16} /></div>}
            <div style={{ display:'flex', gap:8, marginTop:6, marginBottom:10 }}>
              <div onClick={()=>onStartTimer && onStartTimer(entry)}
                style={{ flex:1, background:P.acc, borderRadius:11, padding:'10px', textAlign:'center', cursor:'pointer' }}>
                <span style={{ fontSize:11.5, fontWeight:600, color:'#fff' }}>▶ Brew with timer</span>
              </div>
              <div onClick={()=>onBrewAgain && onBrewAgain(entry)}
                style={{ flex:1, border:'1px solid '+P.acc, borderRadius:11, padding:'10px', textAlign:'center', cursor:'pointer' }}>
                <span style={{ fontSize:11.5, fontWeight:600, color:P.acc }}>↻ Log again</span>
              </div>
            </div>
            {canPin && (
              <div onClick={()=>{ if(!pinned){ onPinDialed(entry); setPinned(true); } }}
                style={{ marginBottom:10, padding:'11px', borderRadius:10, textAlign:'center',
                  cursor: pinned ? 'default' : 'pointer',
                  background: pinned ? 'rgba(92,61,40,0.10)' : 'transparent',
                  border:'1px solid '+(pinned ? P.brew : G.chipBorder) }}>
                <span style={{ fontSize:11, color: pinned ? P.brew : G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>
                  {pinned ? `✓ pinned as ${entry.method||'go-to'} recipe for ${entry.beanName}` : `★ pin as dialed-in ${entry.method||''} recipe`.replace('  ',' ')}
                </span>
              </div>
            )}
            {pinned && (
              <div onClick={shareRecipe}
                style={{ marginBottom:10, padding:'11px', borderRadius:10, textAlign:'center',
                  cursor: shared ? 'default' : 'pointer',
                  background: shared ? 'rgba(92,61,40,0.07)' : 'transparent',
                  border:'1px solid '+(shared ? P.cafe : G.chipBorder) }}>
                <span style={{ fontSize:11, color: shared ? P.cafe : G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>
                  {shared ? '✓ recipe queued for the community library' : 'share this recipe with the community →'}
                </span>
              </div>
            )}
          </>
        )}
        {(entry.notes||entry.whatIdChange||entry.recipe) && (
          <><FormDivider /><SectionHead label="Notes" /><div style={{height:6}}/>
            {entry.notes && <div style={{fontSize:12,color:G.text,fontFamily:'IBM Plex Mono, monospace',fontWeight:300,lineHeight:1.6,marginBottom:10}}>{entry.notes}</div>}
            <DetailRow label="What I'd Change" value={entry.whatIdChange} />
            <DetailRow label="Recipe / Steps" value={entry.recipe} />
          </>
        )}
        <div style={{height:32}} />
      </div>
    </div>
  );
}

// ── Bean Detail ───────────────────────────────────────────────────────────────

          {roastLabel(bean.roastLevel) && (
            <div style={{ padding:'5px 13px', borderRadius:20, fontSize:10,
              fontFamily:'IBM Plex Mono, monospace', fontWeight:300, letterSpacing:'0.02em',
              background: roastColor(bean.roastLevel)+'22',
              color: roastColor(bean.roastLevel),
              border:'1px solid '+roastColor(bean.roastLevel)+'66' }}>
              {roastLabel(bean.roastLevel)}
            </div>
          )}
        </div>
        {bean.roastLevel > 0 && (
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:9, color:G.label, fontFamily:'IBM Plex Mono, monospace', marginBottom:8, letterSpacing:'0.1em', textTransform:'uppercase' }}>Roast Level</div>
            <div style={{ display:'flex', gap:4, marginBottom:4 }}>
              {Array.from({length:10},(_,i)=>{
                const n = i+1;
                const c = n<=3?'#C8A66A':n<=7?'#8B5530':'#3D1A06';
                return <div key={n} style={{ flex:1, height:8, borderRadius:2,
                  background: bean.roastLevel>=n ? c : P.bgDeep }} />;
              })}
            </div>
            <div style={{ display:'flex', justifyContent:'space-between' }}>
              <span style={{ fontSize:7.5, color:G.label, fontFamily:'IBM Plex Mono, monospace' }}>Light</span>
              <span style={{ fontSize:9, color:roastColor(bean.roastLevel), fontFamily:'IBM Plex Mono, monospace' }}>{bean.roastLevel} / 10</span>
              <span style={{ fontSize:7.5, color:G.label, fontFamily:'IBM Plex Mono, monospace' }}>Dark</span>
            </div>
          </div>
        )}
        {bean.tastingNotes?.length>0 && (
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:9, color:G.label, fontFamily:'IBM Plex Mono, monospace', marginBottom:8, letterSpacing:'0.1em', textTransform:'uppercase' }}>Roaster's Notes</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
              {bean.tastingNotes.map(n=><GhostChip key={n} label={n} active />)}
            </div>
          </div>
        )}
        {bean.rating>0 && (
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:9, color:G.label, fontFamily:'IBM Plex Mono, monospace', marginBottom:6, letterSpacing:'0.1em', textTransform:'uppercase' }}>Rating</div>
            <RatingSquares n={bean.rating} size={18} />
          </div>
        )}
        {(() => {
          const dm = dialedMap(bean);
          if (!dm || !Object.keys(dm).length) return null;
          return (
            <>
              <FormDivider />
              {Object.entries(dm).map(([method, d]) => (
                <div key={method} style={{ background:'rgba(92,61,40,0.07)', border:'0.5px solid rgba(92,61,40,0.30)',
                  borderRadius:12, padding:'12px 13px', marginBottom:14 }}>
                  <div style={{ fontSize:8, color:P.brew, fontFamily:'IBM Plex Mono, monospace', letterSpacing:'0.1em', marginBottom:8 }}>★ DIALED IN · {method.toUpperCase()}</div>
                  <div style={{ display:'flex', flexWrap:'wrap', gap:'4px 14px', marginBottom:10 }}>
                    {[['Grind',d.grindSize],['Grinder',d.grinder],['Machine',d.machine],
                      ['Dose',d.dose],['Water',d.water],['Temp',d.temp],
                      ['Time',d.brewTime],['Ratio',d.ratio]].filter(([,v])=>v).map(([l,v])=>(
                      <div key={l}>
                        <span style={{ fontSize:7.5, color:G.label, fontFamily:'IBM Plex Mono, monospace', textTransform:'uppercase', letterSpacing:'0.08em' }}>{l} </span>
                        <span style={{ fontSize:11, color:G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>{v}</span>
                      </div>
                    ))}
                  </div>
                  <div onClick={()=>onBrewNow && onBrewNow({ ...d, method, beanName:bean.name, roaster:bean.roaster||'' })}
                    style={{ background:P.acc, borderRadius:11, padding:'10px', textAlign:'center', cursor:'pointer' }}>
                    <span style={{ fontSize:11.5, fontWeight:600, color:'#fff' }}>▶ Brew now</span>
                  </div>
                </div>
              ))}
            </>
          );
        })()}
        {commRecipes.length>0 && (
          <>
            <FormDivider />
            <div style={{ fontSize:9, color:G.label, fontFamily:'IBM Plex Mono, monospace', marginBottom:8, letterSpacing:'0.1em', textTransform:'uppercase' }}>Community Recipes</div>
            {commRecipes.map((r,i)=>(
              <div key={i} style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8 }}>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:10, color:G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>
                    {[r.method, r.grindSize && `grind ${r.grindSize}`, r.ratio, r.brewTime].filter(Boolean).join(' · ')}
                  </div>
                  {r.grinder && <div style={{ fontSize:8.5, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace', fontWeight:300, marginTop:1 }}>{r.grinder}</div>}
                </div>
                <div onClick={()=>onBrewNow && onBrewNow({ ...r, beanName:bean.name, roaster:bean.roaster||r.roaster||'' })}
                  style={{ border:'1px solid '+P.brew, borderRadius:8, padding:'5px 12px', cursor:'pointer', flexShrink:0 }}>
                  <span style={{ fontSize:9, color:P.brew, fontFamily:'IBM Plex Mono, monospace' }}>▶ brew</span>
                </div>
              </div>
            ))}
          </>
        )}
        {attempts.length>0 && (
          <>
            <FormDivider />
            <div style={{ fontSize:9, color:G.label, fontFamily:'IBM Plex Mono, monospace', marginBottom:8, letterSpacing:'0.1em', textTransform:'uppercase' }}>Recent Brews</div>
            {attempts.slice(0,3).map(a=>(
              <div key={a.id} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
                <span style={{ fontSize:10, color:G.text, fontFamily:'IBM Plex Mono, monospace', fontWeight:300 }}>
                  {[a.method, a.grindSize && `grind ${a.grindSize}`, a.brewTime].filter(Boolean).join(' · ') || '—'}
                </span>
                <span style={{ display:'flex', alignItems:'center', gap:8 }}>
                  {a.rating>0 && <RatingDots n={a.rating} />}
                  <span style={{ fontSize:9, color:P.headerMuted, fontFamily:'IBM Plex Mono, monospace' }}>{formatDate(a.date)}</span>
                </span>
              </div>
            ))}
            <div style={{ height:6 }} />
          </>
        )}
        <FormDivider />
        <DetailRow label="Times Brewed" value={`${bean.brews} brew${bean.brews!==1?'s':''}`} />
        <div style={{ height:32 }} />
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [entries,     setEntries]     = useLS('coffee_entries',  []);
  const [beans,       setBeans]       = useLS('coffee_beans',    []);
  const [customNotes, setCustomNotes] = useLS('custom_notes',     []);
  const [customDrinks,setCustomDrinks]= useLS('custom_drinks',    []);
  const [customProcesses,setCustomProcesses]= useLS('custom_processes', []);
  const [gear,        setGear]        = useLS('coffee_gear',     []);
  const [pendingDeletes, setPendingDeletes] = useLS('sync_deletes', []); // "kind:id" tombstones to push
  const [timerMode, setTimerMode] = useLS('timer_mode', 'staged'); // 'staged' | 'checklist' — device-local brew-timer preference
  const removeGear = id => { setGear(gear.filter(g => g.id!==id)); setPendingDeletes(p => [...new Set([...p, 'gear:'+id])]); };
  const community = useCommunity();
  useEffect(() => { flushShareQueue(); }, []);

  const [session, setSession] = useState(null);
  useEffect(() => {
    if (!SB) return;
    SB.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = SB.auth.onAuthStateChange((_evt, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  // ── Cloud sync orchestration ──
  const [syncState, setSyncState]   = useState('idle'); // idle | syncing | error
  const [lastSyncAt, setLastSyncAt] = useState(null);
  const syncBusyRef  = useRef(false);
  const syncAgainRef = useRef(false);
  const syncTimerRef = useRef(null);
  const stateRef = useRef({});
  stateRef.current = { entries, beans, gear, customNotes, customDrinks, customProcesses, pendingDeletes, session };

  const doSync = useCallback(async () => {
    const s = stateRef.current.session;
    if (!SB || !s) return;
    if (syncBusyRef.current) { syncAgainRef.current = true; return; }
    syncBusyRef.current = true;
    setSyncState('syncing');
    try {
      const uid = s.user.id;
      const shadowKey = 'sync_shadow2_'+uid;   // v2 key: ignores the old poisoned shadows
      // Account switch on this device: the working localStorage may belong to the
      // previous account, so force a clean first-sync (merge/discard prompt) rather
      // than diffing a stale shadow against foreign data.
      const switched = !!localStorage.getItem('sync_uid') && localStorage.getItem('sync_uid') !== uid;
      let shadow = null;
      try { shadow = JSON.parse(localStorage.getItem(shadowKey)); } catch {}
      if (switched) shadow = null;
      const firstSync = !shadow;
      let cols = { entries: stateRef.current.entries, beans: stateRef.current.beans,
        gear: stateRef.current.gear, customNotes: stateRef.current.customNotes,
        customDrinks: stateRef.current.customDrinks, customProcesses: stateRef.current.customProcesses };

      const all = await syncPullAll();   // full state, every sync

      if (firstSync) {
        // First sync for this account on this device (or right after an account switch)
        const remoteCols = syncApplyRemote(all, new Set(),
          { entries:[], beans:[], gear:[], customNotes:[], customDrinks:[], customProcesses:[] }).cols;
        const remoteLive = all.filter(r => !r.deleted && r.kind !== 'setting');
        const localCount = cols.entries.length + cols.beans.length + cols.gear.length;
        let discard = false;
        if (localCount > 0 && remoteLive.length > 0) {
          discard = !window.confirm(
            'This device has '+localCount+' local item(s) and your account already has cloud data.\n\n'+
            'OK = merge local items into your account\n'+
            'Cancel = discard local items and load your account data');
        }
        // Shadow starts as the remote state, so local extras become pending pushes
        shadow = syncSnapshot(remoteCols);
        if (discard) {
          // Take the cloud state wholesale — nothing local survives, nothing is pushed
          cols = remoteCols;
        } else {
          const pending = new Set(syncDiff(shadow, syncSnapshot(cols)).map(r => r.kind+':'+r.id));
          cols = syncApplyRemote(all, pending, cols).cols;
        }
        // Deletions queued in a prior context don't apply to this account
        if (stateRef.current.pendingDeletes.length) setPendingDeletes([]);
      } else {
        const pending = new Set(syncDiff(shadow, syncSnapshot(cols)).map(r => r.kind+':'+r.id));
        cols = syncApplyRemote(all, pending, cols).cols;
      }

      // Push local upserts since the shadow, plus explicit deletions (established
      // account only). syncDiff never infers deletes, so a mismatch can't wipe data.
      const snap = syncSnapshot(cols);
      const changes = syncDiff(shadow, snap);
      const nowIso = new Date().toISOString();
      const tombstones = firstSync ? [] : stateRef.current.pendingDeletes.map(key => {
        const [kind, id] = syncSplitKey(key);
        return { id, kind, payload:{}, updated_at: nowIso, deleted: true };
      });
      const push = [...changes, ...tombstones];
      for (let i = 0; i < push.length; i += 200) {
        const { error } = await SB.from('user_data')
          .upsert(push.slice(i, i+200), { onConflict: 'user_id,id' });
        if (error) throw error;
      }
      if (!firstSync && stateRef.current.pendingDeletes.length) setPendingDeletes([]);

      // Commit: shadow, active account marker, and any merged-in remote data
      localStorage.setItem(shadowKey, JSON.stringify(snap));
      localStorage.setItem('sync_uid', uid);
      const cur = stateRef.current;
      if (JSON.stringify(cols.entries)      !== JSON.stringify(cur.entries))      setEntries(cols.entries);
      if (JSON.stringify(cols.beans)        !== JSON.stringify(cur.beans))        setBeans(cols.beans);
      if (JSON.stringify(cols.gear)         !== JSON.stringify(cur.gear))         setGear(cols.gear);
      if (JSON.stringify(cols.customNotes)     !== JSON.stringify(cur.customNotes))     setCustomNotes(cols.customNotes);
      if (JSON.stringify(cols.customDrinks)    !== JSON.stringify(cur.customDrinks))    setCustomDrinks(cols.customDrinks);
      if (JSON.stringify(cols.customProcesses) !== JSON.stringify(cur.customProcesses)) setCustomProcesses(cols.customProcesses);
      setSyncState('idle');
      setLastSyncAt(new Date());
    } catch (e) {
      console.warn('[sync] failed', e);
      setSyncState('error');
    } finally {
      syncBusyRef.current = false;
      if (syncAgainRef.current) { syncAgainRef.current = false; doSync(); }
    }
  }, []);

  // Sync on sign-in (and when the signed-in user changes)
  useEffect(() => {
    if (!session) { setSyncState('idle'); return; }
    doSync();
  }, [session?.user?.id]);

  // Debounced sync after local changes
  useEffect(() => {
    if (!session) return;
    clearTimeout(syncTimerRef.current);
    syncTimerRef.current = setTimeout(doSync, 3500);
    return () => clearTimeout(syncTimerRef.current);
  }, [entries, beans, gear, customNotes, customDrinks, customProcesses, pendingDeletes]);
  const gearCatalog = [...GEAR_CATALOG, ...community.gear.filter(g =>
    g && g.n && !GEAR_CATALOG.some(c => c.n.toLowerCase()===g.n.toLowerCase()))];
  const [view,    setView]          = useState('home');
  const [showSheet, setSheet]       = useState(false);
  const [formInit,  setInit]        = useState({});
  const [selectedEntry, setSelEntry]= useState(null);
  const [selectedBean,  setSelBean] = useState(null);
  const [timerRecipe,   setTimerRecipe] = useState(null);

  const goTab = t => { setSheet(false); setView(['home','beans',null,'stats','profile'][t]); };

  const saveEntry = entry => { setEntries([entry,...entries]); setSheet(false); setView('home'); };

  const updateEntry = entry => {
    setEntries(prev => prev.map(e => e.id===entry.id ? entry : e));
    setSelEntry(entry);
    setView('entry-detail');
  };

  const updateBean = bean => {
    setBeans(prev => prev.map(b => b.id===bean.id ? bean : b));
    setSelBean(bean);
    setView('bean-detail');
  };

  const expand = (type, partial) => { setInit(partial); setSheet(false); setView(type==='cafe'?'cafe-form':'brew-form'); };

  const brewAgain  = src => saveEntry({ ...src, id:genId(), date:new Date().toISOString() });

  // ── Manual backup: download / restore a JSON of everything ──
  const exportData = () => {
    const data = { app:'coffee-diary', version:1, exportedAt:new Date().toISOString(),
      entries, beans, gear, customNotes, customDrinks };
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type:'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'coffee-diary-backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };
  const importData = file => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        const mergeById = (cur, inc) => { const m = new Map(cur.map(x=>[x.id,x]));
          (inc||[]).forEach(x=>{ if (x && x.id) m.set(x.id, x); }); return [...m.values()]; };
        if (Array.isArray(d.entries)) setEntries(mergeById(entries, d.entries).sort((a,b)=>(b.date||'').localeCompare(a.date||'')));
        if (Array.isArray(d.beans))   setBeans(mergeById(beans, d.beans));
        if (Array.isArray(d.gear))    setGear(mergeById(gear, d.gear));
        if (Array.isArray(d.customNotes))  setCustomNotes([...new Set([...customNotes, ...d.customNotes])]);
        if (Array.isArray(d.customDrinks)) setCustomDrinks([...new Set([...customDrinks, ...d.customDrinks])]);
        window.alert('Import complete — your items were merged in.');
      } catch { window.alert("Could not read that file — make sure it's a Coffee Diary backup."); }
    };
    reader.readAsText(file);
  };
  const startTimer = r => { setTimerRecipe(r); setView('brew-timer'); };
  const pinDialed  = entry => setBeans(prev => prev.map(b => {
    if (b.name !== entry.beanName) return b;
    const snap = { method:entry.method||'', grinder:entry.grinder||'', machine:entry.machine||'', recipe:entry.recipe||'' };
    getMethodSchema(entry.method).fields.forEach(([,key]) => { snap[key] = entry[key]||''; });
    return { ...b, dialed:undefined,
      dialedByMethod:{ ...(dialedMap(b)||{}), [entry.method||'Brew']: snap } };
  }));

  const sp = { onTab:goTab, onAdd:()=>setSheet(true) };

  return (
    <div style={{ width:'100%', height:'100%', display:'flex', flexDirection:'column', overflow:'hidden', background:P.bg }}>
      {view==='home'         && <HomeScreen    entries={entries} {...sp} onEntryPress={e=>{ setSelEntry(e); setView('entry-detail'); }} onLogCafe={p=>{ setInit(p); setView('cafe-form'); }} onBrewAgain={brewAgain} onStartTimer={startTimer} />}
      {view==='beans'        && <BeanLibrary   beans={beans} {...sp} onAddBean={()=>setView('add-bean')} onBeanPress={b=>{ setSelBean(b); setView('bean-detail'); }} />}
      {view==='stats'        && <StatsDash     entries={entries} {...sp} />}
      {view==='profile'      && <ProfileScreen entries={entries} beans={beans} {...sp} gear={gear} onGearChange={setGear} onGearRemove={removeGear} gearCatalog={gearCatalog} session={session} syncState={syncState} lastSyncAt={lastSyncAt} onSync={doSync} onExport={exportData} onImport={importData} timerMode={timerMode} onTimerModeChange={setTimerMode} />}
      {view==='entry-detail' && selectedEntry && <EntryDetail entry={selectedEntry} onBack={()=>setView('home')} onEdit={()=>{ setInit(selectedEntry); setView(selectedEntry.type==='cafe'?'cafe-form-edit':'brew-form-edit'); }} beans={beans} onPinDialed={pinDialed} onBrewAgain={brewAgain} onStartTimer={startTimer} />}
      {view==='bean-detail'  && selectedBean  && <BeanDetail  bean={selectedBean}  onBack={()=>setView('beans')} onEdit={()=>{ setInit(selectedBean); setView('bean-form-edit'); }} entries={entries} onBrewNow={startTimer} communityRecipes={community.recipes} />}
      {view==='brew-timer'   && timerRecipe   && <TimerScreen recipe={timerRecipe} onCancel={()=>setView('home')} onLog={saveEntry} mode={timerMode} />}
      {view==='cafe-form'    && <CafeForm  initial={formInit} onBack={()=>setView('home')}         onSave={saveEntry}   customNotes={customNotes} onAddNote={setCustomNotes} customDrinks={customDrinks} onAddDrink={setCustomDrinks} />}
      {view==='brew-form'    && <BrewForm  initial={formInit} onBack={()=>setView('home')}         onSave={saveEntry}   beans={beans} entries={entries} gear={gear} customNotes={customNotes} onAddNote={setCustomNotes} />}
      {view==='cafe-form-edit'&& <CafeForm initial={formInit} onBack={()=>setView('entry-detail')} onUpdate={updateEntry} customNotes={customNotes} onAddNote={setCustomNotes} customDrinks={customDrinks} onAddDrink={setCustomDrinks} />}
      {view==='brew-form-edit'&& <BrewForm initial={formInit} onBack={()=>setView('entry-detail')} onUpdate={updateEntry} beans={beans} entries={entries} gear={gear} customNotes={customNotes} onAddNote={setCustomNotes} />}
      {view==='add-bean'     && <AddBeanForm onBack={()=>setView('beans')} onSave={b=>{ setBeans([b,...beans]); setView('beans'); }} communityBeans={community.beans} vocab={community.vocab} customNotes={customNotes} onAddNote={setCustomNotes} customProcesses={customProcesses} onAddProcess={setCustomProcesses} session={session} />}
      {view==='bean-form-edit'&& <AddBeanForm initial={formInit} onBack={()=>setView('bean-detail')} onUpdate={updateBean} vocab={community.vocab} customNotes={customNotes} onAddNote={setCustomNotes} customProcesses={customProcesses} onAddProcess={setCustomProcesses} />}
      {showSheet && <QuickCaptureSheet onClose={()=>setSheet(false)} onSave={saveEntry} onExpand={expand} beans={beans} gear={gear} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
  }
</script>
</body>
