// ── Utils ─────────────────────────────────────────────────────────────────────
function genId() { return Math.random().toString(36).slice(2,10); }

function formatDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function formatTime(iso) {
  return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();
}
function groupByDate(entries) {
  const map = {};
  entries.forEach(e => {
    const day = e.date.slice(0,10);
    if (!map[day]) map[day] = [];
    map[day].push(e);
  });
  return Object.entries(map)
    .sort(([a],[b]) => b.localeCompare(a))
    .map(([day, items]) => ({
      label: formatDate(day + 'T12:00:00'),
      entries: items.sort((a,b) => b.date.localeCompare(a.date))
    }));
}
function getMonthName() {
  return new Date().toLocaleDateString('en-US', { month: 'long' });
}
function getMonthCount(entries) {
  const n = new Date();
  return entries.filter(e => {
    const d = new Date(e.date);
    return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
  }).length;
}

function roastLabel(n) {
  if (!n || n < 1) return null;
  return n <= 3 ? 'Light' : n <= 7 ? 'Medium' : 'Dark';
}
function roastColor(n) {
  if (!n || n < 1) return null;
  return n <= 3 ? '#C8A66A' : n <= 7 ? '#8B5530' : '#3D1A06';
}

// Dialed-in recipes are stored per bean+method in bean.dialedByMethod.
// Older data may have a single bean.dialed snapshot — normalize both shapes.
function dialedMap(bean) {
  if (!bean) return null;
  if (bean.dialedByMethod) return bean.dialedByMethod;
  if (bean.dialed) return { [bean.dialed.method || 'Brew']: bean.dialed };
  return null;
}

// ── Brew timer utilities ──────────────────────────────────────────────────────
function fmtSec(s) {
  const m = Math.floor(s/60), ss = Math.floor(s%60);
  return `${m}:${String(ss).padStart(2,'0')}`;
}
function parseTimeStr(t) {
  if (!t) return 0;
  const m = String(t).match(/(\d+)\s*[:.]\s*(\d{1,2})/);
  if (m) return (+m[1])*60 + (+m[2]);
  const n = parseFloat(t);
  if (isNaN(n)) return 0;
  return n < 10 ? Math.round(n*60) : Math.round(n);
}
function buildSteps(r) {
  const dose  = parseFloat(r.dose)  || 0;
  const water = parseFloat(r.water) || 0;
  const total = parseTimeStr(r.brewTime) || 180;
  const method = (r.method||'').toLowerCase();
  if (method.includes('espresso')) {
    return [{ at:0, label: water ? `Pull shot — target ${water}g out` : 'Pull shot' }];
  }
  if (method.includes('press')) {
    return [
      { at:0, label: water ? `Pour ${water}g, stir gently` : 'Pour water, stir gently' },
      { at:Math.max(total-30,60), label:'Break the crust, skim' },
      { at:total, label:'Plunge & serve' },
    ];
  }
  if (!water) return [{ at:0, label:'Start brewing' }];
  const bloom = dose ? Math.round(dose*2) : Math.round(water*0.15);
  const mid = Math.round(water*0.6);
  return [
    { at:0, label:`Bloom — pour ${bloom}g` },
    { at:45, label:`First pour — up to ${mid}g` },
    { at:Math.round(total*0.55), label:`Final pour — up to ${water}g` },
    { at:total, label:'Draw down' },
  ];
}

// ── Geo / map utilities ───────────────────────────────────────────────────────
function haversineM(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const f1 = lat1*Math.PI/180, f2 = lat2*Math.PI/180;
  const df = (lat2-lat1)*Math.PI/180, dl = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(df/2)**2 + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function loadLeaflet() {
  return new Promise(resolve => {
    if (window.L) { resolve(); return; }
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const style = document.createElement('style');
    style.textContent = [
      '.leaflet-container{background:#0F1C29}',
      '.leaflet-tile-pane{filter:hue-rotate(185deg) saturate(0.55) brightness(0.82)}',
      '.leaflet-control-attribution{background:rgba(15,28,41,0.85)!important;color:#7A94A8!important;font-size:7px!important;padding:2px 6px!important;border-radius:4px 0 0 0!important}',
      '.leaflet-control-attribution a{color:#D4976A!important}',
    ].join('');
    document.head.appendChild(style);
    const js = document.createElement('script');
    js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.onload = resolve;
    document.head.appendChild(js);
  });
}

async function fetchNearbyCafes(lat, lon) {
  const q = `[out:json][timeout:15];(
    node["amenity"="cafe"](around:1200,${lat},${lon});
    node["amenity"="coffee_shop"](around:1200,${lat},${lon});
    node["shop"="coffee"](around:1200,${lat},${lon});
    node["amenity"="restaurant"]["cuisine"="coffee_shop"](around:1200,${lat},${lon});
    node["amenity"="bakery"]["coffee"="yes"](around:1200,${lat},${lon});
  );out body 60;`;
  try {
    const r = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST', body: 'data=' + encodeURIComponent(q),
      signal: AbortSignal.timeout(15000)
    });
    if (!r.ok) return [];
    return (await r.json()).elements || [];
  } catch { return []; }
}

// ── localStorage hook ─────────────────────────────────────────────────────────
function useLS(key, init) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; }
    catch { return init; }
  });
  const set = useCallback(v => {
    setVal(prev => {
      const next = typeof v === 'function' ? v(prev) : v;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      return next;
    });
  }, [key]);
  return [val, set];
}

// ── Community library ─────────────────────────────────────────────────────────
// The app reads reviewed catalog data from community/*.json (deployed with the
// site) and queues opt-in user submissions locally. Phase B: fill in url/key
// (Supabase project URL + anon key) to sync the queue to the inbox database.
const COMMUNITY_SUBMIT = { url:'https://wedwlbtuzsgzxhzrefox.supabase.co', key:'sb_publishable_vQ3IcT4tz7I9eHY7zaKZKw_KQVrcOmZ' };

// Supabase client (auth + future personal-data sync). The publishable key is
// safe to embed; per-user data access is enforced by RLS with the session JWT.
const SB = (window.supabase && COMMUNITY_SUBMIT.url && COMMUNITY_SUBMIT.key)
  ? window.supabase.createClient(COMMUNITY_SUBMIT.url, COMMUNITY_SUBMIT.key)
  : null;

function queueShare(type, payload) {
  try {
    const q = JSON.parse(localStorage.getItem('share_queue')||'[]');
    q.push({ id:genId(), type, payload, at:new Date().toISOString() });
    localStorage.setItem('share_queue', JSON.stringify(q));
  } catch {}
}

async function flushShareQueue() {
  if (!COMMUNITY_SUBMIT.url || !COMMUNITY_SUBMIT.key) return;
  let q = [];
  try { q = JSON.parse(localStorage.getItem('share_queue')||'[]'); } catch {}
  if (!q.length) return;
  try {
    const r = await fetch(COMMUNITY_SUBMIT.url + '/rest/v1/submissions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:COMMUNITY_SUBMIT.key,
        Authorization:'Bearer '+COMMUNITY_SUBMIT.key, Prefer:'return=minimal' },
      body: JSON.stringify(q.map(s => ({ type:s.type, payload:s.payload, client_at:s.at })))
    });
    if (r.ok) { localStorage.setItem('share_queue', '[]'); }
    else { const body = await r.text().catch(()=>'') ; console.warn('[community] submit failed', r.status, body); }
  } catch (e) { console.warn('[community] submit error', e); }
}

function useCommunity() {
  const [lib, setLib] = useState(() => {
    try { return JSON.parse(localStorage.getItem('community_cache')) || { beans:[], gear:[], recipes:[] }; }
    catch { return { beans:[], gear:[], recipes:[] }; }
  });
  useEffect(() => {
    let live = true;
    Promise.all(['beans','gear','recipes'].map(k =>
      fetch('community/'+k+'.json', { cache:'no-cache' })
        .then(r => r.ok ? r.json() : null).catch(() => null)
    )).then(([b,g,r]) => {
      if (!live) return;
      setLib(prev => {
        const next = {
          beans:   Array.isArray(b?.items) ? b.items : prev.beans,
          gear:    Array.isArray(g?.items) ? g.items : prev.gear,
          recipes: Array.isArray(r?.items) ? r.items : prev.recipes,
        };
        try { localStorage.setItem('community_cache', JSON.stringify(next)); } catch {}
        return next;
      });
    });
    return () => { live = false; };
  }, []);
  return lib;
}

// ── Cloud sync engine ─────────────────────────────────────────────────────────
// Local-first: localStorage stays the working store; the cloud is a replica.
// Each sync diffs current state against a per-user "shadow" of the last synced
// state, pushes changed rows to user_data, and pulls remote changes. Records
// merge as a union across devices; for the same record edited in two places,
// last write wins — and this device's unsynced edits win over remote ones.
function syncSplitKey(k) { const i = k.indexOf(':'); return [k.slice(0,i), k.slice(i+1)]; }

function syncSnapshot(cols) {
  const m = {};
  cols.entries.forEach(e => { if (e && e.id) m['entry:'+e.id] = JSON.stringify(e); });
  cols.beans.forEach(b =>   { if (b && b.id) m['bean:'+b.id]  = JSON.stringify(b); });
  cols.gear.forEach(g =>    { if (g && g.id) m['gear:'+g.id]  = JSON.stringify(g); });
  m['setting:custom_notes']  = JSON.stringify(cols.customNotes);
  m['setting:custom_drinks'] = JSON.stringify(cols.customDrinks);
  return m;
}

function syncDiff(shadow, snap) {
  const rows = [], now = new Date().toISOString();
  for (const k in snap) if (shadow[k] !== snap[k]) {
    const [kind, id] = syncSplitKey(k);
    rows.push({ id, kind, payload: JSON.parse(snap[k]), updated_at: now, deleted: false });
  }
  for (const k in shadow) if (!(k in snap)) {
    const [kind, id] = syncSplitKey(k);
    rows.push({ id, kind, payload: {}, updated_at: now, deleted: true });
  }
  return rows;
}

function syncApplyRemote(rows, pendingKeys, cols) {
  let changed = false;
  const maps = {
    entry: new Map(cols.entries.map(e => [e.id, e])),
    bean:  new Map(cols.beans.map(b => [b.id, b])),
    gear:  new Map(cols.gear.map(g => [g.id, g])),
  };
  let notes = cols.customNotes, drinks = cols.customDrinks;
  rows.forEach(r => {
    if (pendingKeys.has(r.kind+':'+r.id)) return;   // this device's unsynced edit wins
    if (r.kind === 'setting') {
      const arr = Array.isArray(r.payload) ? r.payload : [];
      if (r.id === 'custom_notes') {
        const u = [...new Set([...notes, ...arr])];
        if (u.length !== notes.length) { notes = u; changed = true; }
      } else if (r.id === 'custom_drinks') {
        const u = [...new Set([...drinks, ...arr])];
        if (u.length !== drinks.length) { drinks = u; changed = true; }
      }
      return;
    }
    const map = maps[r.kind];
    if (!map) return;
    if (r.deleted) { if (map.delete(r.id)) changed = true; return; }
    const cur = map.get(r.id);
    if (!cur || JSON.stringify(cur) !== JSON.stringify(r.payload)) { map.set(r.id, r.payload); changed = true; }
  });
  const entries = [...maps.entry.values()].sort((a,b) => (b.date||'').localeCompare(a.date||''));
  return { changed, cols: { entries, beans:[...maps.bean.values()], gear:[...maps.gear.values()],
    customNotes: notes, customDrinks: drinks } };
}

async function syncPullAll(since) {
  const out = [], seen = new Set();
  let cursor = since;
  for (let page = 0; page < 20; page++) {
    const { data, error } = await SB.from('user_data')
      .select('id,kind,payload,updated_at,deleted')
      .gte('updated_at', cursor)
      .order('updated_at', { ascending: true })
      .limit(1000);
    if (error) throw error;
    data.forEach(r => {
      const k = r.kind + ':' + r.id + ':' + r.updated_at;
      if (!seen.has(k)) { seen.add(k); out.push(r); }
    });
    if (data.length < 1000) break;
    cursor = data[data.length - 1].updated_at;
  }
  return out;
}

// ── Shared primitives ────────────────────────────────────────────────────────

function RatingSquares({ n=0, size=18, onChange }) {
  return (
    <div style={{ display:'flex', gap:5 }}>
      {[1,2,3,4,5].map(i => (
        <div key={i} onClick={() => onChange && onChange(i===n ? 0 : i)}
          style={{ width:size, height:size, borderRadius:4,
            background: i<=n ? P.cafe : G.surface,
            border:'0.5px solid '+(i<=n ? P.cafe : G.chipBorder),
            cursor: onChange ? 'pointer' : 'default', transition:'background 0.15s' }} />
      ))}
    </div>
  );
}

function RatingDots({ n=0, max=5 }) {
  return (
    <div style={{ display:'flex', gap:3 }}>
      {Array.from({length:max},(_,i) => (
        <div key={i} style={{ width:6, height:6, borderRadius:'50%',
          background: i<n ? P.cafe : P.headerMuted, opacity: i<n ? 1 : 0.35 }} />
      ))}
    </div>
  );
}

function GhostChip({ label, active, onPress }) {
  return (
    <div onClick={onPress} style={{ padding:'5px 13px', borderRadius:20, fontSize:10,
      cursor:'pointer', fontFamily:'DM Mono, monospace', fontWeight:300,
      letterSpacing:'0.02em', whiteSpace:'nowrap',
      background: active ? P.cafe : 'transparent',
      color: active ? '#f0e4cc' : G.text,
      border:'1px solid '+(active ? P.cafe : G.chipBorder),
      transition:'all 0.15s' }}>
      {label}
    </div>
  );
}

function ChipAdder({ label, presets, custom=[], onCustomChange, selected=[], onToggle }) {
  const [adding, setAdding] = useState(false);
  const [inp, setInp] = useState('');
  const all = [...presets, ...custom];
  const commit = () => {
    const v = inp.trim();
    if (v && !all.some(n=>n.toLowerCase()===v.toLowerCase())) onCustomChange([...custom, v]);
    setInp(''); setAdding(false);
  };
  return (
    <div style={{ marginBottom:14 }}>
      <div style={{ fontSize:9, color:G.label, fontFamily:'DM Mono, monospace', marginBottom:8, letterSpacing:'0.1em', textTransform:'uppercase' }}>{label}</div>
      <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
        {all.map(n=><GhostChip key={n} label={n} active={selected.includes(n)} onPress={()=>onToggle(n)} />)}
        {adding
          ? <div style={{ display:'flex', alignItems:'center', gap:4 }}>
              <input autoFocus value={inp} onChange={e=>setInp(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter') commit(); if(e.key==='Escape'){setInp('');setAdding(false);} }}
                style={{ fontSize:10, color:G.text, background:G.surface, border:'1px solid '+P.cafe,
                  borderRadius:20, padding:'4px 10px', width:90, fontFamily:'DM Mono, monospace', fontWeight:300 }} />
              <span onClick={commit} style={{ fontSize:11, color:P.cafe, cursor:'pointer', fontFamily:'DM Mono, monospace' }}>✓</span>
              <span onClick={()=>{setInp('');setAdding(false);}} style={{ fontSize:11, color:G.label, cursor:'pointer', fontFamily:'DM Mono, monospace' }}>✕</span>
            </div>
          : <GhostChip label="+ add" onPress={()=>setAdding(true)} />
        }
      </div>
    </div>
  );
}

function GhostField({ label, placeholder, value, onChange, multiline, height=42 }) {

    <div style={{ marginBottom:12 }}>
      {label && <div style={{ fontSize:8.5, color:G.label, fontFamily:'DM Mono, monospace',

      <div style={{ height:multiline?undefined:height, minHeight:multiline?60:undefined,

        display:'flex', alignItems:multiline?'flex-start':'center',
        padding:multiline?'11px 14px':'0 14px' }}>

          : <input type="text" placeholder={placeholder} value={value||''}
              onChange={e => onChange && onChange(e.target.value)}
              style={{ color:G.text, fontSize:12 }} />
        }
      </div>
    </div>
  );
}

function TabBar({ active, onTab, onAdd }) {
  const tabs = [{label:'HOME',i:0},{label:'BEANS',i:1},null,{label:'STATS',i:3},{label:'PROFILE',i:4}];
  return (
    <div style={{ height:58, background:P.bg, borderTop:'0.5px solid '+P.darkStroke,
      display:'flex', alignItems:'center', flexShrink:0, padding:'0 8px',
      paddingBottom:'env(safe-area-inset-bottom)' }}>
      {tabs.map((tab,i) => {
        if (!tab) return (
          <div key={i} style={{ flex:1, display:'flex', justifyContent:'center' }}>
            <div onClick={onAdd} style={{ width:46, height:46, borderRadius:'50%', background:P.cafe,
              boxShadow:'0 4px 14px rgba(212,151,106,0.35)',
              display:'flex', alignItems:'center', justifyContent:'center',

              <div style={{ fontSize:24, color:'#182635', lineHeight:1, fontWeight:300, marginTop:-2 }}>+</div>
            </div>
          </div>
        );
        const on = tab.i === active;
        return (
          <div key={i} onClick={() => onTab(tab.i)} style={{ flex:1, display:'flex',
            flexDirection:'column', alignItems:'center', justifyContent:'center',
            gap:4, paddingTop:4, cursor:'pointer' }}>
            <div style={{ width:6, height:6, borderRadius:'50%',
              background: on ? P.cafe : P.headerMuted, opacity: on?1:0.4 }} />
            <span style={{ fontSize:8, color: on?P.cafe:P.headerMuted,
              fontFamily:'DM Mono, monospace', letterSpacing:'0.06em',
              textTransform:'uppercase', fontWeight: on?400:300 }}>{tab.label}</span>
          </div>
        );
      })}
    </div>
  );
}

function MiniCalendar({ entries, onClose, onDaySelect, selectedDay }) {
  const now = new Date();
  const yr = now.getFullYear(), mo = now.getMonth();
  const pad = n => String(n).padStart(2,'0');
  const loggedDays = new Set(
    entries.filter(e => { const d=new Date(e.date); return d.getMonth()===mo && d.getFullYear()===yr; })
           .map(e => new Date(e.date).getDate())
  );
  const firstDay = new Date(yr,mo,1).getDay();
  const daysInMonth = new Date(yr,mo+1,0).getDate();
  const today = now.getDate();
  const offset = (firstDay+6)%7;
  const cells = [...Array(offset).fill(null), ...Array.from({length:daysInMonth},(_,i)=>i+1)];
  while (cells.length%7) cells.push(null);
  const weeks = Array.from({length:cells.length/7},(_,i)=>cells.slice(i*7,i*7+7));
  const monthLabel = now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const selDate = selectedDay ? new Date(selectedDay+'T12:00:00').getDate() : null;
  return (
    <div style={{ background:P.cardBg2, border:'0.5px solid '+P.cardStroke,
      borderRadius:14, padding:'10px 12px', marginBottom:8 }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
        <span style={{ fontSize:11, fontWeight:600, color:P.cardDark, fontFamily:'Cormorant Garamond, serif' }}>{monthLabel}</span>
        <span onClick={onClose} style={{ fontSize:9, color:P.cafe, cursor:'pointer', fontWeight:600 }}>Done</span>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:1, marginBottom:3 }}>
        {['M','T','W','T','F','S','S'].map((d,i)=>(
          <div key={i} style={{ textAlign:'center', fontSize:7, color:P.cardMuted, paddingBottom:2 }}>{d}</div>
        ))}
      </div>
      {weeks.map((week,wi)=>(
        <div key={wi} style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:1, marginBottom:1 }}>
          {week.map((d,di)=>{
            const dayKey = d ? `${yr}-${pad(mo+1)}-${pad(d)}` : null;
            const isSelected = d && selDate===d;
            const isToday = d===today;
            const hasEntry = d && loggedDays.has(d);
            return (
              <div key={di} onClick={()=> d && onDaySelect && onDaySelect(dayKey)}
                style={{ height:26, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', cursor: d?'pointer':'default' }}>
                {d && (
                  <>
                    <div style={{ width:20, height:20, borderRadius:'50%',
                      background: isSelected ? P.cafe : isToday ? P.cafe+'55' : 'transparent',
                      display:'flex', alignItems:'center', justifyContent:'center' }}>
                      <span style={{ fontSize:8, color: isSelected?'#fff':P.cardDark,
                        fontWeight: hasEntry?600:400 }}>{d}</span>
                    </div>
                    <div style={{ width:4, height:4, borderRadius:'50%', marginTop:1,
                      background: hasEntry ? P.brew : 'transparent' }} />
                  </>
                )}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// ── Map View ─────────────────────────────────────────────────────────────────
function MapView({ entries, onLogCafe }) {
  const containerRef  = useRef(null);
  const mapRef        = useRef(null);
  const nearbyLgRef   = useRef(null);
  const visitedLgRef  = useRef(null);
  const userPosRef    = useRef(null);
  const timerRef      = useRef(null);

  const [layer,   setLayer]   = useState('nearby');
  const [loading, setLoading] = useState(true);
  const [sel,     setSel]     = useState(null);
  const [geoErr,  setGeoErr]  = useState(false);

  const cafesWithCoords = entries.filter(e => e.type==='cafe' && e.lat && e.lon);

  const makeNearbyMarker = useCallback(node => {
    if (!node.tags?.name) return null;
    const t = node.tags;
    const streetPart = t['addr:housenumber'] && t['addr:street']
      ? `${t['addr:housenumber']} ${t['addr:street']}` : t['addr:street'];
    const localityPart = t['addr:suburb'] || t['addr:neighbourhood'] || t['addr:city'] || t['addr:town'];
    const sub = [streetPart, localityPart].filter(Boolean).join(', ');
    const m = L.circleMarker([node.lat, node.lon], {
      radius:7, fillColor:P.cafe, fillOpacity:0.85, color:P.bg, weight:2
    });
    m.on('click', () => setSel({
      kind:'nearby', name:t.name, sub,
      lat:node.lat, lon:node.lon
    }));
    return m;
  }, []);

  const makeVisitedMarker = useCallback(entry => {
    const m = L.circleMarker([entry.lat, entry.lon], {
      radius:8, fillColor:P.cafe, fillOpacity:1, color:'#fff', weight:2.5
    });
    m.on('click', () => setSel({
      kind:'visited', name:entry.cafeName||'Unknown Café',
      sub:entry.location||'', lat:entry.lat, lon:entry.lon, entry
    }));
    return m;
  }, []);

  const refreshNearby = useCallback(async (lat, lon) => {
    setLoading(true);
    const nodes = await fetchNearbyCafes(lat, lon);
    if (!nearbyLgRef.current) return;
    nearbyLgRef.current.clearLayers();
    nodes.forEach(n => { const m = makeNearbyMarker(n); if (m) m.addTo(nearbyLgRef.current); });
    setLoading(false);
  }, [makeNearbyMarker]);

  const refreshVisited = useCallback(() => {
    if (!visitedLgRef.current) return;
    visitedLgRef.current.clearLayers();
    cafesWithCoords.forEach(e => makeVisitedMarker(e).addTo(visitedLgRef.current));
  }, [cafesWithCoords, makeVisitedMarker]);

  // Init Leaflet map once on mount
  useEffect(() => {
    let live = true;
    loadLeaflet().then(() => {
      if (!live || !containerRef.current || mapRef.current) return;
      const map = L.map(containerRef.current, { zoomControl:false });
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution:'© <a href="https://openstreetmap.org">OSM</a> © <a href="https://carto.com">CARTO</a>',
        maxZoom:19
      }).addTo(map);
      mapRef.current     = map;
      nearbyLgRef.current  = L.layerGroup().addTo(map);
      visitedLgRef.current = L.layerGroup();

      navigator.geolocation.getCurrentPosition(
        ({ coords:{ latitude:lat, longitude:lon } }) => {
          if (!live) return;
          userPosRef.current = [lat, lon];
          map.setView([lat, lon], 16);
          L.circleMarker([lat, lon], {
            radius:8, fillColor:P.brew, fillOpacity:1, color:'#fff', weight:2.5
          }).addTo(map);
          refreshNearby(lat, lon);
        },
        () => { if (live) { setGeoErr(true); setLoading(false); } },
        { timeout:8000 }
      );

      map.on('moveend', () => {
        clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => {
          const c = map.getCenter();
          refreshNearby(c.lat, c.lng);
        }, 700);
      });
    });
    return () => {
      live = false;
      clearTimeout(timerRef.current);
      if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
    };
  }, []);

  // Swap layers when toggle changes
  useEffect(() => {
    if (!mapRef.current) return;
    setSel(null);
    if (layer === 'nearby') {
      if (visitedLgRef.current) mapRef.current.removeLayer(visitedLgRef.current);
      if (nearbyLgRef.current)  nearbyLgRef.current.addTo(mapRef.current);
      const c = mapRef.current.getCenter();
      refreshNearby(c.lat, c.lng);
    } else {
      if (nearbyLgRef.current) mapRef.current.removeLayer(nearbyLgRef.current);
      refreshVisited();
      if (visitedLgRef.current) visitedLgRef.current.addTo(mapRef.current);
      setLoading(false);
    }
  }, [layer]);

  const dist = sel && userPosRef.current
    ? haversineM(userPosRef.current[0], userPosRef.current[1], sel.lat, sel.lon) : null;
  const distStr = dist == null ? null : dist < 1000 ? `${dist}m away` : `${(dist/1000).toFixed(1)}km away`;

  return (
    <div style={{ flex:1, position:'relative', overflow:'hidden' }}>
      {/* Nearby / Visited toggle */}
      <div style={{ position:'absolute', top:10, left:'50%', transform:'translateX(-50%)',
        zIndex:1000, display:'flex', background:'rgba(24,38,53,0.92)',
        border:'0.5px solid '+P.cardStroke, borderRadius:20, padding:3, gap:2 }}>
        {[['nearby','Nearby'],['visited','Visited']].map(([v,l])=>(
          <div key={v} onClick={()=>setLayer(v)}
            style={{ padding:'4px 16px', borderRadius:16, fontSize:9, cursor:'pointer',
              fontFamily:'DM Mono, monospace', transition:'all 0.15s',
              background: layer===v ? P.cafe : 'transparent',
              color: layer===v ? '#f0e4cc' : P.headerMuted }}>{l}</div>
        ))}
      </div>

      {/* Loading pill */}
      {loading && (
        <div style={{ position:'absolute', top:46, left:'50%', transform:'translateX(-50%)',
          zIndex:1000, background:'rgba(24,38,53,0.85)', padding:'3px 10px',
          borderRadius:10, fontSize:8, color:P.headerMuted, fontFamily:'DM Mono, monospace' }}>
          loading…
        </div>
      )}

      {/* Geo permission error */}
      {geoErr && (
        <div style={{ position:'absolute', inset:0, zIndex:400, display:'flex',
          alignItems:'center', justifyContent:'center', background:P.bg }}>
          <div style={{ textAlign:'center', padding:'0 40px' }}>
            <div style={{ fontSize:32, marginBottom:12 }}>📍</div>
            <div style={{ fontSize:11, color:P.headerMuted, fontFamily:'DM Mono, monospace', lineHeight:1.6 }}>
              Location access needed<br/>to find nearby cafés.
            </div>
          </div>
        </div>
      )}

      {/* Map tile container */}
      <div ref={containerRef} style={{ width:'100%', height:'100%' }} />

      {/* Visited empty state */}
      {layer==='visited' && cafesWithCoords.length===0 && !geoErr && (
        <div style={{ position:'absolute', bottom:16, left:16, right:16, zIndex:500,
          background:'rgba(24,38,53,0.92)', border:'0.5px solid '+P.cardStroke,
          borderRadius:14, padding:'14px 16px', textAlign:'center' }}>
          <div style={{ fontSize:10, color:P.headerMuted, fontFamily:'DM Mono, monospace',
            fontWeight:300, lineHeight:1.7 }}>
            Cafés logged via location search<br/>will appear here.
          </div>
        </div>
      )}

      {/* Selected marker card */}
      {sel && (
        <div style={{ position:'absolute', bottom:0, left:0, right:0, zIndex:1000,
          background:'rgba(24,38,53,0.97)', borderTop:'0.5px solid '+P.cardStroke,
          borderRadius:'16px 16px 0 0', padding:'16px 16px 28px' }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:12 }}>
            <div style={{ flex:1, paddingRight:10 }}>
              <div style={{ fontSize:18, fontWeight:500, color:P.headerText,
                fontFamily:'Cormorant Garamond, serif', lineHeight:1.2 }}>{sel.name}</div>
              {sel.sub && <div style={{ fontSize:9, color:P.headerMuted, fontFamily:'DM Mono, monospace',
                fontWeight:300, marginTop:3 }}>{sel.sub}</div>}
              {distStr && <div style={{ fontSize:9, color:P.cafe, fontFamily:'DM Mono, monospace',
                marginTop:4 }}>{distStr}</div>}
            </div>
            <span onClick={()=>setSel(null)} style={{ fontSize:22, color:P.headerMuted,
              cursor:'pointer', lineHeight:1 }}>×</span>
          </div>
          {sel.kind==='nearby' && (
            <div onClick={()=>{ onLogCafe&&onLogCafe({ cafeName:sel.name, location:sel.sub, lat:sel.lat, lon:sel.lon }); setSel(null); }}
              style={{ background:P.cafe, borderRadius:10, padding:'11px',
                textAlign:'center', cursor:'pointer',
                boxShadow:'0 3px 10px rgba(212,151,106,0.3)' }}>
              <span style={{ fontSize:11, color:'#182635', fontFamily:'DM Mono, monospace',
                letterSpacing:'0.04em' }}>log a visit →</span>
            </div>
          )}
          {sel.kind==='visited' && sel.entry && (
            <div style={{ fontSize:9, color:P.headerMuted, fontFamily:'DM Mono, monospace' }}>
              visited · {new Date(sel.entry.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── Brew Timer ────────────────────────────────────────────────────────────────
function TimerScreen({ recipe, onCancel, onLog }) {
  const [elapsed,  setElapsed]  = useState(0);
  const [running,  setRunning]  = useState(false);
  const [finished, setFinished] = useState(false);
  const [rating,   setRating]   = useState(0);
  const startRef = useRef(0);

  const steps  = buildSteps(recipe);
  const target = parseTimeStr(recipe.brewTime);

  useEffect(() => {
    if (!running) return;
    startRef.current = Date.now() - elapsed*1000;
    const id = setInterval(() => setElapsed(Math.floor((Date.now()-startRef.current)/1000)), 250);
    return () => clearInterval(id);
  }, [running]);

  useEffect(() => {
    let lock = null;
    if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => lock = l).catch(()=>{});
    return () => { if (lock) lock.release().catch(()=>{}); };
  }, []);

  const curIdx = steps.reduce((acc,s,i) => elapsed >= s.at ? i : acc, 0);
  const over   = target > 0 && elapsed > target;

  const handleLog = () => onLog({
    id:genId(), date:new Date().toISOString(), type:'brew',
    beanName:recipe.beanName||'', roaster:recipe.roaster||'',
    method:recipe.method||'', grinder:recipe.grinder||'', machine:recipe.machine||'', dose:recipe.dose||'', water:recipe.water||'',
    temp:recipe.temp||'', brewTime:fmtSec(elapsed), grindSize:recipe.grindSize||'',
    ratio:recipe.ratio||'', tastingNotes:[], rating,
    whatIdChange:'', recipe:recipe.recipe||''
  });

  const params = [['dose',recipe.dose],['water',recipe.water],['temp',recipe.temp],['grind',recipe.grindSize],['grinder',recipe.grinder],['machine',recipe.machine],['ratio',recipe.ratio]].filter(([,v])=>v);

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, overflow:'hidden', background:P.bg }}>
      <div style={{ padding:'8px 16px', paddingTop:'calc(8px + env(safe-area-inset-top))',
        display:'flex', justifyContent:'space-between', alignItems:'center',
        borderBottom:'0.5px solid rgba(240,228,204,0.15)', flexShrink:0 }}>
        <div onClick={onCancel} style={{ fontSize:11, color:P.cafe, cursor:'pointer', padding:'4px 0' }}>✕ Cancel</div>
        <div style={{ fontSize:13, fontWeight:500, color:G.text, fontFamily:'Cormorant Garamond, serif', letterSpacing:'0.04em' }}>Brew Timer</div>
        <div style={{ width:44 }} />
      </div>

      <div className="scroll-y" style={{ flex:1, padding:'20px 16px', display:'flex', flexDirection:'column' }}>
        <div style={{ textAlign:'center', marginBottom:6 }}>
          <div style={{ fontSize:22, fontWeight:500, color:P.headerText, fontFamily:'Cormorant Garamond, serif' }}>{recipe.beanName||'Brew'}</div>
          {recipe.method && <div style={{ fontSize:9, color:P.brew, fontFamily:'DM Mono, monospace', marginTop:3 }}>{recipe.method}</div>}
        </div>
        {params.length>0 && (
          <div style={{ display:'flex', justifyContent:'center', flexWrap:'wrap', gap:'2px 12px', marginBottom:18 }}>
            {params.map(([l,v])=>(
              <span key={l} style={{ fontSize:8.5, color:P.headerMuted, fontFamily:'DM Mono, monospace' }}>{l} <span style={{ color:G.text }}>{v}</span></span>
            ))}
          </div>
        )}
        <div style={{ textAlign:'center', marginBottom:18 }}>
          <div style={{ fontSize:60, fontWeight:300, color: over ? P.cafe : P.headerText, fontFamily:'DM Mono, monospace', lineHeight:1 }}>{fmtSec(elapsed)}</div>
          {target>0 && <div style={{ fontSize:9, color:P.headerMuted, fontFamily:'DM Mono, monospace', marginTop:6 }}>target {fmtSec(target)}</div>}
        </div>

        {!finished && (
          <div style={{ marginBottom:20 }}>
            {steps.map((s,i)=>(
              <div key={i} style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 10px',
                borderRadius:8, marginBottom:3,
                background: i===curIdx && elapsed>0 ? 'rgba(122,154,176,0.14)' : 'transparent' }}>
                <span style={{ fontSize:9, color: i<=curIdx && elapsed>0 ? P.brew : P.headerMuted,
                  fontFamily:'DM Mono, monospace', width:34, flexShrink:0 }}>{fmtSec(s.at)}</span>
                <span style={{ fontSize:11, fontFamily:'DM Mono, monospace', fontWeight:300,
                  color: i===curIdx && elapsed>0 ? G.text : P.headerMuted,
                  opacity: i>curIdx ? 0.6 : 1 }}>{i<curIdx?'✓ ':''}{s.label}</span>
              </div>
            ))}
          </div>
        )}

        <div style={{ marginTop:'auto', paddingBottom:16 }}>
          {!finished ? (
            <div style={{ display:'flex', gap:10 }}>
              <div onClick={()=>setRunning(r=>!r)}
                style={{ flex:1, background: running ? 'transparent' : P.brew,
                  border:'1px solid '+P.brew, borderRadius:12, padding:'14px', textAlign:'center', cursor:'pointer' }}>
                <span style={{ fontSize:12, fontFamily:'DM Mono, monospace', color: running ? P.brew : '#182635' }}>
                  {running ? 'pause' : elapsed>0 ? 'resume' : '▶ start'}
                </span>
              </div>
              {elapsed>0 && (
                <div onClick={()=>{ setRunning(false); setFinished(true); }}
                  style={{ flex:1, background:P.cafe, borderRadius:12, padding:'14px', textAlign:'center', cursor:'pointer' }}>
                  <span style={{ fontSize:12, fontFamily:'DM Mono, monospace', color:'#182635' }}>finish ✓</span>
                </div>
              )}
            </div>
          ) : (
            <div>
              <div style={{ textAlign:'center', marginBottom:10 }}>
                <div style={{ fontSize:10, color:P.headerMuted, fontFamily:'DM Mono, monospace', marginBottom:8 }}>brewed in {fmtSec(elapsed)} — how was it?</div>
                <div style={{ display:'flex', justifyContent:'center' }}><RatingSquares n={rating} size={22} onChange={setRating} /></div>
              </div>
              <div onClick={handleLog} style={{ background:P.cafe, borderRadius:12, padding:'14px',
                textAlign:'center', cursor:'pointer', boxShadow:'0 3px 10px rgba(212,151,106,0.3)' }}>
                <span style={{ fontSize:12, fontFamily:'DM Mono, monospace', color:'#182635' }}>log this brew</span>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Dial-in panel (shown in BrewForm when the bean has brew history) ──────────
function DialInPanel({ last, attempt, grinder }) {
  const [taste, setTaste] = useState(null);
  const unit = grinder && (grinder.adj==='clicks' ? '2–3 clicks' : grinder.adj==='dial' ? 'half a number' : 'a touch');
  const finer   = grinder ? ` (${unit} finer on the ${grinder.n})`   : '';
  const coarser = grinder ? ` (${unit} coarser on the ${grinder.n})` : '';
  const tips = {
    sour:   `Sour or weak usually means under-extraction — try a finer grind${finer}, hotter water, or a longer brew.`,
    right:  'Sounds dialed in — after saving, open the entry and pin it as your go-to recipe for this bean.',
    bitter: `Bitter or harsh usually means over-extraction — try a coarser grind${coarser}, cooler water, or a shorter brew.`,
  };
  const lastLine = [last.grindSize && `grind ${last.grindSize}`, last.grinder,
    last.brewTime && `time ${last.brewTime}`,
    last.ratio && `ratio ${last.ratio}`, last.temp].filter(Boolean).join(' · ');
  return (
    <div style={{ background:'rgba(122,154,176,0.10)', border:'0.5px solid rgba(122,154,176,0.35)',
      borderRadius:12, padding:'11px 13px', marginBottom:14 }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
        <span style={{ fontSize:8, color:P.brew, fontFamily:'DM Mono, monospace', letterSpacing:'0.1em' }}>DIAL-IN · ATTEMPT #{attempt}</span>
        {last.rating>0 && <RatingDots n={last.rating} />}
      </div>
      <div style={{ fontSize:10, color:G.text, fontFamily:'DM Mono, monospace', fontWeight:300, marginBottom:8 }}>
        last time: {lastLine || 'no parameters logged'}
      </div>
      <div style={{ fontSize:8.5, color:P.headerMuted, fontFamily:'DM Mono, monospace', marginBottom:6 }}>How did the last one taste?</div>
      <div style={{ display:'flex', gap:5 }}>
        {[['sour','Sour / weak'],['right','Just right'],['bitter','Bitter / harsh']].map(([k,l])=>(
          <GhostChip key={k} label={l} active={taste===k} onPress={()=>setTaste(taste===k?null:k)} />
        ))}
      </div>
      {taste && (
        <div style={{ fontSize:9.5, color:P.brew, fontFamily:'DM Mono, monospace', fontWeight:300, lineHeight:1.6, marginTop:8 }}>
          {tips[taste]}
        </div>
      )}
    </div>
  );
}

function QuickCaptureSheet({ onClose, onSave, onExpand, beans=[], gear=[] }) {
  const [type, setType]         = useState('cafe');
  const [cafeName, setCafeName] = useState('');
  const [drinkType, setDrink]   = useState('');
  const [beanName, setBean]     = useState('');
  const [method, setMethod]     = useState('');
  const [rating, setRating]     = useState(0);
  const ownedMethods = [...new Set(gear.flatMap(g => g.m||[]))];
  const [showAllMethods, setShowAllMethods] = useState(ownedMethods.length===0);
  const methodChips = [...new Set([
    ...ownedMethods,
    ...(showAllMethods ? BREW_METHODS : []),
    ...(method ? [method] : []) ])];

  const handleSave = () => {
    const base = { id:genId(), date:new Date().toISOString(), type, rating, tastingNotes:[], notes:'' };
    const entry = type==='cafe'
      ? { ...base, cafeName, drinkType, location:'', bean:'', price:'',
          ratings:{overall:rating,aroma:0,taste:0,texture:0}, vibeTags:[], wouldVisitAgain:false }
      : { ...base, beanName, method, roaster:'', grinder:'', machine:'', dose:'', water:'', temp:'',
          brewTime:'', grindSize:'', ratio:'', whatIdChange:'', recipe:'' };
    onSave(entry);
  };

  const fieldStyle = { height:42, background:G.surface, border:'1px solid '+G.border,
    borderRadius:10, display:'flex', alignItems:'center', padding:'0 14px' };
  const labelStyle = { fontSize:8.5, color:P.cardMuted, fontFamily:'DM Mono, monospace',
    marginBottom:5, letterSpacing:'0.1em', textTransform:'uppercase' };

  return (
    <div style={{ position:'fixed', inset:0, zIndex:100, display:'flex', flexDirection:'column', justifyContent:'flex-end' }}>

        style={{ position:'absolute', inset:0, background:'rgba(10,18,26,0.7)' }} />
      <div className="slide-up" style={{ position:'relative', zIndex:1,
        background:'rgba(24,38,53,0.97)', borderRadius:'20px 20px 0 0',
        border:'0.5px solid '+P.cardStroke, borderBottom:'none',
        padding:'0 16px', paddingBottom:'env(safe-area-inset-bottom)' }}>

          {[['cafe','Café Visit'],['brew','Home Brew']].map(([val,lbl])=>(

              background: type===val ? P.cafe : 'transparent',

              border:'1px solid '+(type===val ? P.cafe : P.cardStroke), transition:'all 0.15s' }}>
              {lbl}
            </div>

        </div>
        {type==='cafe' ? (
          <>
            <div style={{ marginBottom:10 }}>
              <div style={labelStyle}>Café Name</div>
              <div style={fieldStyle}><input placeholder="Where did you go?" value={cafeName} onChange={e=>setCafeName(e.target.value)} style={{ fontSize:13, color:G.text }} /></div>
            </div>
            <div style={{ marginBottom:10 }}>
              <div style={labelStyle}>Drink</div>
              <div style={fieldStyle}><input placeholder="Flat White, Latte…" value={drinkType} onChange={e=>setDrink(e.target.value)} style={{ fontSize:13, color:G.text }} /></div>

            <BeanPicker beans={beans} value={beanName} onChange={setBean} />
            <div style={{ marginBottom:10 }}>
              <div style={labelStyle}>Method</div>
              <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>

          boxShadow:'0 3px 10px rgba(212,151,106,0.3)' }}>
          <span style={{ color:'#182635', fontSize:12, fontFamily:'DM Mono, monospace', letterSpacing:'0.04em' }}>save entry</span>
        </div>
      </div>
    </div>
  );
}

function CafeForm({ initial={}, onBack, onSave, onUpdate, customNotes=[], onAddNote=()=>{}, customDrinks=[], onAddDrink=()=>{} }) {
  const defaults = { cafeName:'', location:'', drinkType:'', bean:'', price:'',
    tastingNotes:[], ratings:{overall:0,aroma:0,taste:0,texture:0},
    vibeTags:[], wouldVisitAgain:false, notes:'' };
  const [f, setF] = useState({ ...defaults, ...initial });
  const initStr = useRef(JSON.stringify({ ...defaults, ...initial }));
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const toggleArr = (k,v) => setF(p=>({ ...p, [k]: p[k].includes(v) ? p[k].filter(x=>x!==v) : [...p[k],v] }));
  const setRating = (k,v) => setF(p=>({...p, ratings:{...p.ratings,[k]:v}}));
  const hasChanges = JSON.stringify(f) !== initStr.current;

  const buildEntry = () => ({ id:initial.id||genId(), date:initial.date||new Date().toISOString(), type:'cafe', rating:f.ratings.overall, ...f, ...(initial.lat!=null?{lat:initial.lat,lon:initial.lon}:{}) });
  const handleSave = () => { onUpdate ? onUpdate(buildEntry()) : onSave(buildEntry()); };
  const handleBack = () => {
    if (hasChanges) {
      if (window.confirm('Save changes before leaving?')) handleSave();
      else onBack();
    } else onBack();
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, overflow:'hidden', background:P.bg }}>
      <NavBar title="Café Visit" onBack={handleBack} onSave={handleSave} />
      <div className="scroll-y" style={{ flex:1, padding:'14px 16px' }}>
        <GhostField label="Café Name" placeholder="Where did you go?" value={f.cafeName} onChange={v=>set('cafeName',v)} />
        <GhostField label="Location" placeholder="City, neighbourhood…" value={f.location} onChange={v=>set('location',v)} />
        <FormDivider />
        <SectionHead label="The Coffee" />
        <div style={{ height:8 }} />
        <ChipAdder label="Drink Type" presets={DRINK_TYPES} custom={customDrinks} onCustomChange={onAddDrink}
          selected={f.drinkType?[f.drinkType]:[]} onToggle={v=>set('drinkType', f.drinkType===v?'':v)} />
        <GhostField label="Bean / Roaster" placeholder="Ethiopia, Colombia…" value={f.bean} onChange={v=>set('bean',v)} />
        <GhostField label="Price" placeholder="$0.00" value={f.price} onChange={v=>set('price',v)} />
        <FormDivider />
        <SectionHead label="Tasting" />
        <div style={{ height:8 }} />
        <ChipAdder label="Notes" presets={TASTING_NOTES} custom={customNotes} onCustomChange={onAddNote}
          selected={f.tastingNotes} onToggle={n=>toggleArr('tastingNotes',n)} />
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:9, color:G.label, fontFamily:'DM Mono, monospace', marginBottom:8, letterSpacing:'0.1em', textTransform:'uppercase' }}>Rating</div>
          {['Overall','Aroma','Taste','Texture'].map(r=>(
            <div key={r} style={{ display:'flex', alignItems:'center', gap:12, marginBottom:8 }}>
              <span style={{ fontSize:10, color:G.label, fontFamily:'DM Mono, monospace', width:54, flexShrink:0 }}>{r}</span>
              <RatingSquares n={f.ratings[r.toLowerCase()]||0} size={16} onChange={v=>setRating(r.toLowerCase(),v)} />
            </div>
          ))}
        </div>
        <FormDivider />
        <SectionHead label="Vibe" />
        <div style={{ height:8 }} />
        <div style={{ display:'flex', flexWrap:'wrap', gap:5, marginBottom:14 }}>
          {VIBE_TAGS.map(t=><GhostChip key={t} label={t} active={f.vibeTags.includes(t)} onPress={()=>toggleArr('vibeTags',t)} />)}
        </div>
        <div onClick={()=>set('wouldVisitAgain',!f.wouldVisitAgain)}
          style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14, cursor:'pointer' }}>
          <div style={{ width:16, height:16, borderRadius:4, flexShrink:0,
            border:'0.5px solid '+(f.wouldVisitAgain?P.cafe:G.chipBorder),
            background: f.wouldVisitAgain?P.cafe:G.surface,
            display:'flex', alignItems:'center', justifyContent:'center' }}>
            {f.wouldVisitAgain && <span style={{ fontSize:10, color:'#182635', lineHeight:1 }}>✓</span>}
          </div>
          <span style={{ fontSize:12, color:G.text, fontFamily:'DM Mono, monospace', fontWeight:300 }}>Would visit again</span>
        </div>
        <GhostField label="Notes" placeholder="Anything else to remember…" value={f.notes} onChange={v=>set('notes',v)} multiline />
        <div style={{ height:32 }} />
      </div>
    </div>
  );
}

function BrewForm({ initial={}, onBack, onSave, onUpdate, beans=[], entries=[], gear=[], customNotes=[], onAddNote=()=>{} }) {
  const grinders     = gear.filter(g => g.c==='grinder');
  const machines     = gear.filter(g => g.c==='machine');
  const ownedMethods = [...new Set(gear.flatMap(g => g.m||[]))];
  const defaults = { beanName:'', roaster:'', method:'V60', grinder:'', machine:'', dose:'', water:'',
    temp:'', brewTime:'', grindSize:'', ratio:'', tastingNotes:[], rating:0, whatIdChange:'', recipe:'' };
  const initObj = { ...defaults,
    ...(ownedMethods.length && !initial.method  ? { method:  ownedMethods[0] } : {}),
    ...(grinders.length===1 && !initial.grinder ? { grinder: grinders[0].n }   : {}),
    ...(machines.length===1 && !initial.machine ? { machine: machines[0].n }   : {}),
    ...initial };
  const [f, setF] = useState(initObj);
  const [showAllMethods, setShowAllMethods] = useState(ownedMethods.length===0);
  const initStr = useRef(JSON.stringify(initObj));
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const toggleNote = n => setF(p=>({ ...p, tastingNotes: p.tastingNotes.includes(n) ? p.tastingNotes.filter(x=>x!==n) : [...p.tastingNotes,n] }));
  const hasChanges = JSON.stringify(f) !== initStr.current;

  const buildEntry = () => ({ id:initial.id||genId(), date:initial.date||new Date().toISOString(), type:'brew', ...f });
  const handleSave = () => { onUpdate ? onUpdate(buildEntry()) : onSave(buildEntry()); };
  const handleBack = () => {
    if (hasChanges) {
      if (window.confirm('Save changes before leaving?')) handleSave();
      else onBack();
    } else onBack();
  };

  const activeGrinder = grinders.find(g => g.n===f.grinder) || (grinders.length===1 ? grinders[0] : null);
  const isEsp = (f.method||'').toLowerCase().includes('espresso');
  const grindSuggestion = activeGrinder ? (isEsp ? activeGrinder.esp : activeGrinder.filter) : null;
  const grindMax = activeGrinder && (activeGrinder.adj==='clicks' || activeGrinder.adj==='dial') && activeGrinder.max > 0
    ? activeGrinder.max : null;
  const grindPh = grindMax ? `0–${grindMax}`
    : activeGrinder
      ? (activeGrinder.adj==='clicks' ? 'e.g. 24 clicks' : activeGrinder.adj==='dial' ? 'e.g. 6.5' : 'e.g. fine, medium')
      : 'Medium-fine';
  const clampGrind = v => {
    if (v === '') { set('grindSize', ''); return; }
    const n = parseFloat(v);
    if (isNaN(n)) return;
    set('grindSize', String(Math.min(grindMax, Math.max(0, n))));
  };
  const visibleMethods = [...new Set([
    ...(showAllMethods ? [...BREW_METHODS, ...ownedMethods] : ownedMethods),
    ...(f.method ? [f.method] : []) ])];

  const bean = beans.find(b => b.name===f.beanName);
  const dialed = !initial.id && bean ? (dialedMap(bean)||{})[f.method] : null;
  const applyDialed = () => setF(p => ({ ...p,
    grinder: dialed.grinder || p.grinder, machine: dialed.machine || p.machine,
    dose: dialed.dose, water: dialed.water, temp: dialed.temp, brewTime: dialed.brewTime,
    grindSize: dialed.grindSize, ratio: dialed.ratio, recipe: dialed.recipe || p.recipe }));

  const params = isEsp
    ? [['Dose (g)','dose','18g'],['Yield (g)','water','36g'],
       ['Water Temp','temp','93°C'],['Shot Time','brewTime','28s'],
       ['Grind Size','grindSize',grindPh],['Ratio','ratio','1:2']]
    : [['Dose (g)','dose','15g'],['Water (ml)','water','250ml'],
       ['Water Temp','temp','92°C'],['Brew Time','brewTime','3:30'],
       ['Grind Size','grindSize',grindPh],['Ratio','ratio','1:16']];

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, overflow:'hidden', background:P.bg }}>
      <NavBar title="Home Brew" onBack={handleBack} onSave={handleSave} />
      <div className="scroll-y" style={{ flex:1, padding:'14px 16px' }}>
        <BeanPicker beans={beans} value={f.beanName} onChange={v=>set('beanName',v)}
          onBeanSelect={b=>setF(p=>({ ...p, beanName:b.name, roaster:b.roaster||p.roaster }))} />
        <GhostField label="Roaster" placeholder="Counter Culture, Intelligentsia…" value={f.roaster} onChange={v=>set('roaster',v)} />
        {dialed && (
          <div style={{ background:'rgba(122,154,176,0.10)', border:'0.5px solid rgba(122,154,176,0.35)',
            borderRadius:12, padding:'11px 13px', marginBottom:14 }}>
            <div style={{ fontSize:8, color:P.brew, fontFamily:'DM Mono, monospace', letterSpacing:'0.1em', marginBottom:6 }}>★ DIALED IN · {f.method.toUpperCase()}</div>
            <div style={{ fontSize:10, color:G.text, fontFamily:'DM Mono, monospace', fontWeight:300, marginBottom:10 }}>
              {[dialed.grindSize && `grind ${dialed.grindSize}`, dialed.dose && `dose ${dialed.dose}`,
                dialed.water && `water ${dialed.water}`, dialed.brewTime && `time ${dialed.brewTime}`,
                dialed.ratio].filter(Boolean).join(' · ') || 'recipe pinned'}
            </div>
            <div onClick={applyDialed} style={{ background:P.brew, borderRadius:9, padding:'9px', textAlign:'center', cursor:'pointer' }}>
              <span style={{ fontSize:10, color:'#182635', fontFamily:'DM Mono, monospace' }}>use this recipe</span>
            </div>
          </div>
        )}
        {(() => {
          if (initial.id || dialed) return null;
          const hist = entries.filter(e => e.type==='brew' && e.beanName && e.beanName===f.beanName && e.method===f.method);
          return hist.length>0 ? <DialInPanel last={hist[0]} attempt={hist.length+1} grinder={activeGrinder} /> : null;
        })()}
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:9, color:G.label, fontFamily:'DM Mono, monospace', marginBottom:8, letterSpacing:'0.1em', textTransform:'uppercase' }}>
            Brew Method{!showAllMethods && ownedMethods.length>0 ? ' · your gear' : ''}
          </div>
          <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
            {visibleMethods.map(m=><GhostChip key={m} label={m} active={f.method===m} onPress={()=>set('method',m)} />)}
            {!showAllMethods && ownedMethods.length>0 &&
              <GhostChip label="+ more" onPress={()=>setShowAllMethods(true)} />}
          </div>
        </div>
        {grinders.length>1 && (
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:9, color:G.label, fontFamily:'DM Mono, monospace', marginBottom:8, letterSpacing:'0.1em', textTransform:'uppercase' }}>Grinder</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
              {grinders.map(g=><GhostChip key={g.id} label={g.n} active={f.grinder===g.n} onPress={()=>set('grinder', f.grinder===g.n?'':g.n)} />)}
            </div>
          </div>
        )}
        {isEsp && machines.length>0 && (
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:9, color:G.label, fontFamily:'DM Mono, monospace', marginBottom:8, letterSpacing:'0.1em', textTransform:'uppercase' }}>Machine</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
              {machines.map(g=><GhostChip key={g.id} label={g.n} active={f.machine===g.n} onPress={()=>set('machine', f.machine===g.n?'':g.n)} />)}
            </div>
          </div>
        )}
        <FormDivider />
        <SectionHead label="Parameters" />
        <div style={{ height:8 }} />
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:4 }}>
          {params.map(([lbl,key,ph])=>(
            <div key={key}>
              <div style={{ fontSize:8.5, color:G.label, fontFamily:'DM Mono, monospace', marginBottom:5, letterSpacing:'0.1em', textTransform:'uppercase' }}>{lbl}</div>
              <div style={{ height:40, background:G.surface, border:'1px solid '+G.border, borderRadius:10, display:'flex', alignItems:'center', padding:'0 12px' }}>
                {key==='grindSize' && grindMax
                  ? <input type="number" inputMode="decimal" min={0} max={grindMax} step="any"
                      placeholder={ph} value={f[key]} onChange={e=>clampGrind(e.target.value)}
                      style={{ fontSize:12, color:G.text }} />
                  : <input placeholder={ph} value={f[key]} onChange={e=>set(key,e.target.value)} style={{ fontSize:12, color:G.text }} />}
              </div>
            </div>
          ))}
        </div>
        {activeGrinder && grindSuggestion && (
          <div style={{ fontSize:9, color:P.brew, fontFamily:'DM Mono, monospace', fontWeight:300, marginTop:8, marginBottom:4 }}>
            {activeGrinder.n}: try {grindSuggestion}{activeGrinder.adj==='clicks'?' clicks':''} for {isEsp?'espresso':'filter'}
          </div>
        )}
        <FormDivider />
        <SectionHead label="Tasting" />
        <div style={{ height:8 }} />
        <ChipAdder label="Notes" presets={TASTING_NOTES} custom={customNotes} onCustomChange={onAddNote}
          selected={f.tastingNotes} onToggle={toggleNote} />
        <div style={{ marginBottom:16 }}>
          <div style={{ fontSize:9, color:G.label, fontFamily:'DM Mono, monospace', marginBottom:8, letterSpacing:'0.1em', textTransform:'uppercase' }}>Rating</div>
          <RatingSquares n={f.rating} size={20} onChange={v=>set('rating',v)} />
        </div>
        <FormDivider />
        <SectionHead label="Notes" />
        <div style={{ height:8 }} />
        <GhostField label="What I'd Change Next Time" placeholder="Try coarser grind…" value={f.whatIdChange} onChange={v=>set('whatIdChange',v)} multiline />
        <GhostField label="Recipe / Steps" placeholder="Step-by-step notes…" value={f.recipe} onChange={v=>set('recipe',v)} multiline />
        <div style={{ height:32 }} />
      </div>
    </div>
  );
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function StatsDash({ entries, onTab, onAdd }) {
  const [period, setPeriod] = useState('month');
  const now = new Date();
  const subset = period==='month'
    ? entries.filter(e=>{ const d=new Date(e.date); return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear(); })
    : entries;
  const cafe  = subset.filter(e=>e.type==='cafe');
  const brews = subset.filter(e=>e.type==='brew');
  const rats  = subset.filter(e=>e.rating>0).map(e=>e.rating);
  const avg   = rats.length ? (rats.reduce((a,b)=>a+b,0)/rats.length).toFixed(1) : '—';

  const barData = Array.from({length:16},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(15-i));
    return entries.filter(e=>e.date.startsWith(d.toISOString().slice(0,10))).length;
  });
  const maxBar = Math.max(...barData,1);

  const methodMap = {};
  brews.forEach(e=>{ const m=e.method||'Other'; methodMap[m]=(methodMap[m]||0)+1; });
  const topMethods = Object.entries(methodMap).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([m,c])=>({ m, p:Math.round((c/(brews.length||1))*100) }));

  const noteMap = {};
  entries.forEach(e=>{
    const r = e.rating||(e.ratings?.overall)||0;
    if (!r || !e.tastingNotes?.length) return;
    e.tastingNotes.forEach(n=>{ if(!noteMap[n]) noteMap[n]={sum:0,cnt:0}; noteMap[n].sum+=r; noteMap[n].cnt++; });
  });
  const noteAvgs = Object.entries(noteMap).filter(([,s])=>s.cnt>=2)
    .map(([n,s])=>({ n, avg:s.sum/s.cnt })).sort((a,b)=>b.avg-a.avg);
  const enjoyNotes  = noteAvgs.filter(x=>x.avg>=4).map(x=>x.n);
  const dislikeNotes= noteAvgs.filter(x=>x.avg<=2).map(x=>x.n);

  const stats = [
    { l:'Total Coffees', v:String(subset.length), s:period==='month'?'this month':'all time' },
    { l:'Avg Rating',    v:avg,                    s:'out of 5' },
    { l:'Cafés Visited', v:String(cafe.length),    s:'café visits' },
    { l:'Home Brews',    v:String(brews.length),   s:period==='month'?'this month':'all time' },
  ];

  const d1=new Date(); d1.setDate(d1.getDate()-15);
  const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, overflow:'hidden' }}>
      <div style={{ padding:'18px 16px 12px', paddingTop:'calc(18px + env(safe-area-inset-top))' }}>
        <div style={{ fontSize:28, fontWeight:500, color:P.headerText, fontFamily:'Cormorant Garamond, serif', lineHeight:1 }}>Insights</div>
        <div style={{ display:'inline-flex', marginTop:12, background:P.cardBg,
          border:'0.5px solid '+P.cardStroke, borderRadius:20, padding:3, gap:2 }}>
          {[['month','This Month'],['all','All Time']].map(([val,lbl])=>(
            <div key={val} onClick={()=>setPeriod(val)} style={{ fontFamily:'DM Mono, monospace', fontSize:9,
              padding:'4px 12px', borderRadius:16, cursor:'pointer', transition:'all 0.15s',
              background: period===val?P.cardBg2:'transparent',
              color: period===val?P.headerText:P.headerMuted }}>{lbl}</div>
          ))}
        </div>
      </div>
      <div className="scroll-y" style={{ flex:1, padding:'0 16px 8px' }}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:8 }}>
          {stats.map((s,i)=>(
            <div key={i} style={{ background:P.cardBg2, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 13px' }}>
              <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'DM Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:5 }}>{s.l}</div>
              <div style={{ fontSize:30, fontWeight:400, color:P.headerText, fontFamily:'Cormorant Garamond, serif', lineHeight:1 }}>{s.v}</div>
              <div style={{ fontSize:9, color:P.headerMuted, fontFamily:'DM Mono, monospace', fontWeight:300, marginTop:3 }}>{s.s}</div>
            </div>
          ))}
        </div>
        <div style={{ background:P.cardBg, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 13px', marginBottom:8 }}>
          <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'DM Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:10 }}>Coffees per day</div>

            <span style={{ fontSize:8, color:P.headerMuted, fontFamily:'DM Mono, monospace' }}>{fmt(now)}</span>
          </div>

        {topMethods.length>0 && (
          <div style={{ background:P.cardBg, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 13px', marginBottom:8 }}>
            <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'DM Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:10 }}>Top Brew Methods</div>

        {(enjoyNotes.length>0||dislikeNotes.length>0) && (
          <div style={{ background:P.cardBg, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 13px', marginBottom:8 }}>
            <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'DM Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:10 }}>Taste Profile</div>
            {enjoyNotes.length>0 && (

              <div>

                <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
                  {dislikeNotes.map(n=><GhostChip key={n} label={n} />)}

      <TabBar active={3} onTab={onTab} onAdd={onAdd} />

  );
}

// ── Gear Locker ───────────────────────────────────────────────────────────────
function GearLocker({ gear, onChange, catalog=GEAR_CATALOG }) {
  const [q, setQ]               = useState('');
  const [customMode, setCustom] = useState(false);
  const [cName, setCName]       = useState('');
  const [cCat, setCCat]         = useState('grinder');
  const [cAdj, setCAdj]         = useState('clicks');
  const [cShare, setCShare]     = useState(false);
  const [editId, setEditId]     = useState(null);

  const owned = new Set(gear.map(g => g.n.toLowerCase()));
  const ql = q.trim().toLowerCase();
  const results = ql
    ? catalog.filter(it => !owned.has(it.n.toLowerCase()) && it.n.toLowerCase().includes(ql)).slice(0,6)
    : [];

  const add = it => { onChange([...gear, { id:genId(), ...it }]); setQ(''); };
  const addCustom = () => {
    const n = cName.trim(); if (!n) return;
    const item = { id:genId(), c:cCat, n };
    if (cCat==='grinder') item.adj = cAdj;
    if (cCat==='brewer' || cCat==='machine') item.m = [cCat==='machine' ? 'Espresso' : n];
    onChange([...gear, item]);
    if (cShare) { const { id, ...pub } = item; queueShare('gear', pub); }
    setCName(''); setCustom(false); setCShare(false); setQ('');
  };
  const remove = id => { onChange(gear.filter(g => g.id!==id)); if (editId===id) setEditId(null); };
  const update = (id, k, v) => onChange(gear.map(g => g.id===id ? { ...g, [k]:v } : g));
  const catLabel = c => (GEAR_CATS.find(([k])=>k===c)||[c,c])[1];

  const smallInput = { fontSize:10, color:G.text, background:G.surface, border:'1px solid '+G.border,
    borderRadius:8, padding:'6px 10px', fontFamily:'DM Mono, monospace', fontWeight:300 };

  return (
    <div style={{ background:P.cardBg, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 14px', marginBottom:8 }}>
      <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'DM Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:10 }}>My Gear</div>

      {gear.length===0 && !ql && !customMode && (
        <div style={{ fontSize:10, color:P.headerMuted, fontFamily:'DM Mono, monospace', fontWeight:300, lineHeight:1.6, marginBottom:10 }}>
          Add your grinder and brewers — the brew form will adapt to what you own.
        </div>
      )}

      {gear.map(g => (
        <div key={g.id} style={{ marginBottom:6 }}>
          <div onClick={()=>setEditId(editId===g.id?null:g.id)}
            style={{ display:'flex', alignItems:'center', gap:10, background:P.cardBg2,
              border:'0.5px solid '+(editId===g.id?P.cafe:P.cardStroke), borderRadius:10,
              padding:'9px 12px', cursor:'pointer' }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:12, color:P.headerText, fontFamily:'DM Mono, monospace', fontWeight:400 }}>{g.n}</div>
              <div style={{ fontSize:8.5, color:P.headerMuted, fontFamily:'DM Mono, monospace', fontWeight:300, marginTop:2 }}>
                {[catLabel(g.c), g.adj, g.filter && `filter ${g.filter}`, g.esp && `esp ${g.esp}`].filter(Boolean).join(' · ')}
              </div>
            </div>
            <span onClick={e=>{ e.stopPropagation(); remove(g.id); }}
              style={{ fontSize:14, color:P.headerMuted, cursor:'pointer', padding:'0 2px' }}>×</span>
          </div>
          {editId===g.id && g.c==='grinder' && (
            <div style={{ background:'rgba(220,205,180,0.05)', border:'0.5px solid '+P.cardStroke, borderTop:'none',
              borderRadius:'0 0 10px 10px', padding:'10px 12px', margin:'0 4px' }}>
              <div style={{ fontSize:8, color:G.label, fontFamily:'DM Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:6 }}>Adjustment</div>
              <div style={{ display:'flex', gap:5, marginBottom:10 }}>
                {['clicks','dial','stepless'].map(a=>(
                  <GhostChip key={a} label={a} active={g.adj===a} onPress={()=>update(g.id,'adj',a)} />
                ))}
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8 }}>
                <div>
                  <div style={{ fontSize:8, color:G.label, fontFamily:'DM Mono, monospace', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.08em' }}>Filter setting</div>
                  <input value={g.filter||''} placeholder="e.g. 22–28" onChange={e=>update(g.id,'filter',e.target.value)} style={smallInput} />
                </div>
                <div>
                  <div style={{ fontSize:8, color:G.label, fontFamily:'DM Mono, monospace', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.08em' }}>Espresso setting</div>
                  <input value={g.esp||''} placeholder="e.g. 8–12" onChange={e=>update(g.id,'esp',e.target.value)} style={smallInput} />
                </div>
                <div>
                  <div style={{ fontSize:8, color:G.label, fontFamily:'DM Mono, monospace', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.08em' }}>Range max</div>
                  <input type="number" value={g.max||''} placeholder="e.g. 40"
                    onChange={e=>update(g.id,'max', e.target.value==='' ? '' : parseFloat(e.target.value))} style={smallInput} />
                </div>
              </div>
            </div>
          )}
        </div>
      ))}

      {!customMode && (
        <div style={{ marginTop:8 }}>
          <div style={{ background:G.surface, border:'1px solid '+(ql?P.cafe:G.border), borderRadius:ql&&(results.length||true)?'10px 10px 0 0':'10px',
            display:'flex', alignItems:'center', padding:'8px 12px' }}>
            <input placeholder="Search grinders, brewers, machines…" value={q} onChange={e=>setQ(e.target.value)}
              style={{ fontSize:11, color:G.text }} />
          </div>
          {ql && (
            <div style={{ background:G.surface, border:'1px solid '+P.cafe, borderTop:'none',
              borderRadius:'0 0 10px 10px', overflow:'hidden' }}>
              {results.map(it=>(
                <div key={it.n} onClick={()=>add(it)}
                  style={{ padding:'9px 12px', borderBottom:'0.5px solid '+G.border, cursor:'pointer',
                    display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                  <span style={{ fontSize:11, color:G.text, fontFamily:'DM Mono, monospace', fontWeight:300 }}>{it.n}</span>
                  <span style={{ fontSize:8, color:G.label, fontFamily:'DM Mono, monospace' }}>{catLabel(it.c)}</span>
                </div>
              ))}
              <div onClick={()=>{ setCustom(true); setCName(q); }} style={{ padding:'9px 12px', cursor:'pointer' }}>
                <span style={{ fontSize:10, color:P.cafe, fontFamily:'DM Mono, monospace' }}>+ add "{q}" as custom gear</span>
              </div>
            </div>
          )}
        </div>
      )}

      {customMode && (
        <div style={{ marginTop:8, background:'rgba(220,205,180,0.05)', border:'0.5px solid '+P.cardStroke, borderRadius:10, padding:'10px 12px' }}>
          <div style={{ fontSize:8, color:G.label, fontFamily:'DM Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:6 }}>Category</div>
          <div style={{ display:'flex', flexWrap:'wrap', gap:5, marginBottom:10 }}>
            {GEAR_CATS.map(([k,l])=><GhostChip key={k} label={l} active={cCat===k} onPress={()=>setCCat(k)} />)}
          </div>
          <div style={{ marginBottom:10 }}>
            <input autoFocus placeholder="Name…" value={cName} onChange={e=>setCName(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter') addCustom(); }} style={smallInput} />
          </div>
          {cCat==='grinder' && (
            <>
              <div style={{ fontSize:8, color:G.label, fontFamily:'DM Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:6 }}>How do you set grind size?</div>
              <div style={{ display:'flex', gap:5, marginBottom:10 }}>
                {['clicks','dial','stepless'].map(a=><GhostChip key={a} label={a} active={cAdj===a} onPress={()=>setCAdj(a)} />)}
              </div>
            </>
          )}
          <div onClick={()=>setCShare(s=>!s)} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10, cursor:'pointer' }}>
            <div style={{ width:14, height:14, borderRadius:4, flexShrink:0,
              border:'0.5px solid '+(cShare?P.cafe:G.chipBorder),
              background: cShare?P.cafe:G.surface,
              display:'flex', alignItems:'center', justifyContent:'center' }}>
              {cShare && <span style={{ fontSize:9, color:'#182635', lineHeight:1 }}>✓</span>}
            </div>
            <span style={{ fontSize:9, color:G.label, fontFamily:'DM Mono, monospace', fontWeight:300 }}>share with the community library</span>
          </div>
          <div style={{ display:'flex', gap:8 }}>
            <div onClick={addCustom} style={{ flex:1, background:P.cafe, borderRadius:8, padding:'8px', textAlign:'center', cursor:'pointer' }}>
              <span style={{ fontSize:10, color:'#182635', fontFamily:'DM Mono, monospace' }}>add</span>
            </div>
            <div onClick={()=>{ setCustom(false); setCName(''); setCShare(false); }} style={{ flex:1, border:'1px solid '+G.chipBorder, borderRadius:8, padding:'8px', textAlign:'center', cursor:'pointer' }}>
              <span style={{ fontSize:10, color:G.label, fontFamily:'DM Mono, monospace' }}>cancel</span>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Account (Supabase auth, email + password) ────────────────────────────────
function AccountCard({ session, syncState, lastSyncAt, onSync }) {
  const [mode, setMode]   = useState('signin'); // signin | signup
  const [email, setEmail] = useState('');
  const [pw, setPw]       = useState('');
  const [busy, setBusy]   = useState(false);
  const [err, setErr]     = useState('');
  if (!SB) return null;

  const inputStyle = { fontSize:11, color:G.text, background:G.surface, border:'1px solid '+G.border,
    borderRadius:10, padding:'10px 12px', fontFamily:'DM Mono, monospace', fontWeight:300 };

  const submit = async () => {
    const em = email.trim().toLowerCase();
    if (!em.includes('@')) { setErr('enter a valid email'); return; }
    if (pw.length < 6) { setErr('password must be at least 6 characters'); return; }
    setBusy(true); setErr('');
    const fn = mode==='signup' ? 'signUp' : 'signInWithPassword';
    const { error } = await SB.auth[fn]({ email: em, password: pw });
    setBusy(false);
    if (error) setErr(error.message.toLowerCase());
    // on success onAuthStateChange updates session and this card re-renders signed-in
  };

  return (
    <div style={{ background:P.cardBg, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 14px', marginBottom:8 }}>
      <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'DM Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:10 }}>Account</div>
      {session ? (
        <>
          <div style={{ fontSize:11, color:G.text, fontFamily:'DM Mono, monospace', fontWeight:300 }}>
            signed in as <span style={{ color:P.cafe }}>{session.user.email}</span>
          </div>
          <div style={{ fontSize:9, fontFamily:'DM Mono, monospace', fontWeight:300, marginTop:4, lineHeight:1.6,
            color: syncState==='error' ? P.cafe : P.headerMuted }}>
            {syncState==='syncing' ? '↻ syncing…'
              : syncState==='error' ? 'sync failed — check connection & retry'
              : lastSyncAt ? '✓ synced '+formatTime(lastSyncAt.toISOString())
              : 'waiting for first sync…'}
          </div>
          <div style={{ display:'flex', gap:8, marginTop:10 }}>
            <div onClick={onSync}
              style={{ flex:1, border:'1px solid '+P.brew, borderRadius:9, padding:'8px', textAlign:'center',
                cursor:'pointer', opacity: syncState==='syncing'?0.5:1 }}>
              <span style={{ fontSize:10, color:P.brew, fontFamily:'DM Mono, monospace' }}>sync now</span>
            </div>
            <div onClick={()=>SB.auth.signOut()}
              style={{ flex:1, border:'1px solid '+G.chipBorder, borderRadius:9, padding:'8px', textAlign:'center', cursor:'pointer' }}>
              <span style={{ fontSize:10, color:G.label, fontFamily:'DM Mono, monospace' }}>sign out</span>
            </div>
          </div>
        </>
      ) : (
        <>
          <div style={{ fontSize:9, color:P.headerMuted, fontFamily:'DM Mono, monospace', fontWeight:300, marginBottom:8, lineHeight:1.6 }}>
            {mode==='signup' ? 'create an account to back up your diary & sync across devices' : 'sign in to your account'}
          </div>
          <input type="email" inputMode="email" autoComplete="email" placeholder="you@example.com" value={email}
            onChange={e=>setEmail(e.target.value)}
            style={{ ...inputStyle, marginBottom:8, width:'100%' }} />
          <input type="password" autoComplete={mode==='signup'?'new-password':'current-password'}
            placeholder="password" value={pw}
            onChange={e=>setPw(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') submit(); }}
            style={{ ...inputStyle, marginBottom:8, width:'100%' }} />
          <div onClick={busy?undefined:submit} style={{ background:P.cafe, borderRadius:9, padding:'10px', textAlign:'center',
            cursor:'pointer', opacity: busy?0.6:1 }}>
            <span style={{ fontSize:10, color:'#182635', fontFamily:'DM Mono, monospace' }}>
              {busy ? 'please wait…' : mode==='signup' ? 'create account' : 'sign in'}
            </span>
          </div>
          <div onClick={()=>{ setMode(mode==='signup'?'signin':'signup'); setErr(''); }}
            style={{ marginTop:8, textAlign:'center', cursor:'pointer' }}>
            <span style={{ fontSize:9, color:P.headerMuted, fontFamily:'DM Mono, monospace' }}>
              {mode==='signup' ? 'already have an account? sign in' : 'new here? create an account'}
            </span>
          </div>
          {err && <div style={{ fontSize:9, color:P.cafe, fontFamily:'DM Mono, monospace', marginTop:8, textAlign:'center' }}>{err}</div>}
        </>
      )}
    </div>
  );
}

              <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'DM Mono, monospace', marginTop:4, textTransform:'uppercase', letterSpacing:'0.06em' }}>{l}</div>

            <div style={{ background:P.cardBg, border:'0.5px solid '+P.cardStroke, borderRadius:14, padding:'12px 14px', marginBottom:8 }}>
              <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'DM Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:6 }}>Community</div>
              <div style={{ fontSize:10, color:G.text, fontFamily:'DM Mono, monospace', fontWeight:300, lineHeight:1.6 }}>
                {n} submission{n!==1?'s':''} queued — will sync automatically once community sharing goes live.
              </div>

          );

          <div style={{ fontSize:8, color:P.headerMuted, fontFamily:'DM Mono, monospace', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:8 }}>About</div>
          <div style={{ fontSize:12, color:G.text, fontFamily:'DM Mono, monospace', fontWeight:300, lineHeight:1.6 }}>
            Track coffee experiences, at home or outside. Log cafés, home brews, tasting notes, and brew parameters — all in one place.
          </div>
        </div>
        <div style={{ height:16 }} />
      </div>
      <TabBar active={4} onTab={onTab} onAdd={onAdd} />
    </div>
  );
}

function BeanPicker({ beans=[], value='', onChange, onBeanSelect }) {
  const [open, setOpen] = useState(false);
  const [customMode, setCustomMode] = useState(beans.length===0 || (!!value && !beans.some(b=>b.name===value)));
  if (customMode || beans.length===0) return (
    <div style={{ marginBottom:12 }}>
      <div style={{ fontSize:8.5, color:G.label, fontFamily:'DM Mono, monospace',
        marginBottom:5, letterSpacing:'0.1em', textTransform:'uppercase' }}>Bean Name</div>
      <div style={{ height:42, background:G.surface, border:'1px solid '+G.border,
        borderRadius:10, display:'flex', alignItems:'center', padding:'0 14px' }}>
        <input placeholder="Enter bean name…" value={value}
          onChange={e=>onChange(e.target.value)} style={{ fontSize:12, color:G.text }} />
      </div>
      {beans.length>0 && (
        <div onClick={()=>{ setCustomMode(false); onChange(''); }}
          style={{ fontSize:9, color:P.cafe, marginTop:5, fontFamily:'DM Mono, monospace', cursor:'pointer' }}>
          ← choose from saved beans
        </div>
      )}
    </div>
  );
  return (
    <div style={{ marginBottom:12 }}>
      <div style={{ fontSize:8.5, color:G.label, fontFamily:'DM Mono, monospace',
        marginBottom:5, letterSpacing:'0.1em', textTransform:'uppercase' }}>Bean Name</div>
      <div onClick={()=>setOpen(o=>!o)} style={{ height:42, background:G.surface,
        border:'1px solid '+(open?P.cafe:G.border),
        borderRadius: open ? '10px 10px 0 0' : 10,
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'0 14px', cursor:'pointer' }}>
        <span style={{ fontSize:12, color:value?G.text:G.placeholder,
          fontFamily:'DM Mono, monospace', fontWeight:300 }}>{value||'Select a bean…'}</span>
        <span style={{ fontSize:9, color:G.label }}>{open?'▲':'▼'}</span>
